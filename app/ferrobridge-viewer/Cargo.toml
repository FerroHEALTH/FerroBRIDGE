[package]
name = "ferrobridge-viewer"
description = "The FerroBRIDGE operator console: a Leptos app rendered on the server and hydrated, with a backend-for-frontend over the bridge's public HTTP surface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# The application is never published, whatever the workspace switch says.
publish = false

# One crate, two halves (the Leptos book, server-side rendering): the rlib
# feeds the server binary and the cdylib is the WebAssembly bundle the
# browser hydrates with. cargo-leptos builds the cdylib for wasm32 and the
# binary for the host.
[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "ferrobridge-viewer"
path = "src/main.rs"

# Both halves on every target. The server half and the browser half are
# chosen by target rather than by Cargo feature, so `--all-features` over the
# workspace can never turn both on at once; a target dependency's features
# apply only to a build for that target (the Cargo reference, resolver
# version 2 and later). No specification governs this: our own design.
[dependencies]
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { workspace = true, features = ["hydrate"] }
wasm-bindgen.workspace = true
console_error_panic_hook.workspace = true

# The server half. Of the workspace's own crates it may link
# openehr-mapping-core and fhir-types (r4) and no other, and the browser half
# links none (docs/architecture.md section 4.10); tests/it/boundary.rs walks
# the resolved graph and fails on any other.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The per-request script nonce of the Content-Security-Policy rides `nonce`.
leptos = { workspace = true, features = ["ssr", "nonce"] }
leptos_axum.workspace = true
leptos_meta = { workspace = true, features = ["ssr"] }
leptos_router = { workspace = true, features = ["ssr"] }
axum.workspace = true
clap.workspace = true
# The R4 CapabilityStatement the bridge client reads from `/fhir/metadata`,
# in the terminology root set of the generated model.
fhir-types = { workspace = true, features = ["r4", "terminology"] }
http.workspace = true
# The bridge client, and the healthcheck job asking the console beside it.
reqwest.workspace = true
# A secret read from the configuration, zeroed when dropped.
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
toml.workspace = true
# The site bundle is served brotli- or gzip-compressed, as the request's
# Accept-Encoding chooses.
tower-http = { workspace = true, features = ["set-header", "compression-br", "compression-gzip"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile.workspace = true
# The router driven in-process with `ServiceExt::oneshot`.
tower.workspace = true
wiremock.workspace = true

[lints]
workspace = true

# cargo-leptos: the site bundle (the WebAssembly, its JavaScript glue and the
# stylesheet) under target/site, the server binary beside it.
[package.metadata.leptos]
output-name = "ferrobridge-viewer"
site-root = "target/site"
site-pkg-dir = "pkg"
# The stylesheet: Tailwind 4, built by the standalone CLI at the version
# scripts/release/viewer-site.sh sets (LEPTOS_TAILWIND_VERSION).
tailwind-input-file = "style/tailwind.css"
site-addr = "127.0.0.1:3000"
reload-port = 3001
lib-profile-release = "wasm-release"
