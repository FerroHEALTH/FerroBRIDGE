[package]
name = "ferrobridge-console"
description = "The FerroBRIDGE operator console: a Leptos app rendered on the server with its interactive parts hydrated as islands, and a backend-for-frontend over the bridge's public HTTP surface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# The application is never published, whatever the workspace switch says.
publish = false

# One crate, two halves (the Leptos book, server-side rendering): the rlib
# feeds the server binary and the cdylib is the WebAssembly bundle whose
# islands the browser hydrates. cargo-leptos builds the cdylib for wasm32 and
# the binary for the host.
[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "ferrobridge-console"
path = "src/main.rs"

# Both halves on every target. The server half and the browser half are
# chosen by target rather than by Cargo feature, so `--all-features` over the
# workspace can never turn both on at once; a target dependency's features
# apply only to a build for that target (the Cargo reference, resolver
# version 2 and later). No specification governs this: our own design.
[dependencies]
# The whole page hydrates in the browser (FerroUI `docs/consoles.md`, "How a
# console builds"): the server draws it, the browser takes it over, and every
# page after the first is drawn in the browser, its code loaded per lazy
# route. Neither half turns on the `leptos` feature `islands`.
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
# The state the server read and every bridge document cross to the browser
# as JSON, through serde.
serde.workspace = true
serde_json.workspace = true
# The FerroHEALTH components, stylesheet and role tokens, in both halves;
# the stylesheet and the FerroBRIDGE theme are served from it as they stand.
ferrohealth-ui.workspace = true
# The console's own string catalogs under locales/, embedded in both halves,
# so a page drawn in the browser speaks as the server's does.
fluent-templates.workspace = true
# The bridge's health and operator documents, the contract the bridge
# serializes with (docs/architecture.md section 4.10), drawn in both halves.
ferrobridge-operator-api.workspace = true
# The `Diagnostic` the operator API answers, read in its serde form.
openehr-mapping-core.workspace = true
# The status of a bridge refusal.
http.workspace = true
thiserror.workspace = true
# The bridge's address a page names, and the words of a search link.
url.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { workspace = true, features = ["hydrate"] }
wasm-bindgen.workspace = true
# The hydration future, run before the leptos executor exists.
wasm-bindgen-futures.workspace = true
console_error_panic_hook.workspace = true

# The server half. Of the workspace's own crates it may link
# openehr-mapping-core, fhir-types (r4) and ferrobridge-operator-api and no
# other, and the browser half
# links none (docs/architecture.md section 4.10); tests/it/boundary.rs walks
# the resolved graph and fails on any other.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The per-request script nonce of the Content-Security-Policy rides `nonce`.
leptos = { workspace = true, features = ["ssr", "nonce"] }
leptos_axum.workspace = true
leptos_meta = { workspace = true, features = ["ssr"] }
leptos_router = { workspace = true, features = ["ssr"] }
# The random session ids, PKCE verifiers, states and nonces, the SHA-256 of
# the PKCE challenge (RFC 7636 §4.2) and the constant-time comparisons, from
# the crypto library rustls already builds on.
aws-lc-rs.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
# The `__Host-` session cookies (RFC 6265bis).
cookie.workspace = true
# The R4 CapabilityStatement the bridge client reads from `/fhir/metadata`
# and the console reduces to the operator contract's `Capability`, and the
# `OperationOutcome` and `Parameters` of a run, in the terminology root set
# of the generated model.
fhir-types = { workspace = true, features = ["r4", "terminology"] }
# The ID Token of a sign-in, verified against the provider's JWK Set
# (OpenID Connect Core 1.0 §3.1.3.7).
jsonwebtoken.workspace = true
# The bridge client, the OpenID Provider's client, and the healthcheck job
# asking the console beside it.
reqwest.workspace = true
# A secret read from the configuration and every token a session holds,
# zeroed when dropped.
secrecy.workspace = true
# `sync` holds one refresh of a session's access token at a time.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
toml.workspace = true
# The site bundle is served brotli- or gzip-compressed, as the request's
# Accept-Encoding chooses.
tower-http = { workspace = true, features = ["set-header", "compression-br", "compression-gzip"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The test OpenID Provider the sign-in, the refresh and the sign-out run
# against; a dev-dependency links into no shipped artifact.
ferrobridge-testkit.workspace = true
tempfile.workspace = true
# The router driven in-process with `ServiceExt::oneshot`.
tower.workspace = true
wiremock.workspace = true

[lints]
workspace = true

# cargo-leptos: the site bundle (the WebAssembly and its JavaScript glue)
# under target/site, the server binary beside it. The stylesheet and the
# FerroBRIDGE theme are the library's, both served by the server from the
# binary (crate::server), so the bundle carries no CSS.
[package.metadata.leptos]
output-name = "ferrobridge-console"
site-root = "target/site"
site-pkg-dir = "pkg"
# Copied into the site root as it stands: the brand favicon, which a browser
# asks for at /favicon.ico on every first page (#602).
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
lib-profile-release = "wasm-release"
# A dev build keeps its component types, as the server half does, so the
# bundle hydrates the pages the server rendered.
disable-erase-components = true
