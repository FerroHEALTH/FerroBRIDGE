[package]
name = "ferrobridge-console"
description = "The FerroBRIDGE operator console: every page drawn on the server from FerroUI's components, and a backend-for-frontend over the bridge's public HTTP surface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# The application is never published, whatever the workspace switch says.
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "ferrobridge-console"
path = "src/main.rs"

# Of the workspace's own crates the console may link openehr-mapping-core,
# fhir-types (r4) and ferrobridge-operator-api and no other, and no Leptos
# crate or WebAssembly glue at all (docs/architecture.md section 4.10);
# tests/it/boundary.rs walks the resolved graph and fails on any other.
[dependencies]
# The FerroHEALTH components, stylesheet, role tokens and script modules,
# every page drawn on the server (FerroUI `docs/consoles.md`, "How a console
# builds"); its default `axum` feature serves the library's assets.
ferrohealth-ui.workspace = true
serde.workspace = true
serde_json.workspace = true
# The console's own string catalogs under locales/.
fluent-templates.workspace = true
# The bridge's health and operator documents, the contract the bridge
# serializes with (docs/architecture.md section 4.10).
ferrobridge-operator-api.workspace = true
# The family's readiness document `GET /health/readiness` answers, and the
# registry the console's own health routes read.
ferrohealth-health = { workspace = true, features = ["registry"] }
# The `Diagnostic` the operator API answers, read in its serde form.
openehr-mapping-core.workspace = true
http.workspace = true
thiserror.workspace = true
# The bridge's address a page names, and the words of a search link.
url.workspace = true
# The import page reads its ZIP from a multipart form post.
axum = { workspace = true, features = ["multipart"] }
clap.workspace = true
# The family's process plumbing (FerroSYS): the configuration loader and its
# `_file` secrets, the console log, the health routes over a registry and a
# lifecycle, the browser security headers, the same-origin check, the drain,
# the healthcheck and the `serve`, `config check` and `healthcheck`
# subcommands.
ferrohealth-config.workspace = true
ferrohealth-secret.workspace = true
ferrohealth-server = { workspace = true, features = ["console"] }
ferrohealth-telemetry.workspace = true
# The R4 CapabilityStatement the bridge client reads from `/fhir/metadata`
# and the console reduces to the operator contract's `Capability`, and the
# `OperationOutcome` and `Parameters` of a run, in the terminology root set
# of the generated model.
fhir-types = { workspace = true, features = ["r4", "terminology"] }
# The operators' sign-in and their session (FerroAUTH): the `[oidc]` and
# `[session]` sections, the store, the refresh before an access token
# expires, and with `axum` the routes `/login`, `/auth/callback`, `/logout`
# and `/session` and the middleware every page sits behind.
ferrohealth-session = { workspace = true, features = ["axum"] }
# The relying party the sign-in runs through, whose refusals a stopped
# sign-in names, and the scope values the console checks `[oidc]` for.
ferrohealth-smart = { workspace = true, features = ["oidc"] }
# The bridge client and the OpenID Provider's client.
reqwest.workspace = true
# The operator's access token on its way to the bridge, zeroed when dropped.
secrecy.workspace = true
# `sync` keeps each document a request reads from the bridge once.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
# The sign-in cases check the PKCE challenge (RFC 7636 §4.2) and a
# confidential client's Basic credentials.
aws-lc-rs.workspace = true
base64.workspace = true
# The test OpenID Provider the sign-in, the refresh and the sign-out run
# against; a dev-dependency links into no shipped artifact.
ferrobridge-testkit.workspace = true
# `test-clock` gives the session tests a time they move, so a timeout is
# reached without waiting for it; it is enabled for the tests alone.
ferrohealth-session = { workspace = true, features = ["axum", "test-clock"] }
# The sign-in cases sign a shared-secret ID Token the console must refuse.
jsonwebtoken.workspace = true
tempfile.workspace = true
# The router driven in-process with `ServiceExt::oneshot`.
tower.workspace = true
# The tests capture the log into memory.
tracing-subscriber.workspace = true
wiremock.workspace = true

[lints]
workspace = true
