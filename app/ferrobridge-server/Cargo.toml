[package]
name = "ferrobridge-server"
description = "The FerroBRIDGE server: the FHIR facade and the OMOP ETL runner over an openEHR CDR"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

# A thin main.rs over a testable lib.rs (.claude/rules/testing.md).
[lib]
path = "src/lib.rs"

[[bin]]
name = "ferrobridge"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# The per-call engine implements the openehr-its client runtime's Transport.
async-trait.workspace = true
axum.workspace = true
clap.workspace = true
ferrobridge-term = { workspace = true, features = ["smart"] }
# The HL7 v2 face: the MLLP listener, the parse, the acknowledgment and the
# v2-to-FHIR ConceptMap interpreter.
ferrobridge-hl7v2.workspace = true
# The generated FHIR R4 model the facade authors its wire bodies with.
fhir-types = { workspace = true, features = ["r4", "resources"] }
# The mapping language the facade runs: the loader, the compiler and the
# bidirectional engine (docs/architecture.md section 4.6).
fhirconnect.workspace = true
# The health and operator documents, shared with the operator console.
ferrobridge-operator-api.workspace = true
http.workspace = true
# The one clock: the instant every composition default of one ingest is taken
# from.
jiff.workspace = true
# The SMART resource server in front of the facade and the operator API, and
# the client credentials token of the CDR and terminology lanes.
ferrohealth-smart = { workspace = true, features = ["axum"] }
# The ADL 2 HRID parser an adl2 template ETag is read with.
openehr-adl.workspace = true
# The AOM2 operational template the adl2 route serves.
openehr-am.workspace = true
openehr-base.workspace = true
# The ITS wire layer, the generated ITS-REST client the CDR is called through
# included.
openehr-its.workspace = true
openehr-mapping-core.workspace = true
# The ETL checks its configured AQL at load (docs/architecture.md section 5.4).
openehr-query.workspace = true
openehr-rm.workspace = true
# The mapping language the ETL runs: the loader, the compiler and the engine
# (docs/architecture.md section 5.2).
omocl.workspace = true
# The OMOP sink: the record graph, the CDM writer and the derived tables.
omop-cdm = { workspace = true, features = ["database"] }
# The AQL result set arrives as a stream of pages.
futures-core.workspace = true
futures-util.workspace = true
# The embedded identity store (docs/architecture.md section 9).
redb.workspace = true
# The HTTP engine error the CDR client's transport can refuse to build with.
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
# The search declarations beside the context mappings are YAML.
serde-saphyr.workspace = true
serde_json.workspace = true
# The connection options `cdm init` opens the CDM pool with.
sqlx.workspace = true
# The digest behind a derived FHIR resource id.
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
toml.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v5"] }

# The build script reads the build instant through jiff and the locked crate
# versions through toml, both already workspace dependencies.
[build-dependencies]
jiff.workspace = true
toml.workspace = true

[dev-dependencies]
# The inbound Basic cases hash their synthetic password at test time.
argon2.workspace = true
# The inbound token cases sign with key pairs generated at test time.
aws-lc-rs.workspace = true
ferrobridge-testkit.workspace = true
# The inbound token cases mint their tokens with those key pairs.
jsonwebtoken.workspace = true
# The OMOP round trip pins its rows as a reviewed snapshot.
insta.workspace = true
# The usage report cases validate every report against the vendored FerroPULSE
# envelope schema.
jsonschema.workspace = true
# The CDR end-to-end lane builds the Web Template of the template it read.
openehr-sdt.workspace = true
# The shutdown cases drive a real socket, so they need a real HTTP client.
reqwest.workspace = true
tempfile.workspace = true
# The ETL cases dump the CDM through the container engine's exec API.
testcontainers.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net"] }
# The ETL cases read back what the writer wrote.
tokio-postgres.workspace = true
tower.workspace = true
wiremock.workspace = true

[lints]
workspace = true
