# The context the sectioned facade cases run: one profile onto the
# synthetic ferrobridge.diagnose_sectioned.v1 template of the testkit, whose
# diagnoses sit inside one SECTION. The profile URL is
# example.org, which RFC 6761 section 6.5 reserves for examples.
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrobridge_sectioned.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: "http://example.org/fhir/StructureDefinition/ferrobridge-sectioned-diagnosis"
  template:
    id: "ferrobridge.diagnose_sectioned.v1"
  archetypes:
    - "ferrobridge_facade"
  start: "ferrobridge_facade"
