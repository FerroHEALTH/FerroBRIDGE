# The search the facade suite declares beside its context: the EHR's subject,
# the problem code as a token, the problem name as a string and the date of
# onset as a date, each read under the bound problem_diagnosis entry, and the
# composition's start time as a date read under the composition, over the
# synthetic ferrobridge.diagnoses.v1 template.
context: ferrobridge_facade.context
patient:
  parameters: [patient, subject]
order:
  - v/commit_audit/time_committed/value
  - v/uid/value
parameters:
  code:
    type: token
    node: { class: EVALUATION, archetype: openEHR-EHR-EVALUATION.problem_diagnosis.v1 }
    path: data[at0001]/items[at0002]/value
    systems:
      "http://snomed.info/sct": SNOMED-CT
  diagnosis-name:
    type: string
    node: { class: EVALUATION, archetype: openEHR-EHR-EVALUATION.problem_diagnosis.v1 }
    path: data[at0001]/items[at0002]/value/value
  onset-date:
    type: date
    node: { class: EVALUATION, archetype: openEHR-EHR-EVALUATION.problem_diagnosis.v1 }
    path: data[at0001]/items[at0077]/value/value
  context-start:
    type: date
    path: context/start_time/value
