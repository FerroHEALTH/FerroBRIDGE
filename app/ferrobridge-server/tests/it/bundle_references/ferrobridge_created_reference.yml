# A FerroBRIDGE-authored model mapping whose evidence mapping maps the
# referenced Observation's code onto the problem-diagnosis comment going in
# and creates that Observation going out, the reference shape of
# types-of-mappings/concept-type/Reference.adoc.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_created_reference
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-EVALUATION.problem_diagnosis.v1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Condition

mappings:
  - name: "problemName"
    with:
      fhir: "$resource.code"
      openehr: "$archetype/data[at0001]/items[at0002]"
      type: "CODEABLECONCEPT"

  - name: "evidence"
    with:
      fhir: "$resource.evidence.detail"
      openehr: "$reference"
    reference:
      resourceType: "Observation"
      mappings:
        - name: "evidenceCode"
          with:
            fhir: "$fhirRoot.code"
            openehr: "$archetype/data[at0001]/items[at0069]"
            type: "CODEABLECONCEPT"
        - name: "evidenceStatus"
          unidirectional: "openehr->fhir"
          with:
            fhir: "$fhirRoot"
          manual:
            - name: "status"
              fhir:
                - path: "status"
                  value: "final"
