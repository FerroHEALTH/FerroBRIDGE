# The search the facade suite declares beside its context: the EHR's subject,
# the problem code as a token, the problem name as a string and the date of
# onset as a date, over the synthetic ferrobridge.diagnose.v1 template.
context: ferrobridge_facade.context
patient:
  parameters: [patient, subject]
order:
  - v/commit_audit/time_committed/value
  - v/uid/value
parameters:
  code:
    type: token
    code: c/content[openEHR-EHR-EVALUATION.problem_diagnosis.v1]/data[at0001]/items[at0002]/value/defining_code/code_string
    system: c/content[openEHR-EHR-EVALUATION.problem_diagnosis.v1]/data[at0001]/items[at0002]/value/defining_code/terminology_id/value
    systems:
      "http://snomed.info/sct": SNOMED-CT
  diagnosis-name:
    type: string
    path: c/content[openEHR-EHR-EVALUATION.problem_diagnosis.v1]/data[at0001]/items[at0002]/value/value
  onset-date:
    type: date
    path: c/content[openEHR-EHR-EVALUATION.problem_diagnosis.v1]/data[at0001]/items[at0077]/value/value
