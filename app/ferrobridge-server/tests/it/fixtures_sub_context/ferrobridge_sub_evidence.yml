# The model the sub-context starts at: the evidence Observation's code onto
# the problem qualifier cluster.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_sub_evidence
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-CLUSTER.problem_qualifier.v2
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Observation

mappings:
  - name: "code"
    with:
      fhir: "$fhirRoot.code"
      openehr: "$archetype/items[at0063]"
      type: "CODEABLECONCEPT"
