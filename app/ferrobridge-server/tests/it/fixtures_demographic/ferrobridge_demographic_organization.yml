# The model mapping the demographic suite runs: a Organization onto the synthetic
# ORGANISATION template ferrobridge.organisation.v1 of the testkit, the name onto the identity name and
# the identifier onto the details identifier.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_demographic_organization
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-DEMOGRAPHIC-ORGANISATION.ferrobridge_organisation.v1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Organization

mappings:
  - name: "name"
    with:
      fhir: "$resource.name"
      openehr: "$archetype/identities[at0003]/details[at0004]/items[at0005]"
  - name: "identifier"
    with:
      fhir: "$resource.identifier"
      openehr: "$archetype/details[at0001]/items[at0002]"
