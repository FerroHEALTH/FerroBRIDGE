# The facade suite's model mapping with one mapping that runs out of openEHR
# only, so an inbound run declares a loss located on a FHIR element.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_one_way
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-EVALUATION.problem_diagnosis.v1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Condition

mappings:
  - name: "problemDiagnose"
    with:
      fhir: "$resource.code"
      openehr: "$archetype/data[at0001]/items[at0002]"
      type: "CODEABLECONCEPT"

  - name: "comment"
    unidirectional: "openehr->fhir"
    with:
      fhir: "$resource.note.text"
      openehr: "$archetype/data[at0001]/items[at0069]"
