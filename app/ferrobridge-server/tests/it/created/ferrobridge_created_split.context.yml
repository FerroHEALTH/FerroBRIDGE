# The context of the created-resource cases whose model splits each
# anatomical-location cluster into a Condition of its own, over the synthetic
# ferrobridge.diagnose.v1 template of the testkit. The profile URL is
# example.org, which RFC 6761 section 6.5 reserves for examples.
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrobridge_created_split.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: "http://example.org/fhir/StructureDefinition/ferrobridge-created-split"
  template:
    id: "ferrobridge.diagnose.v1"
  archetypes:
    - "ferrobridge_created_split"
  start: "ferrobridge_created_split"
