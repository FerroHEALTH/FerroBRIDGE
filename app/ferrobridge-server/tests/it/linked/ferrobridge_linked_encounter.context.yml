# The linked context of the LINKED suite: an Encounter onto the synthetic
# ferrobridge.diagnose.v1 template of the testkit, committed as a
# composition of its own. The profile URL is example.org, which RFC 6761
# section 6.5 reserves for examples.
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrobridge_linked_encounter.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: "http://example.org/fhir/StructureDefinition/ferrobridge-linked-encounter"
  template:
    id: "ferrobridge.diagnose.v1"
  archetypes:
    - "ferrobridge_linked_encounter"
  start: "ferrobridge_linked_encounter"
