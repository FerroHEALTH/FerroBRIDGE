# A FerroBRIDGE-authored Composition context over the synthetic diagnose
# template, whose one section references the diagnosis as a Condition the
# run creates going out: the shape Composition/$document assembles.
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrobridge_document.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: "http://example.org/fhir/StructureDefinition/ferrobridge-document"
  template:
    id: "ferrobridge.diagnose.v1"
  archetypes:
    - "COMPOSITION.ferrobridge_report.v1.Composition"
    - "ferrobridge_document_problem"
  start: "COMPOSITION.ferrobridge_report.v1.Composition"
