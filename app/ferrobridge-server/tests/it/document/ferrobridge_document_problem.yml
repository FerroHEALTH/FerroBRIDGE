# A FerroBRIDGE-authored model mapping of the problem diagnosis onto the
# Condition a document's section references.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_document_problem
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-EVALUATION.problem_diagnosis.v1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Condition

mappings:
  - name: "problemName"
    with:
      fhir: "$fhirRoot.code"
      openehr: "$archetype/data[at0001]/items[at0002]"
      type: "CODEABLECONCEPT"
