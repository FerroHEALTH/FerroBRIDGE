#
# The FerroBRIDGE quickstart, a standalone file: download it, create the two
# secret files beside it, and run
#
#   docker compose up
#   curl http://127.0.0.1:8080/health/liveness
#
# It pulls the published image (ghcr.io/ferrohealth/ferrobridge, pinned to the
# release this file shipped with) and needs no repository checkout. The tag
# below is bumped at every release cut and scripts/checks/versions.sh keeps it
# equal to the workspace version.
#
# WHAT YOU PROVIDE. The bridge reaches an openEHR CDR over ITS-REST, a FHIR
# terminology server, and (for the OMOP target) a CDM database. Every lane is
# off until you configure it, so an unconfigured server answers `/` and
# /health/liveness and nothing else. Turn a lane on by setting its variable in
# your shell or in a .env file beside this one:
#
#   FERROBRIDGE__CDR__BASE_URL=https://cdr.example.org/openehr/v1
#   FERROBRIDGE__CDR__CREDENTIALS__BEARER_TOKEN_FILE=/run/secrets/cdr_bearer_token
#   FERROBRIDGE__TERMINOLOGY__BASE_URL=https://tx.example.org/r4
#   FERROBRIDGE__CDM__URL_FILE=/run/secrets/cdm_url
#
# The names are the server's own: every key of the configuration tree is
# reachable as FERROBRIDGE__<SECTION>__<KEY>, and every secret is read from the
# file its `_file` sibling names rather than from the environment.
#
# SECRETS. The three files under ./secrets are yours to create before the first
# `docker compose up`; compose refuses to start a service whose secret source
# is missing. A file whose lane is off may be empty, because nothing reads it.
# The `viewer` profile reads a fourth, the console's OIDC client secret. Never
# commit them.
#
#   mkdir -p secrets
#   printf 'postgresql://ferrobridge:%s@cdm:5432/omop?sslmode=disable' "$PASSWORD" > secrets/cdm_url
#   printf '%s' "$PASSWORD" > secrets/cdm_password
#   : > secrets/cdr_bearer_token
#   printf '%s' "$CLIENT_SECRET" > secrets/viewer_oidc_client_secret
#
# PORTS. The published port binds the loopback interface by default. A
# published port is DNAT'd ahead of the host firewall's own chains, so a port
# on 0.0.0.0 is reachable from the network even when the firewall says
# otherwise (https://docs.docker.com/engine/network/packet-filtering-firewalls/).
# To serve another machine, name the interface, or put a reverse proxy in
# front:
#
#   FERROBRIDGE_BIND_HOST=10.0.0.7 docker compose up
#
# HEALTH. The image is distroless and has no shell, and the binary carries no
# probe subcommand, so no service below declares a `healthcheck` over the
# bridge. Probe it from outside: GET /health/liveness answers 200 while the
# process is up, and GET /health/readiness answers 200 when every configured
# upstream answered and 503 with a JSON body naming each one otherwise.
#
# PROFILES. The `cdm` profile stands up the OMOP CDM database and applies the
# DDL; the `vocab` profile loads an OHDSI Athena export you downloaded
# yourself; the `viewer` profile runs the operator console beside the bridge.
# None of them runs on a plain `docker compose up`.

# Without this the project is named after the directory the file sits in, and
# the container, network and volume names move when you rename the directory.
name: ferrobridge

services:
  ferrobridge:
    image: ghcr.io/ferrohealth/ferrobridge:${FERROBRIDGE_VERSION:-0.0.9}
    container_name: ferrobridge
    restart: unless-stopped
    ports:
      - "${FERROBRIDGE_BIND_HOST:-127.0.0.1}:${FERROBRIDGE_PORT:-8080}:8080"
    environment:
      # The image sets the same value; it is repeated here so the address the
      # container binds is visible in `docker compose config`.
      FERROBRIDGE__SERVER__LISTEN: 0.0.0.0:8080
      # An entry with a key and no value passes the variable through from your
      # shell or .env ONLY when it is set there. That is what keeps an
      # unconfigured lane off: an empty base URL would be a boot error, an
      # absent one is a lane the server never starts.
      FERROBRIDGE__CDR__BASE_URL:
      FERROBRIDGE__CDR__CREDENTIALS__BEARER_TOKEN_FILE:
      FERROBRIDGE__TERMINOLOGY__BASE_URL:
      FERROBRIDGE__TERMINOLOGY__WIRE_VERSION:
      FERROBRIDGE__CDM__URL_FILE:
      # The operator API (it needs [auth]) saves console mapping files under
      # this path, the writable volume below; it saves nothing while it is off.
      FERROBRIDGE__OPERATOR__ENABLED:
      FERROBRIDGE__OPERATOR__MAPPING_DIR: /var/lib/ferrobridge/mappings
      # `auto` renders pretty output on a terminal and JSON otherwise.
      FERROBRIDGE__TELEMETRY__FORMAT: ${FERROBRIDGE_LOG_FORMAT:-auto}
      FERROBRIDGE__TELEMETRY__FILTER: ${FERROBRIDGE_LOG_FILTER:-info}
      # The installation report to FerroPULSE: on by default, and
      # FERROBRIDGE__USAGE_REPORT__ENABLED=false in your shell or .env stops
      # it. What it sends and when:
      # https://ferrobridge.eu/docs/operate/usage-report.html
      FERROBRIDGE__USAGE_REPORT__ENABLED: ${FERROBRIDGE__USAGE_REPORT__ENABLED:-true}
      FERROBRIDGE__USAGE_REPORT__DEPLOYMENT: compose
      # The instance id lives here, on the one writable volume.
      FERROBRIDGE__USAGE_REPORT__STATE_DIR: /home/nonroot/state
    secrets:
      - cdm_url
      - cdr_bearer_token
    # The server writes two things, each to its own volume: the usage report's
    # state under the image's home directory (owned by its runtime user, uid
    # 65532, so a fresh named volume there is writable), and the console's
    # saved mapping files. No cache, no scratch file, no upload directory, and
    # every secret is read once at boot, so the root filesystem is read-only.
    # Should a lane ever need another writable path, mount it for that path
    # alone rather than dropping this line.
    read_only: true
    # The saved mapping files survive a restart. The container runs as
    # 65532:65532, so create the directory and hand it over before the first
    # `docker compose up`:
    #
    #   mkdir -p operator-mappings && sudo chown 65532:65532 operator-mappings
    volumes:
      - ferrobridge-state:/home/nonroot
      - type: bind
        source: ${FERROBRIDGE_OPERATOR_MAPPINGS:-./operator-mappings}
        target: /var/lib/ferrobridge/mappings
        bind:
          create_host_path: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # The OMOP CDM database. The bridge writes CDM rows here and reads the loaded
  # OHDSI vocabulary from it; the FHIR facade needs none of it.
  #
  #   docker compose --profile cdm up
  #
  # The password never reaches the environment: the official image reads
  # POSTGRES_PASSWORD_FILE, so the value lives in ./secrets/cdm_password and in
  # the connection URL in ./secrets/cdm_url, which must agree.
  cdm:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    profiles: [cdm, vocab]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CDM_DATABASE:-omop}
      POSTGRES_USER: ${CDM_USER:-ferrobridge}
      POSTGRES_PASSWORD_FILE: /run/secrets/cdm_password
    secrets:
      - cdm_password
    volumes:
      - cdm-data:/var/lib/postgresql/data
    # What gates cdm-init and vocab-load below: the server accepts connections
    # only after the first-run initialisation has finished.
    healthcheck:
      test:
        ["CMD", "pg_isready", "-U", "${CDM_USER:-ferrobridge}", "-d", "${CDM_DATABASE:-omop}"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10
    # The entrypoint starts as root to fix ownership and drops to the postgres
    # user itself, so this image keeps the capabilities that needs and gains no
    # new ones. The bridge above drops everything.
    security_opt:
      - no-new-privileges:true

  # One shot: apply the OMOP CDM v5.4 DDL and the bridge schema to the
  # database above.
  #
  #   docker compose --profile cdm run --rm cdm-init
  cdm-init:
    image: ghcr.io/ferrohealth/ferrobridge:${FERROBRIDGE_VERSION:-0.0.9}
    profiles: [cdm]
    command: ["cdm", "init"]
    restart: "no"
    depends_on:
      cdm:
        condition: service_healthy
    environment:
      FERROBRIDGE__CDM__URL_FILE: /run/secrets/cdm_url
    secrets:
      - cdm_url
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # One shot: load an OHDSI Athena vocabulary export into the CDM database.
  # The export is a licensed download you obtained yourself; it is bind-mounted
  # read-only and no vocabulary byte ever enters the image or a release asset.
  #
  #   FERROBRIDGE_VOCAB_DIR=/srv/athena/2026-09 \
  #     docker compose --profile vocab run --rm vocab-load
  #
  # TODO(#233): `vocab load` exits 2 today naming that issue, so this service is
  # the shape the job runs in rather than a working load.
  vocab-load:
    image: ghcr.io/ferrohealth/ferrobridge:${FERROBRIDGE_VERSION:-0.0.9}
    profiles: [vocab]
    command: ["vocab", "load", "/vocabulary", "--schema", "cdm"]
    restart: "no"
    depends_on:
      cdm:
        condition: service_healthy
    environment:
      FERROBRIDGE__CDM__URL_FILE: /run/secrets/cdm_url
    secrets:
      - cdm_url
    volumes:
      - type: bind
        source: ${FERROBRIDGE_VOCAB_DIR:-./vocabulary}
        target: /vocabulary
        read_only: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # The operator console (ghcr.io/ferrohealth/ferrobridge-viewer), a client of
  # the bridge's HTTP surface that operators sign in to with OpenID Connect.
  #
  #   docker compose --profile viewer up
  #   open http://127.0.0.1:3000/
  #
  # Sign-in is off until you name your OpenID Provider and register the
  # console as a confidential client there, with the redirect URI
  # http://127.0.0.1:3000/auth/callback (or the address you publish). Set the
  # provider in your shell or .env, and point the secret at the file below:
  #
  #   FERROBRIDGE_VIEWER__OIDC__ISSUER=https://idp.example.org/realms/ferrobridge
  #   FERROBRIDGE_VIEWER__OIDC__AUTHORIZATION_ENDPOINT=https://idp.example.org/realms/ferrobridge/protocol/openid-connect/auth
  #   FERROBRIDGE_VIEWER__OIDC__TOKEN_ENDPOINT=https://idp.example.org/realms/ferrobridge/protocol/openid-connect/token
  #   FERROBRIDGE_VIEWER__OIDC__JWKS_URI=https://idp.example.org/realms/ferrobridge/protocol/openid-connect/certs
  #   FERROBRIDGE_VIEWER__OIDC__CLIENT_ID=ferrobridge-viewer
  #   FERROBRIDGE_VIEWER__OIDC__CLIENT_SECRET_FILE=/run/secrets/viewer_oidc_client_secret
  #   FERROBRIDGE_VIEWER__OIDC__REDIRECT_URI=http://127.0.0.1:3000/auth/callback
  #   FERROBRIDGE_VIEWER__SESSION__SECURE_COOKIE=false
  #
  # The last line is for a console served over plain http on loopback, as
  # above, and the console refuses it anywhere else; behind an https proxy,
  # leave it unset so the session cookie carries Secure.
  #
  # The bridge refuses the console's calls unless it validates the operator's
  # token: turn on its [auth] section, and [operator] for the mapping files.
  # The image's own HEALTHCHECK runs the binary's `healthcheck` subcommand.
  viewer:
    image: ghcr.io/ferrohealth/ferrobridge-viewer:${FERROBRIDGE_VERSION:-0.0.9}
    profiles: [viewer]
    restart: unless-stopped
    depends_on:
      - ferrobridge
    ports:
      - "${FERROBRIDGE_BIND_HOST:-127.0.0.1}:${FERROBRIDGE_VIEWER_PORT:-3000}:3000"
    environment:
      # The image sets the same value; repeated so `docker compose config`
      # shows the address the container binds.
      FERROBRIDGE_VIEWER__SERVER__LISTEN: 0.0.0.0:3000
      # The bridge, server to server over the compose network.
      FERROBRIDGE_VIEWER__BRIDGE__BASE_URL: http://ferrobridge:8080/
      # Passed through only when set in your shell or .env: without an issuer
      # the console offers no sign-in, while an empty one is a boot error.
      FERROBRIDGE_VIEWER__OIDC__ISSUER:
      FERROBRIDGE_VIEWER__OIDC__AUTHORIZATION_ENDPOINT:
      FERROBRIDGE_VIEWER__OIDC__TOKEN_ENDPOINT:
      FERROBRIDGE_VIEWER__OIDC__JWKS_URI:
      FERROBRIDGE_VIEWER__OIDC__CLIENT_ID:
      FERROBRIDGE_VIEWER__OIDC__CLIENT_SECRET_FILE:
      FERROBRIDGE_VIEWER__OIDC__REDIRECT_URI:
      FERROBRIDGE_VIEWER__OIDC__SCOPES:
      FERROBRIDGE_VIEWER__OIDC__OFFLINE_ACCESS:
      FERROBRIDGE_VIEWER__OIDC__END_SESSION_ENDPOINT:
      FERROBRIDGE_VIEWER__OIDC__POST_LOGOUT_REDIRECT_URI:
      FERROBRIDGE_VIEWER__SESSION__SECURE_COOKIE:
    secrets:
      - viewer_oidc_client_secret
    # The console keeps its sessions in memory and writes no file, so the
    # root filesystem is read-only and no volume is mounted.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

secrets:
  # The PostgreSQL connection URL the OMOP lane writes through, password
  # included. Read once at boot and never logged.
  cdm_url:
    file: ${FERROBRIDGE_CDM_URL_FILE:-./secrets/cdm_url}
  # The CDR credential, for a CDR that takes an RFC 6750 bearer token. For RFC
  # 7617 basic authentication set FERROBRIDGE__CDR__CREDENTIALS__USER and point
  # FERROBRIDGE__CDR__CREDENTIALS__PASSWORD_FILE at a secret of your own. For
  # a token the bridge obtains itself with the OAuth 2.0 client credentials
  # grant, leave FERROBRIDGE__CDR__CREDENTIALS__BEARER_TOKEN_FILE unset, set
  # FERROBRIDGE__CDR__CREDENTIALS__OAUTH__ISSUER (or __TOKEN_ENDPOINT) and
  # __CLIENT_ID, and point
  # FERROBRIDGE__CDR__CREDENTIALS__OAUTH__CLIENT_SECRET_FILE at a secret of
  # your own.
  cdr_bearer_token:
    file: ${FERROBRIDGE_CDR_BEARER_TOKEN_FILE:-./secrets/cdr_bearer_token}
  # The password the CDM database is created with, read by the official image.
  cdm_password:
    file: ${FERROBRIDGE_CDM_PASSWORD_FILE:-./secrets/cdm_password}
  # The operator console's OIDC client secret at your OpenID Provider, read
  # once at boot through FERROBRIDGE_VIEWER__OIDC__CLIENT_SECRET_FILE.
  viewer_oidc_client_secret:
    file: ${FERROBRIDGE_VIEWER_OIDC_CLIENT_SECRET_FILE:-./secrets/viewer_oidc_client_secret}

volumes:
  cdm-data:
  ferrobridge-state:
