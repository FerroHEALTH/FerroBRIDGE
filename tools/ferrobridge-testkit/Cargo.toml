[package]
name = "ferrobridge-testkit"
description = "Test support for the FerroBRIDGE suites: the pin-matrix reader, fixtures and stubs; never shipped"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[dependencies]
# The test OpenID Provider: its per-run ES256 key pair, the ID Tokens it
# signs, the JWK Set it publishes, and the times its claims carry.
aws-lc-rs.workspace = true
# The base64url of a code the provider approves a browser with, and of the
# PKCE challenge it holds the verifier to (RFC 7636 §4.6).
base64.workspace = true
jiff.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
# The scratch directory the throwaway TLS material is generated in.
tempfile.workspace = true
testcontainers.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
# The redirect an approved authorization request is answered with.
url.workspace = true
wiremock.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
socket2.workspace = true

[dev-dependencies]
# The FHIR examples corpora decode every resource of every version, so the
# model is built with each version and the whole resource root set.
fhir-types = { workspace = true, features = ["stu3", "r4", "r4b", "r5", "r6", "resources"] }
# The corpus suite re-hashes the vendored FHIRconnect schemas, so it needs a
# sha256 the workspace does not otherwise carry.
sha2.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "process", "io-util"] }
# The operator console's browser journeys (#602) run the bridge and the
# console in-process, path-only: neither is published, and the journeys
# drive both as the shipped binaries serve them.
ferrobridge-server = { path = "../../app/ferrobridge-server" }
ferrobridge-console = { path = "../../app/ferrobridge-console" }
anyhow.workspace = true
thirtyfour.workspace = true
# The screenshot capture compares a new image with the one on disk.
png.workspace = true
toml.workspace = true
tracing-subscriber.workspace = true

# The process group a journey's chromedriver runs in, killed with it.
[target.'cfg(unix)'.dev-dependencies]
rustix.workspace = true

[lints]
workspace = true
