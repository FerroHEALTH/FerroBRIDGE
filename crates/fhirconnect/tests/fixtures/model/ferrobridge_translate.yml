# A FerroBRIDGE-authored model mapping whose two coded mappings each name a
# concept map (manual.adoc, section ConceptMaps): the certainty, which the
# synthetic ferrobridge.diagnose.v1 template makes optional, and the problem
# name, which it requires. The concept map URLs are example.org, which
# RFC 6761 section 6.5 reserves for examples.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_translate
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-EVALUATION.problem_diagnosis.v1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Condition

mappings:
  - name: "certainty"
    with:
      fhir: "$resource.verificationStatus"
      openehr: "$archetype/data[at0001]/items[at0073]"
      type: "CODEABLECONCEPT"
    conceptmap: "http://example.org/fhir/ConceptMap/ferrobridge-certainty"

  - name: "problemName"
    with:
      fhir: "$resource.code"
      openehr: "$archetype/data[at0001]/items[at0002]"
      type: "CODEABLECONCEPT"
    conceptmap: "http://example.org/fhir/ConceptMap/ferrobridge-problems"
