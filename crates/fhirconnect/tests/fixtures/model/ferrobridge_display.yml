# A FerroBRIDGE-authored model mapping that writes a Condition's
# verificationStatus into the DV_CODED_TEXT of items[at0073], so the engine
# resolves the display of a code that carries none against the synthetic
# ferrobridge.diagnose.v1 template.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_display
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-EVALUATION.problem_diagnosis.v1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Condition

mappings:
  - name: "problemName"
    with:
      fhir: "$resource.code.text"
      openehr: "$archetype/data[at0001]/items[at0002]"

  - name: "certainty"
    with:
      fhir: "$resource.verificationStatus"
      openehr: "$archetype/data[at0001]/items[at0073]"
