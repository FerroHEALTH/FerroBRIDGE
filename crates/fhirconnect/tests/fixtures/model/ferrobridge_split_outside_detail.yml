# A FerroBRIDGE-authored model mapping of the synthetic detail CLUSTER, slotted
# below a repeating event, that splits the lots of the observation's protocol,
# outside that event: one lot per coding (HierarchyMappings.adoc, split, and
# basics/path_operators.adoc).
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_split_outside_detail
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-CLUSTER.ferrobridge_detail.v1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/CodeableConcept

preprocessor:
  hierarchy:
    with:
      fhir: "$fhirRoot.coding"
      openehr: "../../../../protocol[at0005]/items[at0009]/items[at0010]"
    split:
      openehr:
        create: "archetype"

mappings:
  - name: "note"
    with:
      fhir: "$fhirRoot.text"
      openehr: "$archetype/items[at0001]"

  - name: "lot"
    with:
      fhir: "$fhirRoot.coding.display"
      openehr: "../../../../protocol[at0005]/items[at0009]/items[at0010]"
