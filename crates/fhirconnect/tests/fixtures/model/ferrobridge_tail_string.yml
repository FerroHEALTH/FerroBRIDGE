# A FerroBRIDGE-authored model mapping that writes the first problem coding
# into the String value of the DV_TEXT problem name, the String against Coding
# pair of types-of-mappings/data-type/String.adoc, against the synthetic
# ferrobridge.diagnose.v1 template of the testkit.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_tail_string
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-EVALUATION.problem_diagnosis.v1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Condition

mappings:
  - name: "problemCoding"
    with:
      fhir: "$resource.code.coding"
      openehr: "$archetype/data[at0001]/items[at0002]/value/value"
