# A FerroBRIDGE-authored model mapping that names the EVENT node itself as
# the openEHR side of Observation.effective[x] under a parent that binds the
# event, the form the published
# laboratory_test_result.v1.yml writes ("period -> interval event, datetime
# to pointInTime event"): the alternative going in decides POINT_EVENT or
# INTERVAL_EVENT (EVENT.adoc), and the event's class coming out decides the
# alternative written.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_event_time
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-OBSERVATION.ferrobridge_reading.v1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Observation

mappings:
  - name: "reading"
    with:
      fhir: "$resource"
      openehr: "$archetype/data[at0001]/events[at0002]"
    followedBy:
      mappings:
        - name: "eventTime"
          with:
            fhir: "effective"
            openehr: "$openehrRoot"

        - name: "amount"
          with:
            fhir: "value.as(Quantity)"
            openehr: "data[at0003]/items[at0004]"

  - name: "status"
    unidirectional: "openehr->fhir"
    with:
      fhir: "$resource"
    manual:
      - name: "final"
        fhir:
          - path: "status"
            value: "final"

  - name: "code"
    unidirectional: "openehr->fhir"
    with:
      fhir: "$resource"
    manual:
      - name: "text"
        fhir:
          - path: "code.text"
            value: "Synthetic reading"
