# A FerroBRIDGE-authored model mapping that slots each Dosage of a
# MedicationStatement into the dosage cluster of the one event of the
# medication statement observation.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_dosage_statement
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-OBSERVATION.medication_statement.v0
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/MedicationStatement

mappings:
  - name: "medicationText"
    with:
      fhir: "$resource.medication.as(CodeableConcept).text"
      openehr: "$archetype/data[at0001]/events[at0002]/data[at0003]/items[openEHR-EHR-CLUSTER.medication.v2]/items[at0133]"

  - name: "dosage"
    with:
      fhir: "$resource.dosage"
      openehr: "$archetype/data[at0001]/events[at0002]/data[at0003]/items[openEHR-EHR-CLUSTER.dosage.v2]"
    slotArchetype: "ferrobridge_dosage"
