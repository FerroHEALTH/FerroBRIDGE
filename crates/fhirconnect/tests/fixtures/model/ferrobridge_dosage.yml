# A FerroBRIDGE-authored model mapping over the dosage cluster whose
# mappings name programmed functions: the administration duration and the
# interval of a non-daily timing, both read from Timing.repeat, the dose
# range, and the rate ratio over the rate and the duration.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_dosage
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-CLUSTER.dosage.v2
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Dosage

mappings:
  - name: "duration"
    with:
      fhir: "$fhirRoot.timing.repeat"
      openehr: "$archetype/items[at0102]"
    mappingCode: "dosageDurationToAdministrationDuration"

  - name: "doseAndRate"
    with:
      fhir: "$fhirRoot.doseAndRate"
      openehr: "$archetype"
    followedBy:
      mappings:
        - name: "doseRange"
          with:
            fhir: "dose.as(Range)"
            openehr: "items[at0144]"
          mappingCode: "dosageQuantityToRange"

        - name: "rateRatio"
          with:
            fhir: "rate.as(Ratio)"
            openehr: "$openehrRoot"
          mappingCode: "ratio_to_dosage"

  - name: "nonDaily"
    with:
      fhir: "$fhirRoot.timing.repeat"
      openehr: "$archetype/items[openEHR-EHR-CLUSTER.timing_nondaily.v1]"
    mappingCode: "timingNonDaily"
