# The slotted file of the caret split fixture: each Coding it is entered at
# splits into an anatomical-location cluster of its own, which carries the
# coding's display (types-of-mappings/concept-type/HierarchyMappings.adoc).
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_caret_split_location
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-CLUSTER.anatomical_location.v1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Coding

preprocessor:
  hierarchy:
    with:
      fhir: "$fhirRoot"
      openehr: "$archetype"
    split:
      openehr:
        create: "archetype"

mappings:
  - name: "site"
    with:
      fhir: "$fhirRoot.display"
      openehr: "$archetype/items[at0001]"
