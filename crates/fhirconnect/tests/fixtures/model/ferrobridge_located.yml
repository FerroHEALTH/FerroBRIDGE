# A FerroBRIDGE-authored model mapping that takes one declared loss of each
# kind a direction can raise, so the location of every loss can be asserted:
# a 0..n into a 0..1 each way (recurrence/TransformingList.adoc), and one
# mapping per direction that its unidirectional marker skips in the other.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_located
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-EVALUATION.problem_diagnosis.v1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Condition

mappings:
  - name: "commentFromBodySites"
    with:
      fhir: "$resource.bodySite"
      openehr: "$archetype/data[at0001]/items[at0069]"
      type: "CODEABLECONCEPT"

  - name: "codeTextFromSites"
    with:
      fhir: "$resource.code.text"
      openehr: "$archetype/data[at0001]/items[openEHR-EHR-CLUSTER.anatomical_location.v1]/items[at0001]"
      type: "STRING"

  - name: "recordedOutboundOnly"
    unidirectional: "openehr->fhir"
    with:
      fhir: "$resource.recordedDate"
      openehr: "$archetype/data[at0001]/items[at0077]"
      type: "DATETIME"

  - name: "problemInboundOnly"
    unidirectional: "fhir->openehr"
    with:
      fhir: "$resource.code"
      openehr: "$archetype/data[at0001]/items[at0002]"
      type: "CODEABLECONCEPT"
