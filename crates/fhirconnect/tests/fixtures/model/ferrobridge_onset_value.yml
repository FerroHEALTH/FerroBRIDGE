# A FerroBRIDGE-authored model mapping that writes the string alternative of
# Condition.onset[x] into the problem name ELEMENT, which the test turns into
# an ELEMENT whose value admits DV_TEXT and DV_DATE_TIME, so the compiler
# converts it into the DV_TEXT value node alone.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_onset_value
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-EVALUATION.problem_diagnosis.v1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Condition

mappings:
  - name: "onset"
    with:
      fhir: "$resource.onset.as(String)"
      openehr: "$archetype/data[at0001]/items[at0002]"
