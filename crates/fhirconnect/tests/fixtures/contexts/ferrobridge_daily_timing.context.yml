# The context that compiles the daily timing model mapping beside this file
# against FerroBRIDGE's medication template over the CKM archetypes, whose
# daily timing cluster leaves the time of day repeating. The profile URL is
# example.org, which RFC 6761 section 6.5 reserves for examples.
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrobridge_daily_timing.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: "http://example.org/fhir/StructureDefinition/ferrobridge-daily-timing"
  template:
    id: "openEHR-EHR-COMPOSITION.ferrobridge_medication.v1.0.0"
  archetypes:
    - "ferrobridge_daily_timing"
  start: "ferrobridge_daily_timing"
