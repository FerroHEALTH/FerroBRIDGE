# The context that compiles the event time model mapping against the synthetic
# ferrobridge.observation_single_event.v1 template under tests/fixtures/opt,
# whose single EVENT the Web Template collapses into its OBSERVATION. The
# profile URL is example.org, which RFC 6761 section
# 6.5 reserves for examples.
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrobridge_single_event_time.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: "http://example.org/fhir/StructureDefinition/ferrobridge-single-event-time"
  template:
    id: "ferrobridge.observation_single_event.v1"
  archetypes:
    - "ferrobridge_event_time"
  start: "ferrobridge_event_time"
