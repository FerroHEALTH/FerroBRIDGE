# The context that compiles the onset date and time model mapping beside
# this file against the synthetic ferrobridge.diagnose.v1 template of the
# testkit. The profile URL is example.org, which RFC 6761 section 6.5 reserves
# for examples.
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrobridge_onset_date_time.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: "http://example.org/fhir/StructureDefinition/ferrobridge-onset-choice"
  template:
    id: "ferrobridge.diagnose.v1"
  archetypes:
    - "ferrobridge_onset_date_time"
  start: "ferrobridge_onset_date_time"
