# The context that compiles the dosage model mappings beside this file
# against the vendored KDS_Medikationseintrag template, so the programmed
# functions of the dosage and timing clusters run in both directions. The
# profile URL is example.org, which RFC 6761 section 6.5 reserves for
# examples.
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrobridge_dosage.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: "http://example.org/fhir/StructureDefinition/ferrobridge-dosage"
  template:
    id: "KDS_Medikationseintrag"
  archetypes:
    - "ferrobridge_dosage_statement"
    - "ferrobridge_dosage"
  start: "ferrobridge_dosage_statement"
