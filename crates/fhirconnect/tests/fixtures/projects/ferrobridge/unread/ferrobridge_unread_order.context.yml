# A FerroBRIDGE-authored context over FerroBRIDGE's medication template whose
# start model reads the medication item of a medication order and not the
# activity's timing: the fixture for an entry attribute a run leaves unread.
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrobridge_unread_order.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: "http://example.org/fhir/StructureDefinition/ferrobridge-unread-order"
  template:
    id: "openEHR-EHR-COMPOSITION.ferrobridge_medication.v1.0.0"
  archetypes:
    - "ferrobridge_unread_order"
  start: "ferrobridge_unread_order"
