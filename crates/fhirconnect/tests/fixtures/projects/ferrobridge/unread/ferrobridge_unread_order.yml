# A FerroBRIDGE-authored model mapping of the CKM
# INSTRUCTION.medication_order.v3 that reads the medication item alone.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_unread_order
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-INSTRUCTION.medication_order.v3
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/MedicationRequest

mappings:
  - name: "medication"
    with:
      fhir: "$resource.medication.as(CodeableConcept)"
      openehr: "$archetype/activities[at0001]/description[at0002]/items[at0070]"
