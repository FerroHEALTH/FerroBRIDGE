# A FerroBRIDGE-authored model mapping of the CKM ACTION.medication.v1 that
# reads the medication item, the order ID and, through the condition of a
# manual entry, the comment, and no other element.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_unread_action
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-ACTION.medication.v1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/MedicationAdministration

mappings:
  - name: "medication"
    with:
      fhir: "$resource.medication.as(CodeableConcept)"
      openehr: "$archetype/description[at0017]/items[at0020]"

  - name: "orderId"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "$resource.identifier"
      openehr: "$archetype/protocol[at0030]/items[at0103]"

  - name: "commented"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "$resource"
      openehr: "$archetype"
    manual:
      - name: "completed"
        openehrCondition:
          targetRoot: "$archetype"
          targetAttribute: "description[at0017]/items[at0024]"
          operator: "not empty"
        fhir:
          - path: "status"
            value: "completed"
