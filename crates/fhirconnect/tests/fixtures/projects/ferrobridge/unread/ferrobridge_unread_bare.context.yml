# A FerroBRIDGE-authored context over FerroBRIDGE's medication template whose
# start model reads the medication item alone, so the order ID (an element
# of two data value types) is left unread: the fixture for a choice element
# no mapping reads.
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrobridge_unread_bare.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: "http://example.org/fhir/StructureDefinition/ferrobridge-unread-bare"
  template:
    id: "openEHR-EHR-COMPOSITION.ferrobridge_medication.v1.0.0"
  archetypes:
    - "ferrobridge_unread_bare"
  start: "ferrobridge_unread_bare"
