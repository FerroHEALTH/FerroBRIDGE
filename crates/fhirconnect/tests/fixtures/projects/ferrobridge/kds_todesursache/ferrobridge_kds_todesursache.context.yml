# Changed: the metadata name and version are FerroBRIDGE's; the profile, the
# template and the start are the published file's. CLUSTER.case_identification.v0
# names FerroBRIDGE's stand-in, since the published model's Identifier onto the
# DV_CODED_TEXT KDS_Todesursache constrains is refused at load (#101).
# FerroBRIDGE's overwrite of the problem qualifier's statusCoded follows the
# published extensions.
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrobridge_kds_todesursache.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: https://www.medizininformatik-initiative.de/fhir/core/modul-person/StructureDefinition/Todesursache
    version: 2025.0.0
  template:
    id: KDS_Todesursache
    sem_ver: 7.0.0
  archetypes:
    - EVALUATION.cause_of_death.v1
    - CLUSTER.problem_qualifier.v2
    - COMPOSITION.report.v1.Condition
    - CLUSTER.case_identification.v0
  extensions:
    - KDS_cause_of_death
    - KDS_problem_qualifier_todesursache
    - ferrobridge_problem_qualifier_terminology_id
    - KDS_composition
  start: EVALUATION.cause_of_death.v1
