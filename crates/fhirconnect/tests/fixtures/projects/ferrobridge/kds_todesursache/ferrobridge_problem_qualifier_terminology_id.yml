# An overwrite copied from model/cluster/org.openehr/problem_qualifier.v2.yml,
# a derivative of it under its licence.
# Source: SevKohler/FHIRconnect-mapping-lib at commit 2ba7cf5d (vendored
# under docs/specs/fhirconnect-mapping-lib), Apache License 2.0; the source
# file carries no copyright line to keep.
# Changed: every manual path `defining_code/terminology_id` becomes
# `defining_code/terminology_id/value`: TERMINOLOGY_ID is an object whose
# `value` carries the id (openEHR RM 1.1.0, OBJECT_ID), which is the path
# manual.adoc writes (#101). The published model writes it at its lines 28,
# 55, 82, 109 and 136, so its statusCoded is overwritten here with that one
# change.
grammar: FHIRConnect/v1.0.0
type: extension
metadata:
  name: ferrobridge_problem_qualifier_terminology_id
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  extends: CLUSTER.problem_qualifier.v2

mappings:
  - name: "statusCoded"
    extension: "overwrite"
    with:
      fhir: "$resource.verificationStatus.coding"
      openehr: "$archetype/items[at0004]"
    fhirCondition:
      targetRoot: "$resource.verificationStatus"
      targetAttribute: "coding.code"
      operator: "not of"
      criteria: "entered-in-error"
    manual:
      - name: "provisional"
        openehr:
          - path: "defining_code/terminology_id/value"
            value: "local"
          - path: "defining_code/code_string"
            value: "at0017"
          - path: "value"
            value: "Working"
        fhirCondition:
          targetRoot: "$fhirRoot"
          targetAttribute: "code"
          operator: "one of"
          criteria: "provisional"
        fhir:
          - path: "code"
            value: "provisional"
          - path: "display"
            value: "Provisional"
          - path: "system"
            value: "http://terminology.hl7.org/CodeSystem/condition-ver-status"
        openehrCondition:
          targetRoot: "$archetype"
          targetAttribute: "items[at0004]/defining_code/code_string"
          operator: "one of"
          criteria: "at0017"

      - name: "differential"
        openehr:
          - path: "defining_code/terminology_id/value"
            value: "local"
          - path: "defining_code/code_string"
            value: "at0017"
          - path: "value"
            value: "Working"
        fhirCondition:
          targetRoot: "$fhirRoot"
          targetAttribute: "code"
          operator: "one of"
          criteria: "differential"
        fhir:
          - path: "code"
            value: "differential"
          - path: "display"
            value: "Differential"
          - path: "system"
            value: "http://terminology.hl7.org/CodeSystem/condition-ver-status"
        openehrCondition:
          targetRoot: "$archetype"
          targetAttribute: "items[at0004]/defining_code/code_string"
          operator: "one of"
          criteria: "at0017"

      - name: "preliminary"
        openehr:
          - path: "defining_code/terminology_id/value"
            value: "local"
          - path: "defining_code/code_string"
            value: "at0016"
          - path: "value"
            value: "Preliminary"
        fhirCondition:
          targetRoot: "$fhirRoot"
          targetAttribute: "code"
          operator: "one of"
          criteria: "unconfirmed"
        fhir:
          - path: "code"
            value: "unconfirmed"
          - path: "display"
            value: "Unconfirmed"
          - path: "system"
            value: "http://terminology.hl7.org/CodeSystem/condition-ver-status"
        openehrCondition:
          targetRoot: "$archetype"
          targetAttribute: "items[at0004]/defining_code/code_string"
          operator: "one of"
          criteria: "at0016"

      - name: "established"
        openehr:
          - path: "defining_code/terminology_id/value"
            value: "local"
          - path: "defining_code/code_string"
            value: "at0018"
          - path: "value"
            value: "Established"
        fhirCondition:
          targetRoot: "$fhirRoot"
          targetAttribute: "code"
          operator: "one of"
          criteria: "confirmed"
        fhir:
          - path: "code"
            value: "confirmed"
          - path: "display"
            value: "Confirmed"
          - path: "system"
            value: "http://terminology.hl7.org/CodeSystem/condition-ver-status"
        openehrCondition:
          targetRoot: "$archetype"
          targetAttribute: "items[at0004]/defining_code/code_string"
          operator: "one of"
          criteria: "at0018"

      - name: "refuted"
        openehr:
          - path: "defining_code/terminology_id/value"
            value: "local"
          - path: "defining_code/code_string"
            value: "at0088"
          - path: "value"
            value: "Refuted"
        fhirCondition:
          targetRoot: "$fhirRoot"
          targetAttribute: "code"
          operator: "one of"
          criteria: "refuted"
        fhir:
          - path: "code"
            value: "refuted"
          - path: "display"
            value: "Refuted"
          - path: "system"
            value: "http://terminology.hl7.org/CodeSystem/condition-ver-status"
        openehrCondition:
          targetRoot: "$archetype"
          targetAttribute: "items[at0004]/defining_code/code_string"
          operator: "one of"
          criteria: "at0088"
