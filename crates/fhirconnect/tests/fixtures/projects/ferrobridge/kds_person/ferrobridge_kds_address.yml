# Source: SevKohler/FHIRconnect-mapping-lib at commit 6bd4c19a (vendored
# under docs/specs/fhirconnect-mapping-lib), Apache License 2.0; the source
# file carries no copyright line to keep.
# Changed: the metadata name and version are FerroBRIDGE's. `Address.type` is
# a `code`, whose value the specification reads as `value`
# (path_operators.adoc), so the conditions and FHIR paths `code` of the
# published lines 55, 60, 78, 82, 100 and 104 read `value`; the manual paths
# `defining_code/terminology_id` of its lines 47, 70 and 92 read
# `defining_code/terminology_id/value`, the path manual.adoc writes. The
# published type method (lines 34 to 37) converts the `code` Address.type
# onto the DV_CODED_TEXT `items[at0010]`, which DV_CODED_TEXT.adoc §STRING
# calls not possible, so it carries `type: "NONE"` and its manual child alone
# writes, the shape PopulatingAnEntry.adoc gives a parent that anchors.
grammar: FHIRConnect/v1.0.0
type: extension
metadata:
  name: ferrobridge_kds_address
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  extends: CLUSTER.address.v1

mappings:
  - name: "streetaddress"
    extension: "overwrite"
    with:
      fhir: "$fhirRoot"
      openehr: "$archetype"
    followedBy:
      mappings:
        - name: "city"
          with:
            fhir: "city"
            openehr: "items[at0002]"

        - name: "postalCode"
          with:
            fhir: "postalCode"
            openehr: "items[at0005]"

        - name: "line"
          with:
            fhir: "line"
            openehr: "items[at0001]"

        - name: "type"
          with:
            fhir: "type"
            openehr: "items[at0010]"
            type: "NONE"
          followedBy:
            mappings:
              - name: "manual"
                with:
                  fhir: "$fhirRoot"
                  openehr: "$openehrRoot"
                manual:
                  - name: "physical"
                    openehr:
                      - path: "defining_code/terminology_id/value"
                        value: "local"
                      - path: "defining_code/code_string"
                        value: "at0011"
                      - path: "value"
                        value: "Physical"
                    fhirCondition:
                      targetRoot: "$fhirRoot"
                      targetAttribute: "value"
                      operator: "one of"
                      criteria: "physical"
                    fhir:
                      - path: "value"
                        value: "physical"
                    openehrCondition:
                      targetRoot: "$openehrRoot"
                      targetAttribute: "defining_code/code_string"
                      operator: "one of"
                      criteria: "at0011"

                  - name: "postal"
                    openehr:
                      - path: "defining_code/terminology_id/value"
                        value: "local"
                      - path: "defining_code/code_string"
                        value: "at0012"
                      - path: "value"
                        value: "Postal"
                    fhirCondition:
                      targetRoot: "$fhirRoot"
                      targetAttribute: "value"
                      operator: "one of"
                      criteria: "postal"
                    fhir:
                      - path: "value"
                        value: "postal"
                    openehrCondition:
                      targetRoot: "$openehrRoot"
                      targetAttribute: "defining_code/code_string"
                      operator: "one of"
                      criteria: "at0012"

                  - name: "both"
                    openehr:
                      - path: "defining_code/terminology_id/value"
                        value: "local"
                      - path: "defining_code/code_string"
                        value: "at0013"
                      - path: "value"
                        value: "Both"
                    fhirCondition:
                      targetRoot: "$fhirRoot"
                      targetAttribute: "value"
                      operator: "one of"
                      criteria: "both"
                    fhir:
                      - path: "value"
                        value: "both"
                    openehrCondition:
                      targetRoot: "$openehrRoot"
                      targetAttribute: "defining_code/code_string"
                      operator: "one of"
                      criteria: "at0013"
