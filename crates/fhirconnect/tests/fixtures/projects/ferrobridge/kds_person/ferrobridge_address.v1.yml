# A modified copy of model/cluster/org.openehr/address.v1.yml, a derivative
# of it under its licence.
# Source: SevKohler/FHIRconnect-mapping-lib at commit 6bd4c19a (vendored
# under docs/specs/fhirconnect-mapping-lib), Apache License 2.0; the source
# file carries no copyright line to keep.
# Changed: `Address.type` is a `code`, whose value the specification reads as
# `value` (path_operators.adoc), so the conditions and FHIR paths `code` of
# the published lines 62, 67, 85, 89, 107 and 111 read `value`; the manual
# paths `defining_code/terminology_id` of its lines 54, 77 and 99 read
# `defining_code/terminology_id/value`, the path manual.adoc writes. The KDS
# address extension overwrites the one method, so the published file is not
# loaded.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: CLUSTER.address.v1
  version: 0.0.1-alpha
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-CLUSTER.address.v1
    revision: 1.1.2
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Address

mappings:
  - name: "streetaddress"
    with:
      fhir: "$fhirRoot"
      openehr: "$archetype"
    followedBy:
      mappings:
        - name: "city"
          with:
            fhir: "city"
            openehr: "items[at0002]"

        - name: "state"
          with:
            fhir: "state"
            openehr: "items[at0004]"

        - name: "postalCode"
          with:
            fhir: "postalCode"
            openehr: "items[at0005]"

        - name: "country"
          with:
            fhir: "country"
            openehr: "items[at0006]"

        - name: "line"
          with:
            fhir: "line"
            openehr: "items[at0001]"

        - name: "type"
          with:
            fhir: "type"
            openehr: "items[at0010]"
          manual:
            - name: "physical"
              openehr:
                - path: "defining_code/terminology_id/value"
                  value: "local"
                - path: "defining_code/code_string"
                  value: "at0011"
                - path: "value"
                  value: "Physical"
              fhirCondition:
                targetRoot: "$fhirRoot"
                targetAttribute: "value"
                operator: "one of"
                criteria: "physical"
              fhir:
                - path: "value"
                  value: "physical"
              openehrCondition:
                targetRoot: "$openehrRoot"
                targetAttribute: "defining_code/code_string"
                operator: "one of"
                criteria: "at0011"

            - name: "postal"
              openehr:
                - path: "defining_code/terminology_id/value"
                  value: "local"
                - path: "defining_code/code_string"
                  value: "at0012"
                - path: "value"
                  value: "Postal"
              fhirCondition:
                targetRoot: "$fhirRoot"
                targetAttribute: "value"
                operator: "one of"
                criteria: "postal"
              fhir:
                - path: "value"
                  value: "postal"
              openehrCondition:
                targetRoot: "$openehrRoot"
                targetAttribute: "defining_code/code_string"
                operator: "one of"
                criteria: "at0012"

            - name: "both"
              openehr:
                - path: "defining_code/terminology_id/value"
                  value: "local"
                - path: "defining_code/code_string"
                  value: "at0013"
                - path: "value"
                  value: "Both"
              fhirCondition:
                targetRoot: "$fhirRoot"
                targetAttribute: "value"
                operator: "one of"
                criteria: "both"
              fhir:
                - path: "value"
                  value: "both"
              openehrCondition:
                targetRoot: "$openehrRoot"
                targetAttribute: "defining_code/code_string"
                operator: "one of"
                criteria: "at0013"
