# under docs/specs/fhirconnect-mapping-lib), Apache License 2.0; the source
# file carries no copyright line to keep.
# Changed: the published lines 29 to 40 slot CLUSTER.organisation.v1 below
# CLUSTER.person.v1, a slot KDS_Person leaves unfilled, so the method does not
# compile against it and is left out. The KDS cluster extension overwrites the
# other two methods, so no method of the published file would run and the
# published file is not loaded.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: CLUSTER.person.v1
  version: 0.0.1-alpha
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-CLUSTER.person.v1
    revision: 1.0.3
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Patient

mappings:
  - name: "name"
    with:
      fhir: "$resource.name"
      openehr: "$archetype/items[openEHR-EHR-CLUSTER.structured_name.v1]"
    slotArchetype: "CLUSTER.structured_name.v1"

  - name: "address"
    with:
      fhir: "$resource.address"
      openehr: "$archetype/items[openEHR-EHR-CLUSTER.address.v1]"
    slotArchetype: "CLUSTER.address.v1"
