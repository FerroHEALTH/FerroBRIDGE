# A modified copy of model/composition/org.highmed/fall.v1.Encounter.yml,
# a derivative of it under its licence.
# Source: SevKohler/FHIRconnect-mapping-lib at commit 2ba7cf5d (vendored
# under docs/specs/fhirconnect-mapping-lib), Apache License 2.0; the source
# file carries no copyright line to keep.
# Changed: the published lines 37 to 60 and 67 to 83 write `null_flavour`
# below the DV_DATE_TIME `context/start_time` and the PARTY_PROXY
# `composer`, neither of which is an ELEMENT (#101). Those two methods are
# left out; every other method is the published one.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: COMPOSITION.fall.v1.encounter
  version: 0.0.1-alpha
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-COMPOSITION.fall.v1
    revision: 1.0.1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Encounter

mappings:
  - name: healthcareFacility
    with:
      fhir: $resource.serviceProvider
      openehr: $composition/context/health_care_facility

  - name: contextPeriod
    with:
      fhir: $resource.period
      openehr: $composition/context
      type: NONE
    followedBy:
      mappings:
        - name: contextStart
          with:
            fhir: start
            openehr: start_time
        - name: contextEnd
          with:
            fhir: end
            openehr: end_time

  - name: composer
    with:
      fhir: $resource.serviceProvider
      openehr: $composition/composer

