# FerroBRIDGE's extension of model/composition/org.openehr/report.v1.Condition.yml
# for condition-eu-core 2.0.0, a derivative of it under its licence.
# Source: SevKohler/FHIRconnect-mapping-lib at commit 6bd4c19a (vendored
# under docs/specs/fhirconnect-mapping-lib), Apache License 2.0; the source
# file carries no copyright line to keep.
# The overwrite is projects/ferrobridge/kds_diagnose's; the KDS case
# identification methods are left out.
grammar: FHIRConnect/v1.0.0
type: extension
metadata:
  name: ferrobridge_eu_composition.Condition
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  extends: COMPOSITION.report.v1.Condition

mappings:
  # The published model's lines 134 to 141 write `null_flavour` below
  # `composer` (a PARTY_PROXY); the openEHR RM carries `null_flavour` on
  # ELEMENT only, so against KDS_Diagnose the method maps nothing. Its lines
  # 44 and 74 both name `contextStartTimeEmpty`, so basics/body.adoc leaves
  # no single method for an overwrite of that name to address (#101).
  - name: "composerEmpty"
    extension: "overwrite"
    with:
      fhir: "$resource"
      openehr: "$composition"
      type: "NONE"
