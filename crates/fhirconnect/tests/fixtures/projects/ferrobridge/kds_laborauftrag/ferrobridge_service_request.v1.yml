# A modified copy of model/instruction/org.openehr/service_request.v1.yml, a
# derivative of it under its licence.
# Source: SevKohler/FHIRconnect-mapping-lib at commit 6bd4c19a (vendored
# under docs/specs/fhirconnect-mapping-lib), Apache License 2.0; the source
# file carries no copyright line to keep.
# Changed: the published lines 16 to 19 walk `context` below the
# INSTRUCTION and lines 31 to 34 `provider` below the COMPOSITION, neither of
# which the reference model defines, so both methods are left out. The
# published `status` (lines 47 to 50) sits under `protocol0008Parent`, where
# the KDS extension's overwrite cannot name it, so it is a top-level method
# here over the same nodes. Every other method is the published one.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: INSTRUCTION.service_request.v1
  version: 0.0.1-alpha
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-INSTRUCTION.service_request.v1
    revision: 1.1.3-alpha
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/ServiceRequest

mappings:
  - name: "authoredOn"
    with:
      fhir: "$resource.authoredOn"
      openehr: "$composition/context/start_time"

  - name: "status"
    with:
      fhir: "$resource.status"
      openehr: "$archetype/protocol[at0008]/items[at0127]"

  - name: "protocol0008Parent"
    with:
      fhir: "$resource"
      openehr: "$archetype/protocol[at0008]"
    followedBy:
      mappings:
        - name: "identifier"
          with:
            fhir: "identifier"
            openehr: "items[at0010]"

        - name: "organisation"
          with:
            fhir: "requester"
            openehr: "$reference"
          reference:
            resourceType: "Organization"
            mappings:
              - name: "organization"
                with:
                  fhir: "$fhirRoot"
                  openehr: "items[openEHR-EHR-CLUSTER.organisation.v1]"
                slotArchetype: "CLUSTER.organisation.v1"

  - name: "code"
    with:
      fhir: "$resource.code"
      openehr: "$archetype/activities[at0001]/description[at0009]/items[at0121]"

  - name: "category"
    with:
      fhir: "$resource.category"
      openehr: "$archetype/activities[at0001]/description[at0009]/items[at0148]"

  - name: "intent"
    with:
      fhir: "$resource.intent"
      openehr: "$archetype/activities[at0001]/description[at0009]/items[at0065]"

  - name: "note"
    with:
      fhir: "$resource.note.text"
      openehr: "$archetype/activities[at0001]/description[at0009]/items[at0150]"
