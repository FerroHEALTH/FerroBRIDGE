# FerroBRIDGE's context for the HL7 Europe Laboratory Report 2.0.0
# DiagnosticReport-eu-lab profile over the published KDS_Laborbericht
# template, whose laboratory result and analyte archetypes are CKM's. Each
# analyte becomes an Observation-resultslab-eu-lab the report references,
# and that profile derives from Base and Core 2.0.0 medicalTestResult-eu-core.
# The library's own eehrxf_lab context is refused (#1235).
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrobridge_eu_laboratory.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: "http://hl7.eu/fhir/laboratory/StructureDefinition/DiagnosticReport-eu-lab"
    version: "2.0.0"
  template:
    id: "KDS_Laborbericht"
  archetypes:
    - "OBSERVATION.laboratory_test_result.v1"
    - "CLUSTER.laboratory_test_analyte.v1"
    - "CLUSTER.specimen.v1"
    - "COMPOSITION.report_result.v1.DiagnosticReport"
  extensions:
    - "ferrobridge_eu_laboratory_result"
    - "ferrobridge_eu_laboratory_analyte"
    - "ferrobridge_eu_laboratory_specimen"
    - "ferrobridge_eu_composition.DiagnosticReport"
  start: "OBSERVATION.laboratory_test_result.v1"
