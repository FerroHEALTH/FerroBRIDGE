# FerroBRIDGE's extension of CLUSTER.specimen.v1 for the Laboratory Report
# 2.0.0 Specimen-eu-lab profile: its canonical.
grammar: FHIRConnect/v1.0.0
type: extension
metadata:
  name: ferrobridge_eu_laboratory_specimen
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  extends: CLUSTER.specimen.v1

mappings:
  - name: "metaURL"
    extension: "add"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "$resource.meta"
    manual:
      - name: "profileUrl"
        fhir:
          - path: "profile"
            value: "http://hl7.eu/fhir/laboratory/StructureDefinition/Specimen-eu-lab"
