      - name: "unknown"
        fhir:
          - path: "status"
            value: "unknown"
        openehrCondition:
          targetRoot: "$openehrRoot"
          targetAttribute: "defining_code/code_string"
          operator: "one of"
          criteria: "unknown"
        openehr:
          - path: "defining_code/terminology_id/value"
            value: "http://hl7.org/fhir/diagnostic-report-status"
          - path: "defining_code/code_string"
            value: "unknown"
          - path: "value"
            value: "Unknown"
        fhirCondition:
