          operator: "one of"
          criteria: "amended"
        openehr:
          - path: "defining_code/terminology_id/value"
            value: "http://hl7.org/fhir/diagnostic-report-status"
          - path: "defining_code/code_string"
            value: "amended"
          - path: "value"
            value: "Amended"
        fhirCondition:
          targetRoot: "$fhirRoot"
          targetAttribute: "status"
          operator: "one of"
          criteria: "amended"
      - name: "corrected"
        fhir:
          - path: "status"
            value: "corrected"
        openehrCondition:
          targetRoot: "$openehrRoot"
          targetAttribute: "defining_code/code_string"
          operator: "one of"
          criteria: "corrected"
        openehr:
          - path: "defining_code/terminology_id/value"
            value: "http://hl7.org/fhir/diagnostic-report-status"
          - path: "defining_code/code_string"
            value: "corrected"
          - path: "value"
            value: "Corrected"
        fhirCondition:
          targetRoot: "$fhirRoot"
          targetAttribute: "status"
          operator: "one of"
          criteria: "corrected"
      - name: "appended"
        fhir:
          - path: "status"
            value: "appended"
        openehrCondition:
          targetRoot: "$openehrRoot"
          targetAttribute: "defining_code/code_string"
          operator: "one of"
          criteria: "appended"
        openehr:
          - path: "defining_code/terminology_id/value"
            value: "http://hl7.org/fhir/diagnostic-report-status"
          - path: "defining_code/code_string"
            value: "appended"
          - path: "value"
            value: "Appended"
        fhirCondition:
          targetRoot: "$fhirRoot"
          targetAttribute: "status"
          operator: "one of"
          criteria: "appended"
      - name: "cancelled"
        fhir:
          - path: "status"
            value: "cancelled"
        openehrCondition:
          targetRoot: "$openehrRoot"
          targetAttribute: "defining_code/code_string"
          operator: "one of"
          criteria: "cancelled"
        openehr:
          - path: "defining_code/terminology_id/value"
            value: "http://hl7.org/fhir/diagnostic-report-status"
          - path: "defining_code/code_string"
            value: "cancelled"
          - path: "value"
            value: "Cancelled"
        fhirCondition:
          targetRoot: "$fhirRoot"
          targetAttribute: "status"
          operator: "one of"
          criteria: "cancelled"
      - name: "entered-in-error"
        fhir:
          - path: "status"
            value: "entered-in-error"
        openehrCondition:
          targetRoot: "$openehrRoot"
          targetAttribute: "defining_code/code_string"
          operator: "one of"
          criteria: "entered-in-error"
        openehr:
          - path: "defining_code/terminology_id/value"
            value: "http://hl7.org/fhir/diagnostic-report-status"
          - path: "defining_code/code_string"
            value: "entered-in-error"
          - path: "value"
