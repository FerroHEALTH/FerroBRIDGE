# A modified copy of model/cluster/org.openehr/specimen.v1.yml, a derivative
# of it under its licence.
# Source: SevKohler/FHIRconnect-mapping-lib at commit 6bd4c19a (vendored
# under docs/specs/fhirconnect-mapping-lib), Apache License 2.0; the source
# file carries no copyright line to keep.
# Changed: the model maps a Specimen, which is what the cluster becomes, and
# keeps the published methods that compile against KDS_Laborbericht. Left
# out: `status`, whose manual paths walk `defining_code` and `value` below
# the CLUSTER itself, which the reference model does not define; the
# adequacy, `collectedPeriod`, `collector`, `samplingContext`, `parent` and
# `request` methods, whose at0041 names two template nodes or whose paths
# reach no carried value; and `identifier` on the at0088 choice element. The
# laboratory specimen identifier (at0001) is `accessionIdentifier`, as the
# published file maps it.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: CLUSTER.specimen.v1
  version: 0.0.1-alpha
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-CLUSTER.specimen.v1
    revision: 1.1.2
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Specimen

mappings:
  - name: "collection"
    with:
      fhir: "$resource.collection"
      openehr: "$archetype"
    followedBy:
      mappings:
        - name: "collected"
          with:
            fhir: "collected.as(DateTime)"
            openehr: "items[at0015]"

        - name: "specimenCollectionMethod"
          with:
            fhir: "method"
            openehr: "items[at0007]"

        - name: "specimenCollectionBodySite"
          with:
            fhir: "bodySite"
            openehr: "items[at0087]"

  - name: "type"
    with:
      fhir: "$resource.type"
      openehr: "$archetype/items[at0029]"

  - name: "note"
    with:
      fhir: "$resource.note.text"
      openehr: "$archetype/items[at0045]"

  - name: "descriptionOfSpecimen"
    with:
      fhir: "$resource.condition"
      openehr: "$archetype/items[at0097]"

  - name: "identifierOfSpecimen"
    with:
      fhir: "$resource.accessionIdentifier"
      openehr: "$archetype/items[at0001]"

  - name: "dateReceived"
    with:
      fhir: "$resource.receivedTime"
      openehr: "$archetype/items[at0034]"
