# FerroBRIDGE's Observation model over the CKM report composition, slotting
# the library's case identification cluster from the composition context
# onto the identifier of the encounter, the Identifier its fhirConfig names
# (#1546).
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_report_case
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-COMPOSITION.report.v1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Observation
mappings:
  - name: encounter
    with:
      fhir: $resource.encounter.identifier
      openehr: $archetype/context/other_context[at0001]/items[openEHR-EHR-CLUSTER.case_identification.v0]
    slotArchetype: CLUSTER.case_identification.v0
