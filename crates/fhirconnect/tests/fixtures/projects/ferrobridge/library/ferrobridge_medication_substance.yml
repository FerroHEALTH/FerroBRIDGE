# FerroBRIDGE's Substance model over the CKM medication ACTION: the
# administered medication cluster read as the Substance the library's
# model/cluster/org.openehr/medication.v2.substance.yml maps it to, slotted
# where the action holds the cluster. The library slots the substance model
# only from medication.v2.yml:96, one constituent too deep (#101), so this
# model enters it at the cluster itself.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_medication_substance
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-ACTION.medication.v1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Substance
mappings:
  - name: substance
    with:
      fhir: $resource
      openehr: $archetype/description[at0017]/items[openEHR-EHR-CLUSTER.medication.v2]
    slotArchetype: CLUSTER.medication.v2.substance
