# FerroBRIDGE's extension of the library's laboratory result model that
# slots the library's analyte cluster under each event (#1963), the
# resultAppendToParent method of the KDS laborbericht extension, whose
# context does not compile, with nothing else.
grammar: FHIRConnect/v1.0.0
type: extension
metadata:
  name: ferrobridge_laboratory_result_analyte
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  extends: OBSERVATION.laboratory_test_result.v1
mappings:
  - name: resultAppendToParent
    extension: append
    appendTo: eventParent
    followedBy:
      mappings:
        - name: result
          with:
            fhir: result
            openehr: data[at0003]/items[openEHR-EHR-CLUSTER.laboratory_test_analyte.v1]
          followedBy:
            mappings:
              - name: observationReference
                with:
                  fhir: $fhirRoot
                  openehr: $reference
                reference:
                  resourceType: Observation
                  mappings:
                    - name: observationRecurring
                      with:
                        fhir: $fhirRoot
                        openehr: $openehrRoot
                      slotArchetype: CLUSTER.laboratory_test_analyte.v1
