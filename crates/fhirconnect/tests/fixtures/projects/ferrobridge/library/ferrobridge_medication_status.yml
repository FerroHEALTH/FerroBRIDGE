# FerroBRIDGE's MedicationAdministration model over the CKM medication
# ACTION, slotting the library's medication status cluster from the
# action's protocol, which no library file slots (#1546).
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_medication_status
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-ACTION.medication.v1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/MedicationAdministration
mappings:
  - name: status
    with:
      fhir: $resource
      openehr: $archetype/protocol[at0030]/items[openEHR-EHR-CLUSTER.medication_status_fhir.v0]
    slotArchetype: CLUSTER.medication_status_fhir.v0
