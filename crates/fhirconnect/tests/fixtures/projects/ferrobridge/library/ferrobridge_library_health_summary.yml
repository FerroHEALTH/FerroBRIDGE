# FerroBRIDGE's extension of the library health summary model: one section,
# the ad hoc SECTION the library health summary template holds, slotted through
# FerroBRIDGE's stand-in for the library's ad hoc section model, which does not
# compile (#101). The library's IPS composition slots its sections through
# sub-contexts instead.
grammar: FHIRConnect/v1.0.0
type: extension
metadata:
  name: ferrobridge_library_health_summary
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  extends: COMPOSITION.health_summary.v1
mappings:
  - name: "section"
    extension: "add"
    with:
      fhir: "$resource.section"
      openehr: "$composition/content[openEHR-EHR-SECTION.adhoc.v1]"
    slotArchetype: "ferrobridge_section_adhoc.v1"
