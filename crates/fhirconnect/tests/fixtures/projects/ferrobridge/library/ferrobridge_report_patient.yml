# FerroBRIDGE's Patient model over the CKM report composition, slotting the
# library's person, death details and birth data clusters from the
# composition context and its insurance entry from the content (#1963). The
# library slots the clusters from ADMIN_ENTRY.person_data.v0, which the
# openEHR-de mirror publishes with no licence, and the insurance entry from
# a KDS extension; this model slots each at the element the library's own
# slotting methods name (personData, deathTime and personBirthDate of
# person_data.v0.yml, versicherungsInformationen of KDS_Composition.yml).
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_report_patient
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-COMPOSITION.report.v1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Patient
mappings:
  - name: personData
    with:
      fhir: $resource
      openehr: $archetype/context/other_context[at0001]/items[openEHR-EHR-CLUSTER.person.v1]
    slotArchetype: CLUSTER.person.v1
  - name: deathTime
    with:
      fhir: $resource.deceased.as(DateTime)
      openehr: $archetype/context/other_context[at0001]/items[openEHR-EHR-CLUSTER.death_details.v1]
    slotArchetype: CLUSTER.death_details.v1
  - name: birthDate
    with:
      fhir: $resource.birthDate
      openehr: $archetype/context/other_context[at0001]/items[openEHR-EHR-CLUSTER.person_birth_data_iso.v0]
    slotArchetype: CLUSTER.person_birth_data_iso.v0
  - name: insurance
    with:
      fhir: $resource.identifier
      openehr: $archetype/content[openEHR-EHR-ADMIN_ENTRY.versicherungsinformationen.v0]
    fhirCondition:
      targetRoot: $resource.identifier
      targetAttribute: system
      operator: one of
      criteria: http://fhir.de/sid/gkv/kvid-10
    slotArchetype: ADMIN_ENTRY.versicherungsinformationen.v0
