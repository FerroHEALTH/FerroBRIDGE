# under docs/specs/fhirconnect-mapping-lib), Apache License 2.0; the source
# file carries no copyright line to keep.
# Changed: the `severity` rows write `defining_code/terminology_id` where
# types-of-mappings/concept-type/manual.adoc writes
# `defining_code/terminology_id/value`, which they write here. Its paths
# name `$resource`, the root resource of a slotted model in FerroBRIDGE, where
# the file means the reaction the slot hands over, which they name here as
# `$fhirRoot`, the `severity` conditions filtering the code itself (#101). Every other line is the published one.
# Clinical evidence cluster model - used as slot in problem_diagnosis
# Maps FHIR Condition.evidence (BackboneElement) to openEHR clinical_evidence cluster
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: CLUSTER.adverse_reaction_event.v1
  version: 0.0.1-alpha
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-CLUSTER.adverse_reaction_event.v1
    revision: 1.0.0
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/BackboneElement

mappings:
  - name: "substance"
    with:
      fhir: "$fhirRoot.substance"
      openehr: "$archetype/items[at0001]"

  - name: "manifestation"
    with:
      fhir: "$fhirRoot.manifestation"
      openehr: "$archetype/items[at0006]"

  - name: "description"
    with:
      fhir: "$fhirRoot.description"
      openehr: "$archetype/items[at0007]"

  - name: "onset"
    with:
      fhir: "$fhirRoot.onset"
      openehr: "$archetype/items[at0008]"

  - name: "severity"
    with:
      fhir: "$fhirRoot.severity"
      openehr: "$archetype/items[at0010]"
      type: "NONE"
    manual:
      - name: "mild"
        openehr:
          - path: "defining_code/terminology_id/value"
            value: "local"
          - path: "defining_code/code_string"
            value: "at0011"
          - path: "value"
            value: "Mild"
        fhirCondition:
          targetRoot: "$fhirRoot"
          targetAttribute: "value"
          operator: "one of"
          criteria: "mild"
        fhir:
          - path: "$fhirRoot"
            value: "mild"
        openehrCondition:
          targetRoot: "$archetype/items[at0010]"
          targetAttribute: "defining_code/code_string"
          operator: "one of"
          criteria: "at0011"

      - name: "moderate"
        openehr:
          - path: "defining_code/terminology_id/value"
            value: "local"
          - path: "defining_code/code_string"
            value: "at0012"
          - path: "value"
            value: "Moderate"
        fhirCondition:
          targetRoot: "$fhirRoot"
          targetAttribute: "value"
          operator: "one of"
          criteria: "moderate"
        fhir:
          - path: "$fhirRoot"
            value: "moderate"
        openehrCondition:
          targetRoot: "$archetype/items[at0010]"
          targetAttribute: "defining_code/code_string"
          operator: "one of"
          criteria: "at0012"

      - name: "severe"
        openehr:
          - path: "defining_code/terminology_id/value"
            value: "local"
          - path: "defining_code/code_string"
            value: "at0013"
          - path: "value"
            value: "Severe"
        fhirCondition:
          targetRoot: "$fhirRoot"
          targetAttribute: "value"
          operator: "one of"
          criteria: "severe"
        fhir:
          - path: "$fhirRoot"
            value: "severe"
        openehrCondition:
          targetRoot: "$archetype/items[at0010]"
          targetAttribute: "defining_code/code_string"
          operator: "one of"
          criteria: "at0013"

  - name: "exposure"
    with:
      fhir: "$fhirRoot.exposureRoute"
      openehr: "$archetype/items[at0017]"

  - name: "comment"
    with:
      fhir: "$fhirRoot.note.text"
      openehr: "$archetype/items[at0024]"
