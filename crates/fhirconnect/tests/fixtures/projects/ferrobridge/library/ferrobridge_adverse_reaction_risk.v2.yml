# under docs/specs/fhirconnect-mapping-lib), Apache License 2.0; the source
# file carries no copyright line to keep.
# Changed: the metadata name stays the published one, so the IPS allergy
# extension extends this file. Every manual path `defining_code/terminology_id`
# becomes `defining_code/terminology_id/value`: TERMINOLOGY_ID is an object
# whose `value` carries the id (openEHR RM 1.1.0, OBJECT_ID), which is the
# path manual.adoc writes. The published model writes it at its lines 42, 68,
# 106, 132, 158, 190, 212 and 234 (#101). The manual conditions of
# `activeInactiveAllergies` and `verificationStatusAllergies` take
# `targetRoot: $fhirRoot` for the published `coding` at lines 49, 75, 113, 139
# and 165: a manual's paths extend the `coding` its mapping names
# (basics/FollowedBy.adoc §Path construction), and basics/Variables.adoc names
# `$fhirRoot` as the way back to it. `onsetDuration` (line 274) and
# `onsetIntervalRange` (line 294) are left out: `Age` is a `Quantity` and
# DV_DURATION.adoc pairs DV_DURATION with `Duration` only, and the `Range`
# bounds are `SimpleQuantity`, which no data-type page pairs with the
# DV_DURATION bounds of DV_INTERVAL<DV_DURATION>. `reaction` (line 324) is left
# out: CLUSTER.adverse_reaction_event.v1 writes `$resource.substance` and its
# siblings, which name elements of the root AllergyIntolerance, not of the
# `reaction` it is slotted under.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: EVALUATION.adverse_reaction_risk.v2
  version: 0.0.1-alpha
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-EVALUATION.adverse_reaction_risk.v2
    revision: 1.4.1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/AllergyIntolerance

preprocessor:
  fhirCondition:
    targetRoot: "$resource" # exclude entered-in-error, openEHR verification status has no value for it
    targetAttribute: "verificationStatus.coding.code"
    operator: "not of"
    criteria: "entered-in-error"

mappings:
  - name: "substance"
    with:
      fhir: "$resource.code"
      openehr: "$archetype/data[at0001]/items[at0002]"

  - name: "activeInactive" # clinicalStatus "resolved" has no openEHR equivalent (at0130 is active | inactive only) and is dropped
    with:
      fhir: "$resource.clinicalStatus"
      openehr: "$archetype"
    followedBy:
      mappings:
        - name: "activeInactiveAllergies"
          with:
            fhir: "coding"
            openehr: "data[at0001]/items[at0130]"
            type: "NONE"
          manual:
            - name: "active"
              openehr:
                - path: "defining_code/terminology_id/value"
                  value: "local"
                - path: "defining_code/code_string"
                  value: "at0131"
                - path: "value"
                  value: "Active"
              fhirCondition:
                targetRoot: "$fhirRoot"
                targetAttribute: "code"
                operator: "one of"
                criteria: "active"
              fhir:
                - path: "code"
                  value: "active"
                - path: "system"
                  value: "http://terminology.hl7.org/CodeSystem/allergyintolerance-clinical"
                - path: "display"
                  value: "Active"
              openehrCondition:
                targetRoot: "$archetype/data[at0001]/items[at0130]"
                targetAttribute: "defining_code/code_string"
                operator: "one of"
                criteria: "at0131"

            - name: "inactive"
              openehr:
                - path: "defining_code/terminology_id/value"
                  value: "local"
                - path: "defining_code/code_string"
                  value: "at0132"
                - path: "value"
                  value: "Inactive"
              fhirCondition:
                targetRoot: "$fhirRoot"
                targetAttribute: "code"
                operator: "one of"
                criteria: "inactive"
              fhir:
                - path: "code"
                  value: "inactive"
                - path: "system"
                  value: "http://terminology.hl7.org/CodeSystem/allergyintolerance-clinical"
                - path: "display"
                  value: "Inactive"
              openehrCondition:
                targetRoot: "$archetype/data[at0001]/items[at0130]"
                targetAttribute: "defining_code/code_string"
                operator: "one of"
                criteria: "at0132"

  - name: "verificationStatus"
    with:
      fhir: "$resource.verificationStatus"
      openehr: "$archetype"
    followedBy:
      mappings:
        - name: "verificationStatusAllergies"
          with:
            fhir: "coding"
            openehr: "data[at0001]/items[at0063]"
            type: "NONE"
          manual:
            - name: "unconfirmed"
              openehr:
                - path: "defining_code/terminology_id/value"
                  value: "local"
                - path: "defining_code/code_string"
                  value: "at0064"
                - path: "value"
                  value: "Unconfirmed"
              fhirCondition:
                targetRoot: "$fhirRoot"
                targetAttribute: "code"
                operator: "one of"
                criteria: "unconfirmed"
              fhir:
                - path: "code"
                  value: "unconfirmed"
                - path: "system"
                  value: "http://terminology.hl7.org/CodeSystem/allergyintolerance-verification"
                - path: "display"
                  value: "Unconfirmed"
              openehrCondition:
                targetRoot: "$archetype/data[at0001]/items[at0063]"
                targetAttribute: "defining_code/code_string"
                operator: "one of"
                criteria: "at0064"

            - name: "confirmed"
              openehr:
                - path: "defining_code/terminology_id/value"
                  value: "local"
                - path: "defining_code/code_string"
                  value: "at0065"
                - path: "value"
                  value: "Confirmed"
              fhirCondition:
                targetRoot: "$fhirRoot"
                targetAttribute: "code"
                operator: "one of"
                criteria: "confirmed"
              fhir:
                - path: "code"
                  value: "confirmed"
                - path: "system"
                  value: "http://terminology.hl7.org/CodeSystem/allergyintolerance-verification"
                - path: "display"
                  value: "Confirmed"
              openehrCondition:
                targetRoot: "$archetype/data[at0001]/items[at0063]"
                targetAttribute: "defining_code/code_string"
                operator: "one of"
                criteria: "at0065"

            - name: "refuted"
              openehr:
                - path: "defining_code/terminology_id/value"
                  value: "local"
                - path: "defining_code/code_string"
                  value: "at0066"
                - path: "value"
                  value: "Refuted"
              fhirCondition:
                targetRoot: "$fhirRoot"
                targetAttribute: "code"
                operator: "one of"
                criteria: "refuted"
              fhir:
                - path: "code"
                  value: "refuted"
                - path: "system"
                  value: "http://terminology.hl7.org/CodeSystem/allergyintolerance-verification"
                - path: "display"
                  value: "Refuted"
              openehrCondition:
                targetRoot: "$archetype/data[at0001]/items[at0063]"
                targetAttribute: "defining_code/code_string"
                operator: "one of"
                criteria: "at0066"

  - name: "criticality"
    with:
      fhir: "$resource.criticality"
      openehr: "$archetype/data[at0001]/items[at0101]"
      type: "NONE"
    manual:
      - name: "low"
        openehr:
          - path: "defining_code/terminology_id/value"
            value: "local"
          - path: "defining_code/code_string"
            value: "at0102"
          - path: "value"
            value: "Low"
        fhirCondition:
          targetRoot: "$resource"
          targetAttribute: "criticality"
          operator: "one of"
          criteria: "low"
        fhir:
          - path: "$fhirRoot"
            value: "low"
        openehrCondition:
          targetRoot: "$archetype/data[at0001]/items[at0101]"
          targetAttribute: "defining_code/code_string"
          operator: "one of"
          criteria: "at0102"

      - name: "high"
        openehr:
          - path: "defining_code/terminology_id/value"
            value: "local"
          - path: "defining_code/code_string"
            value: "at0103"
          - path: "value"
            value: "High"
        fhirCondition:
          targetRoot: "$resource"
          targetAttribute: "criticality"
          operator: "one of"
          criteria: "high"
        fhir:
          - path: "$fhirRoot"
            value: "high"
        openehrCondition:
          targetRoot: "$archetype/data[at0001]/items[at0101]"
          targetAttribute: "defining_code/code_string"
          operator: "one of"
          criteria: "at0103"

      - name: "indeterminate"
        openehr:
          - path: "defining_code/terminology_id/value"
            value: "local"
          - path: "defining_code/code_string"
            value: "at0124"
          - path: "value"
            value: "indeterminate"
        fhirCondition:
          targetRoot: "$resource"
          targetAttribute: "criticality"
          operator: "one of"
          criteria: "unable-to-assess"
        fhir:
          - path: "$fhirRoot"
            value: "unable-to-assess"
        openehrCondition:
          targetRoot: "$archetype/data[at0001]/items[at0101]"
          targetAttribute: "defining_code/code_string"
          operator: "one of"
          criteria: "at0124"

  - name: "categoryToTest"
    with:
      fhir: "$resource.category"
      openehr: "$archetype/data[at0001]/items[at0120]" # value has to match the one binded in FHIR (food, medication, environment, biologic), even though its DV_TEXT in openEHR

  - name: "lastOccurrence"
    with:
      fhir: "$resource.lastOccurrence"
      openehr: "$archetype/data[at0001]/items[at0117]"

  - name: "onsetDateTime"
    with:
      fhir: "$resource.onset.ofType(dateTime)"
      openehr: "$archetype/data[at0001]/items[at0133]"
    openehrCondition:
      targetRoot: "$archetype"
      targetAttribute: "data[at0001]/items[at0133]"
      operator: "type"
      criteria: "DV_DATE_TIME"

  - name: "onsetIntervalPeriod"
    with:
      fhir: "$resource.onset.ofType(Period)"
      openehr: "$archetype/data[at0001]/items[at0133]"
    openehrCondition:
      targetRoot: "$archetype"
      targetAttribute: "data[at0001]/items[at0133]"
      operator: "type"
      criteria: "DV_INTERVAL<DV_DATE_TIME>"

  - name: "onsetString"
    with:
      fhir: "$resource.onset.ofType(string)"
      openehr: "$archetype/data[at0001]/items[at0133]"
    openehrCondition:
      targetRoot: "$archetype"
      targetAttribute: "data[at0001]/items[at0133]"
      operator: "type"
      criteria: "DV_TEXT"

#  - name: "reactionMechanism"
#    with:
#      fhir: "$resource.type" #todo: HAS TO BE LOWER CASE
#      openehr: "$archetype/data[at0001]/items[at0058]" # value has to match the one binded in FHIR (allergy, intolerance), even though its DV_TEXT in openEHR

  - name: "comment"
    with:
      fhir: "$resource.note.text"
      openehr: "$archetype/data[at0001]/items[at0006]"
