# FerroBRIDGE's context over the mapping library model COMPOSITION.person.v0, which no
# published context starts at against a template built from the CKM
# archetypes. It compiles the model verbatim against the library template
# rooted at its composition archetype.
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrobridge_library_person.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: "http://hl7.org/fhir/StructureDefinition/Patient"
  template:
    id: "openEHR-EHR-COMPOSITION.ferrobridge_library_person.v1.0.0"
  archetypes:
    - "COMPOSITION.person.v0"
  start: "COMPOSITION.person.v0"
