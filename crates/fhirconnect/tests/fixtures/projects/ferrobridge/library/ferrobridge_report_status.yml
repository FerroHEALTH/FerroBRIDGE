# FerroBRIDGE's Observation model over the CKM report composition, slotting
# the library's observation status cluster from the composition context,
# which no library file slots (#1546).
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_report_status
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-COMPOSITION.report.v1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Observation
mappings:
  - name: status
    with:
      fhir: $resource
      openehr: $archetype/context/other_context[at0001]/items[openEHR-EHR-CLUSTER.observation_status_fhir.v1]
    slotArchetype: CLUSTER.observation_status_fhir.v1
