# FerroBRIDGE's context for the HL7 Europe Base and Core 2.0.0
# medicalTestResult-eu-core profile over the published KDS_Laborbericht
# template, whose laboratory result and analyte archetypes are CKM's. The
# test result becomes the Observation, and each analyte a member
# Observation-resultslab-eu-lab (a profile derived from
# medicalTestResult-eu-core) it references.
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrobridge_eu_test_result.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: "http://hl7.eu/fhir/base/StructureDefinition/medicalTestResult-eu-core"
    version: "2.0.0"
  template:
    id: "KDS_Laborbericht"
  archetypes:
    - "OBSERVATION.laboratory_test_result.v1.Observation"
    - "CLUSTER.laboratory_test_analyte.v1"
  extensions:
    - "ferrobridge_eu_test_result"
    - "ferrobridge_eu_laboratory_analyte"
  start: "OBSERVATION.laboratory_test_result.v1.Observation"
