# FerroBRIDGE's Substance model over the KDS medication administration: the
# administered medication cluster read as the Substance the library's
# model/cluster/org.openehr/medication.v2.substance.yml maps it to, slotted
# where the action holds the cluster. In the published chain only
# medication.v2.yml slots the substance model, from its `ingredients` method,
# which the KDS_medication.v2 extension overwrites, so this model enters it
# at the cluster itself (#1546). The template admits no initial state, so
# going into openEHR the action is written completed.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_kds_substance
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-ACTION.medication.v1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Substance
mappings:
  - name: substance
    with:
      fhir: $resource
      openehr: $archetype/description[at0017]/items[openEHR-EHR-CLUSTER.medication.v2]
    slotArchetype: CLUSTER.medication.v2.substance
  - name: administered
    unidirectional: fhir->openehr
    with:
      fhir: $resource
      openehr: $archetype/ism_transition/current_state
    manual:
      - name: completed
        openehr:
          - path: defining_code/terminology_id/value
            value: openehr
          - path: defining_code/code_string
            value: "532"
          - path: value
            value: completed
