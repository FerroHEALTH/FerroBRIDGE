# FerroBRIDGE's extension of CLUSTER.medication.v2 for the HL7 Europe MPD
# 1.0.0 Medication-eu-mpd profile: its canonical.
grammar: FHIRConnect/v1.0.0
type: extension
metadata:
  name: ferrobridge_eu_mpd_medication
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  extends: CLUSTER.medication.v2

mappings:
  - name: "metaURL"
    extension: "add"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "$fhirRoot.meta"
    manual:
      - name: "profileUrl"
        fhir:
          - path: "profile"
            value: "http://hl7.eu/fhir/mpd/StructureDefinition/Medication-eu-mpd"
