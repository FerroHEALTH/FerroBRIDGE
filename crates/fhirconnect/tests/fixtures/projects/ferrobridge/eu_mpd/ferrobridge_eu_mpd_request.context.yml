# FerroBRIDGE's context for the HL7 Europe MPD 1.0.0 MedicationRequest-eu-mpd
# profile over FerroBRIDGE's medication template, whose archetypes are
# CKM's. The ordered product becomes a Medication-eu-mpd the request
# references, and the dosage a Dosage-eu-mpd.
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrobridge_eu_mpd_request.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: "http://hl7.eu/fhir/mpd/StructureDefinition/MedicationRequest-eu-mpd"
    version: "1.0.0"
  template:
    id: "openEHR-EHR-COMPOSITION.ferrobridge_medication.v1.0.0"
  archetypes:
    - "INSTRUCTION.medication_order.v3"
    - "CLUSTER.medication.v2"
    - "CLUSTER.dosage.v2"
  extensions:
    - "ferrobridge_eu_mpd_request"
    - "ferrobridge_eu_mpd_medication"
  start: "INSTRUCTION.medication_order.v3"
