# FerroBRIDGE's model mapping of the CKM CLUSTER.medication.v2 (revision
# 2.0.6) to a FHIR R4 Medication. The library's medication.v2.yml targets a
# BackboneElement, which defines none of the elements it maps, and maps the
# strength (concentration) to the package amount (#1235), so this one is
# FerroBRIDGE's: the name, the form, the batch and its expiry.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: CLUSTER.medication.v2
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-CLUSTER.medication.v2
    revision: 2.0.6
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Medication

mappings:
  - name: "code"
    with:
      fhir: "$fhirRoot.code"
      openehr: "$archetype/items[at0132]"

  - name: "form"
    with:
      fhir: "$fhirRoot.form"
      openehr: "$archetype/items[at0071]"

  - name: "batchLotNumber"
    with:
      fhir: "$fhirRoot.batch.lotNumber"
      openehr: "$archetype/items[at0150]"

  - name: "batchExpirationDate"
    with:
      fhir: "$fhirRoot.batch.expirationDate"
      openehr: "$archetype/items[at0003]"
