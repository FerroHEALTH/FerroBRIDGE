# A modified copy of model/cluster/org.openehr/anatomical_location.v1.yml, a
# derivative of it under its licence.
# Source: SevKohler/FHIRconnect-mapping-lib at commit 2ba7cf5d (vendored
# under docs/specs/fhirconnect-mapping-lib), Apache License 2.0; the source
# file carries no copyright line to keep.
# Changed: `bodySiteCoding` (published lines 15 to 33) maps `text` and
# conditions on `coding` below `$resource`, the resource itself, where
# KDS_procedure.v1 slots the cluster with `fhir: $resource`: `Procedure`
# defines no `coding`, and `Procedure.text` is a Narrative, which the
# data-type chapter does not pair with DV_CODED_TEXT (#101). The method is
# left out; `bodySiteCoded` is the published one, which
# KDS_anatomical_location_prozedur overwrites.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name:  CLUSTER.anatomical_location.v1
  version: 0.0.1-alpha 
spec: 
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-CLUSTER.anatomical_location.v1
    revision: 1.3.1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/BackboneElement

mappings:
  - name: bodySiteCoded
    with:
      fhir: $fhirRoot
      openehr: $archetype/items[at0001] #Name of body site
    openehrCondition:
      targetRoot: $archetype
      targetAttribute: items[at0001]
      operator: type
      criteria: DV_CODED_TEXT

# unmapped openEHR  (archetype 1.3.1, CKM latest 1.5.1)
# items[at0002]  Laterality       KDS maps it (KDS_anatomical_location); KDS maps it (KDS_anatomical_location_prozedur)
# items[at0023]  Description
# items[at0055]  Anatomical Line
# items[at0064]  Aspect
# items[at0065]  Specific site
