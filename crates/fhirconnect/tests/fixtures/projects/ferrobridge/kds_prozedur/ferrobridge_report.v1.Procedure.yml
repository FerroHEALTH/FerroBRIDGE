# under docs/specs/fhirconnect-mapping-lib), Apache License 2.0; the source
# file carries no copyright line to keep.
# Changed: `participations` names `function` and `performer` below
# `context/participations`, which the engine carries only through
# `participationsFunction` (#101); `composerEmpty` and `contextStartTimeEmpty`
# write `null_flavour` below `composer` (a PARTY_PROXY) and
# `context/start_time` (a DV_DATE_TIME), while the openEHR RM carries
# `null_flavour` on ELEMENT only (#101). Those three methods are left out;
# every other method is the published one.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: COMPOSITION.report.v1.Procedure
  version: 0.0.1-alpha
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-COMPOSITION.report.v1
    revision: 1.2.4
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Procedure

mappings:
 #status is mapped in ISM transiition

  #  reference to party_identified NOT SUPPORTED since 1..1 whole mapping is commented out
  - name: composer
    with:
      fhir: $resource.recorder
      openehr: $composition/composer

  - name: context
    with:
      fhir: $resource
      openehr: $composition/context
      type: NONE
    unidirectional: fhir->openehr #action time also exists thats why
    followedBy:
      mappings:
        - name: performed
          with:
            fhir: performed.ofType(Period)
            openehr: $reference
          followedBy:
            mappings:
              - name: performedEnd
                with:
                  fhir: end
                  openehr: end_time

              - name: performedStart
                with:
                  fhir: start
                  openehr: start_time

        - name: performedDateTime
          with:
            fhir: performed.ofType(dateTime)
            openehr: start_time
