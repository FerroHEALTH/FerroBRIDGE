# file carries no copyright line to keep.
# Changed: the published lines 22 to 41 and 53 to 72 name `function` and
# `performer` below `context/participations` and `other_participations`,
# which the engine carries only through `participationsFunction`, and lines
# 48 to 51 name `$archetype/perfomer`, no attribute of EVALUATION (#101).
# Those three methods are left out; every other method is the published one.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: EVALUATION.vital_status.v1
  version: 0.0.1-alpha
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-EVALUATION.vital_status.v1
    revision: 1.0.1-alpha
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Observation

mappings:

  - name: healthCareFacility
    with:
      fhir: $resource.performer
      openehr: $composition/context/health_care_facility

  - name: composer
    with:
      fhir: $resource.performer
      openehr: $composition/composer

  - name: effective
    with:
      fhir: $resource.effective
      openehr: $archetype/protocol[at0002]/items[at0018]

  - name: vitalStatus
    with:
      fhir: $resource.value
      openehr: $archetype/data[at0001]/items[at0006]

  - name: note
    with:
      fhir: $resource.note.text
      openehr: $archetype/data[at0001]/items[at0013]

  - name: partOfReference
    with:
      fhir: $resource.partOf
      openehr: $archetype/links # will use link
    link:
      meaning: Part of referenced event
      type: partOf

  - name: partOfReference
    with:
      fhir: $resource.basedOn
      openehr: $archetype/links # will use link
    link:
      meaning: Fulfills plan, proposal or order
      type: basedOn

  - name: partOfReference
    with:
      fhir: $resource.basedOn
      openehr: $archetype/links # will use link
    link:
      meaning: What the observation is about, when it is not about the subject of record
      type: focus

  - name: partOfReference
    with:
      fhir: $resource.encounter
      openehr: $archetype/links # will use link
    link:
      meaning: case or contact
      type: case

  - name: partOfReference
    with:
      fhir: $resource.hasMember
      openehr: $archetype/links # will use link
    link:
      meaning: Related resource that belongs to the Observation group
      type: hasMember

# unmapped FHIR  (Observation R4)
# Observation.identifier
# Observation.status
# Observation.category          KDS maps it (KDS_vital_status)
# Observation.code              KDS maps it (KDS_vital_status)
# Observation.focus
# Observation.issued
# Observation.dataAbsentReason
# Observation.interpretation
# Observation.bodySite
# Observation.method
# Observation.specimen
# Observation.device
# Observation.referenceRange
# Observation.derivedFrom
# Observation.component
