# A FerroBRIDGE-authored model mapping of the problem diagnosis whose
# preprocessor admits only an occurrence that carries a comment
# (basics/Conditions.adoc, §Conditions in the preprocessor).
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_repeated_gate
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-EVALUATION.problem_diagnosis.v1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Condition

preprocessor:
  openehrCondition:
    targetRoot: "$archetype/data[at0001]"
    targetAttributes:
      - "items[at0069]"
    operator: "not empty"

mappings:
  - name: "note"
    with:
      fhir: "$resource.note.text"
      openehr: "$archetype/data[at0001]/items[at0069]"
