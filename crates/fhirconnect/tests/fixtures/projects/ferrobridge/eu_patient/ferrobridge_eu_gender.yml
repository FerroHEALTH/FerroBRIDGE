# file carries no copyright line to keep.
# Changed: the metadata name and version are FerroBRIDGE's; `metaURL` names
# patient-eu-core 2.0.0 in place of the MII Patient profile; the
# `other-amtlich` method, which writes the German gender-amtlich-de
# extension, is left out.
grammar: FHIRConnect/v1.0.0
type: extension
metadata:
  name: ferrobridge_eu_gender
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  extends: EVALUATION.gender.v1

mappings:
  - name: "metaURL"
    extension: "add"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "$resource.meta"
    manual:
      - name: "profileUrl"
        fhir:
          - path: "profile"
            value: "http://hl7.eu/fhir/base/StructureDefinition/patient-eu-core"
