# under docs/specs/fhirconnect-mapping-lib), Apache License 2.0; the source
# file carries no copyright line to keep.
# Changed: the metadata name and version are FerroBRIDGE's; the profile and
# the template are the published file's. The published extension list names
# KDS_person_pseudo_cluster.v1 and KDS_gender.v1 where the project's files
# declare person_pseudo_cluster.v1 and KDS_gender_pseudo.v1, and its start
# ADMIN_ENTRY.person_data.v0 reaches no gender evaluation, which the template
# requires, so the start here is the gender evaluation, whose gender stand-in
# slots the person data. Not listed are KDS_address_pseudo, which maps the
# code `Address.type` onto a DV_CODED_TEXT, KDS_admin_entry_perso_pseudo,
# which slots COMPOSITION.person.v1, no file of the library, and the
# project's KDS_composition, whose `metadata.name` the case project's file
# declares too (#101).
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrobridge_kds_person_pseudo.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: https://www.medizininformatik-initiative.de/fhir/core/modul-person/StructureDefinition/PatientPseudonymisiert
    version: 2025.0.0
  template:
    id: KDS_Person_Pseudonymisiert
    sem_ver: 63.0.0
  archetypes:
    - EVALUATION.gender.v1
    - ADMIN_ENTRY.person_data.v0
    - CLUSTER.person.v1
    - CLUSTER.address.v1
    - CLUSTER.person_birth_data_iso.v0
    - CLUSTER.death_details.v1
  extensions:
    - person_pseudo_cluster.v1
    - ferrobridge_kds_gender_pseudo
  start: EVALUATION.gender.v1
