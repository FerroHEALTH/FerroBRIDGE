[package]
name = "ferrobridge-fhirpath"
description = "A FHIRPath Normative Release 2.0.0 evaluator with the FHIR R4 additions, over the fhir-types element table"
# The crate line is the fhir-types line (docs/VERSIONS.md).
version = "0.1.127"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/ferrobridge-fhirpath"
readme = "README.md"
keywords = ["fhir", "fhirpath", "healthcare", "hl7"]
categories = ["parser-implementations", "science"]
# The crate line is published on crates.io; include is the packaged content.
publish = true
# The UCUM essence ships whole with its licence and provenance (vendor/ucum/PROVENANCE.md).
include = ["src/**", "vendor/ucum/**", "README.md", "LICENSE"]

[dependencies]
# The base64 and url base64 forms of FHIRPath 3.0.0 encode() and decode().
base64.workspace = true
chumsky.workspace = true
# The STU3 and R4 element tables are the type sources of the two models.
fhir-types = { workspace = true, features = ["stu3", "r4", "resources"] }
jiff.workspace = true
logos.workspace = true
# The XHTML narrative that htmlChecks() reads.
quick-xml.workspace = true
regex.workspace = true
# The exact decimal of System.Decimal and System.Quantity; `maths` carries the
# checked exp, ln, power and square root of N1 section 5.7.
rust_decimal = { workspace = true, features = ["maths"] }
# The JSON string form of FHIRPath 3.0.0 escape() and unescape().
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
ferrobridge-testkit.workspace = true
quick-xml.workspace = true
serde.workspace = true

[lints]
workspace = true
