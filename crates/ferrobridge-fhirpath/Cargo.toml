[package]
name = "ferrobridge-fhirpath"
description = "A FHIRPath Normative Release 2.0.0 evaluator with the FHIR R4 additions, over the fhir-types element table"
# 0.0.0 reserves the name on crates.io; the crate line is the fhir-types line (docs/VERSIONS.md).
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/ferrobridge-fhirpath"
readme = "README.md"
keywords = ["fhir", "fhirpath", "healthcare", "hl7"]
categories = ["parser-implementations", "science"]
# The crate line is published on crates.io; include is the packaged content.
publish = true
include = ["src/**", "README.md", "LICENSE"]

[dependencies]
chumsky.workspace = true
# The R4 element table is the type source of the R4 model.
fhir-types = { workspace = true, features = ["r4", "resources"] }
jiff.workspace = true
logos.workspace = true
# The XHTML narrative that htmlChecks() reads.
quick-xml.workspace = true
regex.workspace = true
# The exact decimal of System.Decimal and System.Quantity; `maths` carries the
# checked exp, ln, power and square root of N1 section 5.7.
rust_decimal = { workspace = true, features = ["maths"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
ferrobridge-testkit.workspace = true
quick-xml.workspace = true
serde_json.workspace = true

[lints]
workspace = true
