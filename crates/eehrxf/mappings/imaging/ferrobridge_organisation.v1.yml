# file carries no copyright line to keep.
# Changed: the metadata version is FerroBRIDGE's. The cluster is the
# organisation that performed an imaging examination, in the Imaging service
# slot of OBSERVATION.imaging_exam_result.v1, and the Organization it becomes
# is the performer of the report.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: CLUSTER.organisation.v1
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-CLUSTER.organisation.v1
    revision: 1.0.1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Organization

mappings:
  - name: orgName
    with:
      fhir: $fhirRoot.name
      openehr: $archetype/items[at0001]

  - name: orgId
    with:
      fhir: $fhirRoot.identifier
      openehr: $archetype/items[at0003]

# unmapped FHIR  (Organization R4)
# Organization.active
# Organization.type
# Organization.alias
# Organization.telecom
# Organization.address
# Organization.partOf
# Organization.contact
# Organization.endpoint
