# FerroBRIDGE's model mapping of the CKM CLUSTER.dosage.v2 (revision 2.0.3)
# to a FHIR R4 Dosage. The library's dosage.v2.yml reads through mapping
# codes this bridge does not carry, so this one is FerroBRIDGE's: the
# sequence, the free-text instruction and the dose as a quantity.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: CLUSTER.dosage.v2
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-CLUSTER.dosage.v2
    revision: 2.0.3
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Dosage

mappings:
  - name: "text"
    with:
      fhir: "$fhirRoot.text"
      openehr: "$archetype/items[at0178]"

  - name: "sequence"
    with:
      fhir: "$fhirRoot.sequence"
      openehr: "$archetype/items[at0164]"

  - name: "doseQuantity"
    with:
      fhir: "$fhirRoot.doseAndRate.dose.as(Quantity)"
      openehr: "$archetype/items[at0144]"
