# FerroBRIDGE's model mapping of the CKM INSTRUCTION.medication_order.v3
# (revision 3.2.1) to a FHIR R4 MedicationRequest. The mapping library
# publishes none for this archetype. The order's activity carries the
# medication, its directions and its dosage; the composition carries the
# authoring time and the prescriber. An INSTRUCTION records no request
# status, so the resource says `unknown` and a status going in is a declared
# loss; it is always an `order` (no specification governs the two fixed
# values: our own design).
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: INSTRUCTION.medication_order.v3
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-INSTRUCTION.medication_order.v3
    revision: 3.2.1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/MedicationRequest

mappings:
  # NOTE: CKM INSTRUCTION.medication_order.v3 at0112 holds the order status "generally used in
  # non-prescription contexts", and no published crosswalk pairs it with the R4
  # medicationrequest-status codes, so the status stays `unknown`.
  - name: "status"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "$resource"
    manual:
      - name: "unknown"
        fhir:
          - path: "status"
            value: "unknown"

  - name: "intent"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "$resource"
    manual:
      - name: "order"
        fhir:
          - path: "intent"
            value: "order"

  - name: "identifier"
    with:
      fhir: "$resource.identifier"
      openehr: "$archetype/protocol[at0005]/items[at0004]"

  - name: "authoredOn"
    with:
      fhir: "$resource.authoredOn"
      openehr: "$composition/context/start_time"

  - name: "requester"
    with:
      fhir: "$resource.requester"
      openehr: "$composition/composer"

  # The activity repeats (0..*), so one mapping holds it and every element
  # of the order runs below it, in the one activity the request describes.
  - name: "order"
    with:
      fhir: "$resource"
      openehr: "$archetype/activities[at0001]"
    followedBy:
      mappings:
        - name: "medicationCode"
          with:
            fhir: "medication.as(CodeableConcept)"
            openehr: "description[at0002]/items[at0070]"

        - name: "medication"
          with:
            fhir: "medication.as(Reference)"
            openehr: "$reference"
          reference:
            resourceType: "Medication"
            mappings:
              - name: "medicationDetails"
                with:
                  fhir: "$fhirRoot"
                  openehr: "description[at0002]/items[openEHR-EHR-CLUSTER.medication.v2]"
                slotArchetype: "CLUSTER.medication.v2"

        - name: "reasonCode"
          with:
            fhir: "reasonCode"
            openehr: "description[at0002]/items[at0018]"

        - name: "note"
          with:
            fhir: "note.text"
            openehr: "description[at0002]/items[at0167]"

        - name: "dosageInstruction"
          with:
            fhir: "dosageInstruction"
            openehr: "description[at0002]/items[openEHR-EHR-CLUSTER.therapeutic_direction.v1]/items[openEHR-EHR-CLUSTER.dosage.v2]"
          slotArchetype: "CLUSTER.dosage.v2"
          # The order's route sits beside the therapeutic direction, two
          # levels above the dosage, and FHIR carries it on the dosage.
          followedBy:
            mappings:
              - name: "route"
                with:
                  fhir: "route"
                  openehr: "../../items[at0091]"

        - name: "validityStart"
          with:
            fhir: "dispenseRequest.validityPeriod.start"
            openehr: "description[at0002]/items[at0129]/items[at0155]"

        - name: "validityEnd"
          with:
            fhir: "dispenseRequest.validityPeriod.end"
            openehr: "description[at0002]/items[at0129]/items[at0161]"

        # The authorisation directions slot holds the CKM
        # CLUSTER.medication_authorisation.v0 (revision 0.0.1-alpha): the
        # refills authorised after the first dispense, the least interval
        # between two, and the refills the holder states are left, which
        # no element of R4 carries and the remaining-dispensations extension
        # of the eehrxf crate does.
        - name: "numberOfRepeatsAllowed"
          with:
            fhir: "dispenseRequest.numberOfRepeatsAllowed"
            openehr: "description[at0002]/items[openEHR-EHR-CLUSTER.medication_authorisation.v0]/items[at0025]"

        - name: "dispenseInterval"
          with:
            fhir: "dispenseRequest.dispenseInterval"
            openehr: "description[at0002]/items[openEHR-EHR-CLUSTER.medication_authorisation.v0]/items[at0046]"

        - name: "remainingDispensations"
          with:
            fhir: "dispenseRequest.extension"
            openehr: "description[at0002]/items[openEHR-EHR-CLUSTER.medication_authorisation.v0]"
          fhirCondition:
            targetRoot: "dispenseRequest.extension"
            targetAttribute: "url"
            operator: "one of"
            criteria: "https://ferrobridge.eu/fhir/StructureDefinition/remaining-dispensations"
          followedBy:
            mappings:
              - name: "remainingValue"
                with:
                  fhir: "value.as(UnsignedInt)"
                  openehr: "items[at0079]"

              - name: "remainingUrl"
                with:
                  fhir: "$fhirRoot"
                manual:
                  - name: "url"
                    fhir:
                      - path: "url"
                        value: "https://ferrobridge.eu/fhir/StructureDefinition/remaining-dispensations"

        # The dispense amount slot of the dispense directions holds the CKM
        # CLUSTER.medication_supply_amount.v0 (revision 0.0.1-alpha).
        # NOTE: CKM INSTRUCTION.medication_order.v3 at0065 is "the amount of the ordered item to be
        # dispensed", the R4 dispenseRequest.quantity "for one fill", never the MPD prescribedQuantity
        # extension, which is the overall amount "independent from the number of repeats".
        - name: "dispenseQuantity"
          with:
            fhir: "dispenseRequest.quantity"
            openehr: "description[at0002]/items[at0129]/items[openEHR-EHR-CLUSTER.medication_supply_amount.v0]/items[at0131]"

        - name: "expectedSupplyDuration"
          with:
            fhir: "dispenseRequest.expectedSupplyDuration"
            openehr: "description[at0002]/items[at0129]/items[openEHR-EHR-CLUSTER.medication_supply_amount.v0]/items[at0142]"
