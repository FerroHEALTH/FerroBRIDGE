# FerroBRIDGE's model mapping of the CKM INSTRUCTION.medication_order.v3 to
# the HL7 Europe Base and Core 2.0.1 medicationRequest-eu-core profile, the
# entry the Hospital Discharge Report's discharge medications section takes:
# the medication item, the overall directions and the comment of the order's
# activity. As in the MPD project, an INSTRUCTION records no request status,
# so the resource says `unknown`, and it is always an `order` (no
# specification governs the two fixed values: our own design).
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: INSTRUCTION.medication_order.v3
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-INSTRUCTION.medication_order.v3
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/MedicationRequest

mappings:
  - name: "metaURL"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "$resource.meta"
    manual:
      - name: "profileUrl"
        fhir:
          - path: "profile"
            value: "http://hl7.eu/fhir/base/StructureDefinition/medicationRequest-eu-core"

  - name: "status"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "$resource"
    manual:
      - name: "unknown"
        fhir:
          - path: "status"
            value: "unknown"

  - name: "intent"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "$resource"
    manual:
      - name: "order"
        fhir:
          - path: "intent"
            value: "order"

  - name: "order"
    with:
      fhir: "$resource"
      openehr: "$archetype/activities[at0001]"
    followedBy:
      mappings:
        - name: "medicationCode"
          with:
            fhir: "medication.as(CodeableConcept)"
            openehr: "description[at0002]/items[at0070]"

        - name: "directions"
          with:
            fhir: "dosageInstruction.text"
            openehr: "description[at0002]/items[at0009]"

        - name: "comment"
          with:
            fhir: "note.text"
            openehr: "description[at0002]/items[at0167]"
