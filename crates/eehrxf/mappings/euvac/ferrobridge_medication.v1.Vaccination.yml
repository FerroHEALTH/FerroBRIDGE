# FerroBRIDGE's model mapping of the CKM ACTION.medication.v1 (revision
# 1.6.0) to the FHIR R4 Immunization of a MyHealth@EU vaccination,
# vaccination-myhealtheu-euvac 10.0.0-preview. A dose administered (careflow
# step at0006) is `completed` and a dose administration aborted (at0158)
# `not-done`; every other step records no administration, so no Immunization
# is written for it (no specification governs the pairing: our own design).
# The sequence number (at0025, "for example: vaccine sequence number") is the
# dose number, and the territory the composition was written in is the
# vaccination country. The vaccine, the time, the route, the sequence number
# and the comment are the elements the profile has a place for; a run out of
# openEHR declares every other element of the action the composition holds,
# each one the euvac project lists as left out.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ACTION.medication.v1.Vaccination
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-ACTION.medication.v1
    revision: 1.6.0
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Immunization

preprocessor:
  openehrCondition:
    targetRoot: "$archetype"
    targetAttribute: "ism_transition/careflow_step/defining_code/code_string"
    operator: "one of"
    criteria:
      - "at0006"
      - "at0158"

mappings:
  - name: "statusCompleted"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "$resource"
      openehr: "$archetype"
    openehrCondition:
      targetRoot: "$archetype"
      targetAttribute: "ism_transition/careflow_step/defining_code/code_string"
      operator: "one of"
      criteria: "at0006"
    manual:
      - name: "completed"
        fhir:
          - path: "status"
            value: "completed"

  - name: "statusNotDone"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "$resource"
      openehr: "$archetype"
    openehrCondition:
      targetRoot: "$archetype"
      targetAttribute: "ism_transition/careflow_step/defining_code/code_string"
      operator: "one of"
      criteria: "at0158"
    manual:
      - name: "notDone"
        fhir:
          - path: "status"
            value: "not-done"

  - name: "vaccineCode"
    with:
      fhir: "$resource.vaccineCode"
      openehr: "$archetype/description[at0017]/items[at0020]"

  - name: "occurrence"
    with:
      fhir: "$resource.occurrence.as(DateTime)"
      openehr: "$archetype/time"

  - name: "route"
    with:
      fhir: "$resource.route"
      openehr: "$archetype/description[at0017]/items[at0140]/items[at0147]"

  - name: "note"
    with:
      fhir: "$resource.note.text"
      openehr: "$archetype/description[at0017]/items[at0024]"

  - name: "doseNumber"
    with:
      fhir: "$resource.protocolApplied.doseNumber.as(PositiveInt)"
      openehr: "$archetype/description[at0017]/items[at0025]"

  # NOTE: R4 Immunization.protocolApplied.doseNumber[x] is 1..1 and the profile makes protocolApplied
  # 1..*, so a dose with no sequence number states the number absent (R4 extension data-absent-reason).
  - name: "doseNumberAbsent"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "$resource.protocolApplied.doseNumber.as(String).extension"
      openehr: "$archetype"
    openehrCondition:
      targetRoot: "$archetype"
      targetAttribute: "description[at0017]/items[at0025]"
      operator: "empty"
    manual:
      - name: "unknown"
        fhir:
          - path: "url"
            value: "http://hl7.org/fhir/StructureDefinition/data-absent-reason"
          - path: "value.as(Code)"
            value: "unknown"

  # NOTE: vaccination-myhealtheu-euvac makes Immunization.location 1..1, the vaccination country of
  # MyHealthEuVaccination.vaccinationCountry; RM COMPOSITION.territory names where it was written.
  - name: "location"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "$resource.location"
      openehr: "$reference"
    reference:
      resourceType: "Location"
      mappings:
        - name: "locationProfile"
          unidirectional: "openEHR->fhir"
          with:
            fhir: "$fhirRoot.meta"
          manual:
            - name: "profileUrl"
              fhir:
                - path: "profile"
                  value: "http://fhir.ehdsi.eu/core/StructureDefinition/location-myhealtheu-core"
        - name: "country"
          unidirectional: "openEHR->fhir"
          with:
            fhir: "$fhirRoot.address.country"
            openehr: "$composition/territory/code_string"
