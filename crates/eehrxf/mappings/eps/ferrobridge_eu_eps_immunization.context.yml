# FerroBRIDGE's sub-context for the immunisations of the HL7 Europe Patient
# Summary 1.0.0-ballot, entered from ferrobridge_eu_eps.context at the
# template's immunisations section, the CKM vaccination list: each medication
# action the section holds becomes one immunization-eu-core, the profile the
# section's immunization entry slice admits.
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrobridge_eu_eps_immunization.context
  version: 2.0.0
spec:
  system: FHIR
  version: R4
context:
  scope: sub
  profile:
    url: "http://hl7.eu/fhir/eps/StructureDefinition/composition-eu-eps"
    version: "1.0.0-ballot"
  template:
    id: "openEHR-EHR-COMPOSITION.ferrobridge_patient_summary.v1.0.0"
  archetypes:
    - "SECTION.immunisation_list.v0"
    - "ACTION.medication.v1.Immunization"
  extensions:
    - "ferrobridge_eu_eps_immunization_section"
  start: "SECTION.immunisation_list.v0"
