# (FHIRconnect 1.0.0, types-of-mapping-files/sub-contexts.adoc), so the model
# maps nothing of its own.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: SECTION.immunisation_list.v0
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-SECTION.immunisation_list.v0
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/BackboneElement
