# FerroBRIDGE's model mapping of the CKM INSTRUCTION.medication_order.v3
# (revision 3.2.1) to a FHIR R4 MedicationStatement, the entry of a patient
# summary's medication summary. The mapping library publishes none for this
# archetype. The order's activity carries the medicine, its directions, its
# route, its indication and, in its order details, when the medicine is
# taken; an order that states no start says so with a data absent reason.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: INSTRUCTION.medication_order.v3.MedicationStatement
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-INSTRUCTION.medication_order.v3
    revision: 3.2.1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/MedicationStatement

# An order that names no medicine states nothing to take, so it writes no
# MedicationStatement.
preprocessor:
  openehrCondition:
    targetRoot: "$archetype"
    targetAttribute: "activities[at0001]/description[at0002]/items[at0070]"
    operator: "not empty"

mappings:
  # NOTE: CKM INSTRUCTION.medication_order.v3 at0112 holds the order status "generally used in
  # non-prescription contexts", and no published crosswalk pairs an order with the R4
  # medication-statement-status codes, so the status stays `unknown`.
  - name: "status"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "$resource"
    manual:
      - name: "unknown"
        fhir:
          - path: "status"
            value: "unknown"

  # NOTE: FHIR R4 extension-data-absent-reason.html: MedicationStatement-eu-eps requires
  # effective[x], so an order whose details state no start writes the period `unknown`.
  - name: "effectiveUnknown"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "$resource.effective.as(Period).extension"
      openehr: "$archetype"
    openehrCondition:
      targetRoot: "$archetype"
      targetAttribute: "activities[at0001]/description[at0002]/items[at0113]/items[at0012]"
      operator: "empty"
    manual:
      - name: "unknown"
        fhir:
          - path: "url"
            value: "http://hl7.org/fhir/StructureDefinition/data-absent-reason"
          - path: "valueCode"
            value: "unknown"

  - name: "dateAsserted"
    with:
      fhir: "$resource.dateAsserted"
      openehr: "$composition/context/start_time"

  # The activity repeats (0..*), so one mapping holds it and every element
  # of the order runs below it, in the one activity the statement describes.
  - name: "order"
    with:
      fhir: "$resource"
      openehr: "$archetype/activities[at0001]"
    followedBy:
      mappings:
        - name: "medicationCode"
          with:
            fhir: "medication.as(CodeableConcept)"
            openehr: "description[at0002]/items[at0070]"

        - name: "effectiveStart"
          with:
            fhir: "effective.as(Period).start"
            openehr: "description[at0002]/items[at0113]/items[at0012]"

        - name: "effectiveEnd"
          with:
            fhir: "effective.as(Period).end"
            openehr: "description[at0002]/items[at0113]/items[at0013]"

        - name: "reasonCode"
          with:
            fhir: "reasonCode"
            openehr: "description[at0002]/items[at0018]"

        - name: "note"
          with:
            fhir: "note.text"
            openehr: "description[at0002]/items[at0167]"

        - name: "dosage"
          with:
            fhir: "dosage"
            openehr: "description[at0002]"
            type: "NONE"
          followedBy:
            mappings:
              - name: "text"
                with:
                  fhir: "text"
                  openehr: "items[at0009]"

              - name: "route"
                with:
                  fhir: "route"
                  openehr: "items[at0091]"
