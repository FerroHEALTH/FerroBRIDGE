# FerroBRIDGE's extension that makes the ad hoc section the medication
# summary of the HL7 Europe Patient Summary 1.0.0-ballot (Composition slice
# sectionMedications, LOINC 10160-0), loaded by
# ferrobridge_eu_eps_medication.context alone. Each medication order and each
# medication action the section holds is one entry, the MedicationStatement
# it maps to.
grammar: FHIRConnect/v1.0.0
type: extension
metadata:
  name: ferrobridge_eu_eps_medication_section
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  extends: SECTION.adhoc.v1

mappings:
  - name: "title"
    extension: "add"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "$fhirRoot"
    manual:
      - name: "title"
        fhir:
          - path: "title"
            value: "Medication summary"

  - name: "code"
    extension: "add"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "code.coding"
    manual:
      - name: "loinc"
        fhir:
          - path: "system"
            value: "http://loinc.org"
          - path: "code"
            value: "10160-0"

  - name: "orders"
    extension: "add"
    with:
      fhir: "entry"
      openehr: "$archetype/items[openEHR-EHR-INSTRUCTION.medication_order.v3]"
    followedBy:
      mappings:
        - name: "order"
          with:
            fhir: "$fhirRoot"
            openehr: "$reference"
          reference:
            resourceType: "MedicationStatement"
            mappings:
              - name: "profile"
                unidirectional: "openEHR->fhir"
                with:
                  fhir: "$fhirRoot.meta"
                manual:
                  - name: "profileUrl"
                    fhir:
                      - path: "profile"
                        value: "http://hl7.eu/fhir/eps/StructureDefinition/MedicationStatement-eu-eps"
              - name: "medicationOrder"
                with:
                  fhir: "$fhirRoot"
                  openehr: "$openehrRoot"
                slotArchetype: "INSTRUCTION.medication_order.v3.MedicationStatement"

  - name: "actions"
    extension: "add"
    with:
      fhir: "entry"
      openehr: "$archetype/items[openEHR-EHR-ACTION.medication.v1]"
    followedBy:
      mappings:
        - name: "action"
          with:
            fhir: "$fhirRoot"
            openehr: "$reference"
          reference:
            resourceType: "MedicationStatement"
            mappings:
              - name: "profile"
                unidirectional: "openEHR->fhir"
                with:
                  fhir: "$fhirRoot.meta"
                manual:
                  - name: "profileUrl"
                    fhir:
                      - path: "profile"
                        value: "http://hl7.eu/fhir/eps/StructureDefinition/MedicationStatement-eu-eps"
              - name: "medicationAction"
                with:
                  fhir: "$fhirRoot"
                  openehr: "$openehrRoot"
                slotArchetype: "ACTION.medication.v1.MedicationStatement"
