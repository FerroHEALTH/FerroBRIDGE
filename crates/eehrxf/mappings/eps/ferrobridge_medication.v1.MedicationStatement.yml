# FerroBRIDGE's model mapping of the CKM ACTION.medication.v1 (revision
# 1.6.0) to a FHIR R4 MedicationStatement, the entry of a patient summary's
# medication summary when the action records a medicine the patient takes.
# The action's time is when the medicine was taken, and its instruction state
# gives the statement's status where R4 names one for it.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ACTION.medication.v1.MedicationStatement
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-ACTION.medication.v1
    revision: 1.6.0
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/MedicationStatement

mappings:
  # NOTE: no specification governs this: our own design; the openEHR instruction states
  # active (245), suspended (530), aborted (531) and completed (532) pair with the R4
  # medication-statement-status codes below, and every other state is `unknown`.
  - name: "statusActive"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "$resource"
      openehr: "$archetype"
    openehrCondition:
      targetRoot: "$archetype"
      targetAttribute: "ism_transition/current_state/defining_code/code_string"
      operator: "one of"
      criteria: "245"
    manual:
      - name: "active"
        fhir:
          - path: "status"
            value: "active"

  - name: "statusOnHold"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "$resource"
      openehr: "$archetype"
    openehrCondition:
      targetRoot: "$archetype"
      targetAttribute: "ism_transition/current_state/defining_code/code_string"
      operator: "one of"
      criteria: "530"
    manual:
      - name: "onHold"
        fhir:
          - path: "status"
            value: "on-hold"

  - name: "statusStopped"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "$resource"
      openehr: "$archetype"
    openehrCondition:
      targetRoot: "$archetype"
      targetAttribute: "ism_transition/current_state/defining_code/code_string"
      operator: "one of"
      criteria: "531"
    manual:
      - name: "stopped"
        fhir:
          - path: "status"
            value: "stopped"

  - name: "statusCompleted"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "$resource"
      openehr: "$archetype"
    openehrCondition:
      targetRoot: "$archetype"
      targetAttribute: "ism_transition/current_state/defining_code/code_string"
      operator: "one of"
      criteria: "532"
    manual:
      - name: "completed"
        fhir:
          - path: "status"
            value: "completed"

  - name: "statusUnknown"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "$resource"
      openehr: "$archetype"
    openehrCondition:
      targetRoot: "$archetype"
      targetAttribute: "ism_transition/current_state/defining_code/code_string"
      operator: "not of"
      criteria:
        - "245"
        - "530"
        - "531"
        - "532"
    manual:
      - name: "unknown"
        fhir:
          - path: "status"
            value: "unknown"

  - name: "medicationCode"
    with:
      fhir: "$resource.medication.as(CodeableConcept)"
      openehr: "$archetype/description[at0017]/items[at0020]"

  # NOTE: MedicationStatement-eu-eps 1.0.0-ballot requires effective[x] and slices
  # effectiveDateTime; ACTION.time is when the recorded step happened (openEHR RM ehr §ACTION).
  - name: "effective"
    with:
      fhir: "$resource.effective.as(DateTime)"
      openehr: "$archetype/time"

  - name: "dateAsserted"
    with:
      fhir: "$resource.dateAsserted"
      openehr: "$composition/context/start_time"

  - name: "reasonCode"
    with:
      fhir: "$resource.reasonCode"
      openehr: "$archetype/description[at0017]/items[at0021]"

  - name: "note"
    with:
      fhir: "$resource.note.text"
      openehr: "$archetype/description[at0017]/items[at0024]"

  - name: "route"
    with:
      fhir: "$resource.dosage.route"
      openehr: "$archetype/description[at0017]/items[at0140]/items[at0147]"
