# FerroBRIDGE's extension that makes the ad hoc section named "Problem list"
# the problems section of the HL7 Europe Patient Summary 1.0.0-ballot
# (Composition slice sectionProblems, LOINC 11450-4), loaded by
# ferrobridge_eu_eps_problems.context alone. Each problem or diagnosis the section holds
# is one entry, the Condition it maps to.
grammar: FHIRConnect/v1.0.0
type: extension
metadata:
  name: ferrobridge_eu_eps_problems_section
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  extends: SECTION.adhoc.v1

mappings:
  - name: "title"
    extension: "add"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "$fhirRoot"
    manual:
      - name: "title"
        fhir:
          - path: "title"
            value: "Problem list"

  - name: "code"
    extension: "add"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "code.coding"
    manual:
      - name: "loinc"
        fhir:
          - path: "system"
            value: "http://loinc.org"
          - path: "code"
            value: "11450-4"

  - name: "entries"
    extension: "add"
    with:
      fhir: "entry"
      openehr: "$archetype/items[openEHR-EHR-EVALUATION.problem_diagnosis.v1]"
    followedBy:
      mappings:
        - name: "entry"
          with:
            fhir: "$fhirRoot"
            openehr: "$reference"
          reference:
            resourceType: "Condition"
            mappings:
              - name: "problemsEntry"
                with:
                  fhir: "$fhirRoot"
                  openehr: "$openehrRoot"
                slotArchetype: "EVALUATION.problem_diagnosis.v1"
