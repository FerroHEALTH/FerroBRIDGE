# FerroBRIDGE's context for the medication summary of the HL7 Europe Patient
# Summary 1.0.0-ballot over FerroBRIDGE's patient summary template, whose
# archetypes are CKM's: each medication order of its medication summary
# section becomes one MedicationStatement-eu-eps, the profile the section's
# medicationStatementOrRequest entry slice admits. A CDR that keeps the
# current medication list as orders so has them in the summary.
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrobridge_eu_eps_medication.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: "http://hl7.eu/fhir/eps/StructureDefinition/MedicationStatement-eu-eps"
    version: "1.0.0-ballot"
  template:
    id: "openEHR-EHR-COMPOSITION.ferrobridge_patient_summary.v1.0.0"
  archetypes:
    - "INSTRUCTION.medication_order.v3.MedicationStatement"
  start: "INSTRUCTION.medication_order.v3.MedicationStatement"
