# The search of the EHDSEncounter resources: the R4 Encounter `patient`
# parameter and the start of the encounter as the R4 `date`.
context: ferrobridge_ehds_encounter.context
patient:
  parameters: [patient]
parameters:
  date:
    type: date
    path: context/start_time/value
