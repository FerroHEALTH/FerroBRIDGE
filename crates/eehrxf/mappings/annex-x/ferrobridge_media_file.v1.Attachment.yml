# FerroBRIDGE's model mapping of the CKM CLUSTER.media_file.v1 (revision
# 1.0.6) to a FHIR R4 Attachment, the draft EEHRxF Annex X data group
# EHDSAttachment: the content as the attachment itself and its name as the
# title.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: CLUSTER.media_file.v1.Attachment
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-CLUSTER.media_file.v1
    revision: 1.0.6
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Attachment

mappings:
  - name: "content"
    with:
      fhir: "$fhirRoot"
      openehr: "$archetype/items[at0001]"
