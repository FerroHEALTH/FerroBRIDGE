# The search of the EHDSPregnancyHistory Observations: the patient with the
# category, the code and the date, as IHE QEDm 3.0.0 PCC-44 2:3.44.4.1.2.1.1
# asks of the Simple Observations option. The mapping writes the category
# social-history and the LOINC code 11636-8 as constants; the date is the
# time the summary was last updated.
context: ferrobridge_ehds_pregnancy_history.context
patient:
  parameters: [patient]
parameters:
  category:
    type: token
    fixed:
      system: "http://terminology.hl7.org/CodeSystem/observation-category"
      code: social-history
  code:
    type: token
    fixed:
      system: "http://loinc.org"
      code: "11636-8"
  date:
    type: date
    node: { class: EVALUATION, archetype: openEHR-EHR-EVALUATION.obstetric_summary.v1 }
    path: protocol[at0008]/items[at0009]/value/value
