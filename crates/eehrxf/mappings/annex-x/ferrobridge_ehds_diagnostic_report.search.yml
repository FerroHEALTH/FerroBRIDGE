# The search of the laboratory DiagnosticReports: the patient with the
# category and the date, as IHE QEDm 3.0.0 PCC-44 2:3.44.4.1.2.1.4 asks of
# the Diagnostic Reports option, and the analyte Observations a report
# references through `_include`. The mapping writes the category as a
# constant; the date is the origin of the result's history. The report's
# code sits under the repeating event of KDS_Laborbericht, which one search
# node cannot read as one value, so `code` is not declared.
context: ferrobridge_ehds_diagnostic_report.context
patient:
  parameters: [patient]
parameters:
  category:
    type: token
    fixed:
      system: "http://terminology.hl7.org/CodeSystem/v2-0074"
      code: LAB
  date:
    type: date
    node: { class: OBSERVATION, archetype: openEHR-EHR-OBSERVATION.laboratory_test_result.v1 }
    path: data[at0001]/origin/value
include:
  - result
