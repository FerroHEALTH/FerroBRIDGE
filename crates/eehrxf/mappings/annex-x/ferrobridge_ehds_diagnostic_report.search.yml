# The search of the laboratory DiagnosticReports: the patient with the
# category, the code and the date, as IHE QEDm 3.0.0 PCC-44 2:3.44.4.1.2.1.4
# asks of the Diagnostic Reports option, and the analyte Observations a report
# references through `_include`. The mapping writes the category as a
# constant; the code is the test name under any event of the result, and the
# date the origin of its history.
context: ferrobridge_ehds_diagnostic_report.context
patient:
  parameters: [patient]
parameters:
  category:
    type: token
    fixed:
      system: "http://terminology.hl7.org/CodeSystem/v2-0074"
      code: LAB
  code:
    type: token
    node:
      class: OBSERVATION
      archetype: openEHR-EHR-OBSERVATION.laboratory_test_result.v1
      contains: { class: EVENT, node: at0002 }
    path: data[at0003]/items[at0005,'Labortest-Bezeichnung']/value
    systems:
      "http://loinc.org": LOINC
  date:
    type: date
    node: { class: OBSERVATION, archetype: openEHR-EHR-OBSERVATION.laboratory_test_result.v1 }
    path: data[at0001]/origin/value
include:
  - result
