# The search of the EHDSTravelHistory Observations: the patient with the
# category, the code and the date, as IHE QEDm 3.0.0 PCC-44 2:3.44.4.1.2.1.1
# asks of the Simple Observations option. The mapping writes the category
# social-history and the LOINC code 94651-7 the profile fixes as constants;
# the date is the date of departure.
context: ferrobridge_ehds_travel_history.context
patient:
  parameters: [patient]
parameters:
  category:
    type: token
    fixed:
      system: "http://terminology.hl7.org/CodeSystem/observation-category"
      code: social-history
  code:
    type: token
    fixed:
      system: "http://loinc.org"
      code: "94651-7"
  date:
    type: date
    node: { class: ADMIN_ENTRY, archetype: openEHR-EHR-ADMIN_ENTRY.travel_event.v0 }
    path: data[at0001]/items[at0009]/value/value
