# The search of the EHDSProcedure resources: the patient and the date the
# procedure reached its careflow step, as IHE QEDm 3.0.0 PCC-44
# 2:3.44.4.1.2.1.7 asks of the Procedures option.
context: ferrobridge_ehds_procedure.context
patient:
  parameters: [patient]
parameters:
  date:
    type: date
    node: { class: ACTION, archetype: openEHR-EHR-ACTION.procedure.v1 }
    path: time/value
