# The model mapping of EHDSHealthProfessional over the reference CDR's
# healthcare professional PERSON definition: the identifiers and the name
# with its parts.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_ehds_health_professional
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-DEMOGRAPHIC-PERSON.healthcare_professional.v1
    revision: 1.0.0
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Practitioner

mappings:
  - name: "identifier"
    with:
      fhir: "$resource.identifier"
      openehr: "$archetype/details[id2]/items[id3]"
  - name: "name"
    with:
      fhir: "$resource.name"
      openehr: "$archetype/identities[id4]/details[id5]"
      type: "NONE"
    followedBy:
      mappings:
        - name: "fullName"
          with:
            fhir: "text"
            openehr: "items[id6]"
        - name: "givenName"
          with:
            fhir: "given"
            openehr: "items[id7]"
        - name: "familyName"
          with:
            fhir: "family"
            openehr: "items[id8]"
