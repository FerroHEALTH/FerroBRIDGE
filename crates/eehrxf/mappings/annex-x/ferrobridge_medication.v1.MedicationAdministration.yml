# FerroBRIDGE's model mapping of the CKM ACTION.medication.v1 (revision
# 1.6.0) to a FHIR R4 MedicationAdministration, the draft EEHRxF Annex X data group
# EHDSMedicationAdministration. A dose administered (careflow step at0006)
# is `completed` and a dose administration aborted (at0158) `not-done`, both
# ways; every other step records no administration. The amount slot holds
# the dosage, and the composition its setting.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ACTION.medication.v1.MedicationAdministration
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-ACTION.medication.v1
    revision: 1.6.0
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/MedicationAdministration

preprocessor:
  openehrCondition:
    targetRoot: "$archetype"
    targetAttribute: "ism_transition/careflow_step/defining_code/code_string"
    operator: "one of"
    criteria:
      - "at0006"
      - "at0158"

mappings:
  - name: "status"
    with:
      fhir: "$resource"
      openehr: "$archetype/ism_transition"
    manual:
      - name: "completed"
        fhir:
          - path: "status"
            value: "completed"
        fhirCondition:
          targetRoot: "$fhirRoot"
          targetAttribute: "status"
          operator: "one of"
          criteria: "completed"
        openehr:
          - path: "current_state/defining_code/terminology_id/value"
            value: "openehr"
          - path: "current_state/defining_code/code_string"
            value: "245"
          - path: "current_state/value"
            value: "active"
          - path: "careflow_step/defining_code/terminology_id/value"
            value: "local"
          - path: "careflow_step/defining_code/code_string"
            value: "at0006"
          - path: "careflow_step/value"
            value: "Dose administered"
        openehrCondition:
          targetRoot: "$openehrRoot"
          targetAttribute: "careflow_step/defining_code/code_string"
          operator: "one of"
          criteria: "at0006"
      - name: "notDone"
        fhir:
          - path: "status"
            value: "not-done"
        fhirCondition:
          targetRoot: "$fhirRoot"
          targetAttribute: "status"
          operator: "one of"
          criteria: "not-done"
        openehr:
          - path: "current_state/defining_code/terminology_id/value"
            value: "openehr"
          - path: "current_state/defining_code/code_string"
            value: "245"
          - path: "current_state/value"
            value: "active"
          - path: "careflow_step/defining_code/terminology_id/value"
            value: "local"
          - path: "careflow_step/defining_code/code_string"
            value: "at0158"
          - path: "careflow_step/value"
            value: "Dose administration aborted"
        openehrCondition:
          targetRoot: "$openehrRoot"
          targetAttribute: "careflow_step/defining_code/code_string"
          operator: "one of"
          criteria: "at0158"

  - name: "medication"
    with:
      fhir: "$resource.medication.as(CodeableConcept)"
      openehr: "$archetype/description[at0017]/items[at0020]"

  - name: "effective"
    with:
      fhir: "$resource.effective.as(DateTime)"
      openehr: "$archetype/time"

  - name: "dosage"
    with:
      fhir: "$resource.dosage"
      openehr: "$archetype/description[at0017]/items[openEHR-EHR-CLUSTER.dosage.v2]"
    slotArchetype: "CLUSTER.dosage.v2.AdministeredDosage"

  - name: "route"
    with:
      fhir: "$resource.dosage.route"
      openehr: "$archetype/description[at0017]/items[at0140]/items[at0147]"

  - name: "note"
    with:
      fhir: "$resource.note.text"
      openehr: "$archetype/description[at0017]/items[at0024]"

  - name: "composition"
    with:
      fhir: "$resource"
      openehr: "$composition"
    slotArchetype: "COMPOSITION.encounter.v1.MedicationAdministration"
