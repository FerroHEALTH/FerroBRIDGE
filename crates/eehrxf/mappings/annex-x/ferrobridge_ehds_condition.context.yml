# FerroBRIDGE's context for the draft EEHRxF Annex X data group EHDSCondition
# (Table 9), served by the facade as an individual resource (draft act Art
# 7(2), #2087): each EVALUATION.problem_diagnosis.v1 entry of the template
# becomes one Condition with the
# http://hl7.eu/fhir/base/StructureDefinition/condition-eu-core profile.
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrobridge_ehds_condition.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: "http://hl7.eu/fhir/base/StructureDefinition/condition-eu-core"
    version: "2.0.1"
  template:
    id: "openEHR-EHR-COMPOSITION.ferrobridge_patient_summary.v1.0.0"
  archetypes:
    - "EVALUATION.problem_diagnosis.v1"
  start: "EVALUATION.problem_diagnosis.v1"
