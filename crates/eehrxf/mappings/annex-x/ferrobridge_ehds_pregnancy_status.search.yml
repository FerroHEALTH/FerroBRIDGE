# The search of the EHDSCurrentPregnancyStatus Observations: the patient
# with the category, the code and the date, as IHE QEDm 3.0.0 PCC-44
# 2:3.44.4.1.2.1.1 asks of the Simple Observations option. The mapping
# writes the category social-history and the LOINC code 82810-3 as
# constants; the date is the time of the assertion.
context: ferrobridge_ehds_pregnancy_status.context
patient:
  parameters: [patient]
parameters:
  category:
    type: token
    fixed:
      system: "http://terminology.hl7.org/CodeSystem/observation-category"
      code: social-history
  code:
    type: token
    fixed:
      system: "http://loinc.org"
      code: "82810-3"
  date:
    type: date
    node: { class: OBSERVATION, archetype: openEHR-EHR-OBSERVATION.pregnancy_assertion.v0 }
    path: data[at0001]/events[at0016]/time/value
