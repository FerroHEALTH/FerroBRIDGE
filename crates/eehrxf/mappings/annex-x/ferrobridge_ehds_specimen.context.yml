# FerroBRIDGE's context for the draft EEHRxF Annex X data group EHDSSpecimen
# (Table 31), served by the facade as an individual resource (draft act Art
# 7(2), #2087): each specimen of a laboratory result in the published
# KDS_Laborbericht template becomes one Specimen with the HL7 Europe
# Laboratory Report 2.1.0 Specimen-eu-lab profile.
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrobridge_ehds_specimen.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: "http://hl7.eu/fhir/laboratory/StructureDefinition/Specimen-eu-lab"
    version: "2.1.0"
  template:
    id: "KDS_Laborbericht"
  archetypes:
    - "CLUSTER.specimen.v1"
  extensions:
    - "ferrobridge_eu_laboratory_specimen"
  start: "CLUSTER.specimen.v1"
