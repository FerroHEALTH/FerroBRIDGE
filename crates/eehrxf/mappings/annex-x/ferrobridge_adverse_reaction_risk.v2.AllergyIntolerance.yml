# Source: SevKohler/FHIRconnect-mapping-lib at commit 2ba7cf5d (vendored
# under docs/specs/fhirconnect-mapping-lib), Apache License 2.0; the source
# file carries no copyright line to keep.
# Changed: the `manual` rows write `defining_code/terminology_id/value`, the
# form types-of-mappings/concept-type/manual.adoc writes, and the
# `fhirCondition` of each row under a `coding` mapping filters `$fhirRoot`
# (#101); the profile is HL7 Europe Base allergyIntolerance-eu-core, the
# entry the HL7 Europe Patient Summary's allergies section takes; and the
# reaction and the commented-out reaction mechanism are left out, since the
# patient summary template holds no reaction event cluster; and the category
# is a `manual` of the archetype's Food and Medication codes, which R4
# `allergy-intolerance-category` pairs with `food` and `medication`, since
# the data-type chapter pairs no DV_CODED_TEXT with a `code`.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: EVALUATION.adverse_reaction_risk.v2
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-EVALUATION.adverse_reaction_risk.v2
    revision: 1.4.1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/AllergyIntolerance

preprocessor:
  fhirCondition:
    targetRoot: "$resource" # exclude entered-in-error, openEHR verification status has no value for it
    targetAttribute: "verificationStatus.coding.code"
    operator: "not of"
    criteria: "entered-in-error"

mappings:
  - name: "metaURL"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "$resource.meta"
    manual:
      - name: "profileUrl"
        fhir:
          - path: "profile"
            value: "http://hl7.eu/fhir/base/StructureDefinition/allergyIntolerance-eu-core"

  - name: "substance"
    with:
      fhir: "$resource.code"
      openehr: "$archetype/data[at0001]/items[at0002]"

  - name: "activeInactive" # clinicalStatus "resolved" has no openEHR equivalent (at0130 is active | inactive only) and is dropped
    with:
      fhir: "$resource.clinicalStatus"
      openehr: "$archetype"
    followedBy:
      mappings:
        - name: "activeInactiveAllergies"
          with:
            fhir: "coding"
            openehr: "data[at0001]/items[at0130]"
            type: "NONE"
          manual:
            - name: "active"
              openehr:
                - path: "defining_code/terminology_id/value"
                  value: "local"
                - path: "defining_code/code_string"
                  value: "at0131"
                - path: "value"
                  value: "Active"
              fhirCondition:
                targetRoot: "$fhirRoot"
                targetAttribute: "code"
                operator: "one of"
                criteria: "active"
              fhir:
                - path: "code"
                  value: "active"
                - path: "system"
                  value: "http://terminology.hl7.org/CodeSystem/allergyintolerance-clinical"
                - path: "display"
                  value: "Active"
              openehrCondition:
                targetRoot: "$archetype/data[at0001]/items[at0130]"
                targetAttribute: "defining_code/code_string"
                operator: "one of"
                criteria: "at0131"

            - name: "inactive"
              openehr:
                - path: "defining_code/terminology_id/value"
                  value: "local"
                - path: "defining_code/code_string"
                  value: "at0132"
                - path: "value"
                  value: "Inactive"
              fhirCondition:
                targetRoot: "$fhirRoot"
                targetAttribute: "code"
                operator: "one of"
                criteria: "inactive"
              fhir:
                - path: "code"
                  value: "inactive"
                - path: "system"
                  value: "http://terminology.hl7.org/CodeSystem/allergyintolerance-clinical"
                - path: "display"
                  value: "Inactive"
              openehrCondition:
                targetRoot: "$archetype/data[at0001]/items[at0130]"
                targetAttribute: "defining_code/code_string"
                operator: "one of"
                criteria: "at0132"

  - name: "verificationStatus"
    with:
      fhir: "$resource.verificationStatus"
      openehr: "$archetype"
    followedBy:
      mappings:
        - name: "verificationStatusAllergies"
          with:
            fhir: "coding"
            openehr: "data[at0001]/items[at0063]"
            type: "NONE"
          manual:
            - name: "unconfirmed"
              openehr:
                - path: "defining_code/terminology_id/value"
                  value: "local"
                - path: "defining_code/code_string"
                  value: "at0064"
                - path: "value"
                  value: "Unconfirmed"
              fhirCondition:
                targetRoot: "$fhirRoot"
                targetAttribute: "code"
                operator: "one of"
                criteria: "unconfirmed"
              fhir:
                - path: "code"
                  value: "unconfirmed"
                - path: "system"
                  value: "http://terminology.hl7.org/CodeSystem/allergyintolerance-verification"
                - path: "display"
                  value: "Unconfirmed"
              openehrCondition:
                targetRoot: "$archetype/data[at0001]/items[at0063]"
                targetAttribute: "defining_code/code_string"
                operator: "one of"
                criteria: "at0064"

            - name: "confirmed"
              openehr:
                - path: "defining_code/terminology_id/value"
                  value: "local"
                - path: "defining_code/code_string"
                  value: "at0065"
                - path: "value"
                  value: "Confirmed"
              fhirCondition:
                targetRoot: "$fhirRoot"
                targetAttribute: "code"
                operator: "one of"
                criteria: "confirmed"
              fhir:
                - path: "code"
                  value: "confirmed"
                - path: "system"
                  value: "http://terminology.hl7.org/CodeSystem/allergyintolerance-verification"
                - path: "display"
                  value: "Confirmed"
              openehrCondition:
                targetRoot: "$archetype/data[at0001]/items[at0063]"
                targetAttribute: "defining_code/code_string"
                operator: "one of"
                criteria: "at0065"

            - name: "refuted"
              openehr:
                - path: "defining_code/terminology_id/value"
                  value: "local"
                - path: "defining_code/code_string"
                  value: "at0066"
                - path: "value"
                  value: "Refuted"
              fhirCondition:
                targetRoot: "$fhirRoot"
                targetAttribute: "code"
                operator: "one of"
                criteria: "refuted"
              fhir:
                - path: "code"
                  value: "refuted"
                - path: "system"
                  value: "http://terminology.hl7.org/CodeSystem/allergyintolerance-verification"
                - path: "display"
                  value: "Refuted"
              openehrCondition:
                targetRoot: "$archetype/data[at0001]/items[at0063]"
                targetAttribute: "defining_code/code_string"
                operator: "one of"
                criteria: "at0066"

  - name: "criticality"
    with:
      fhir: "$resource.criticality"
      openehr: "$archetype/data[at0001]/items[at0101]"
      type: "NONE"
    manual:
      - name: "low"
        openehr:
          - path: "defining_code/terminology_id/value"
            value: "local"
          - path: "defining_code/code_string"
            value: "at0102"
          - path: "value"
            value: "Low"
        fhirCondition:
          targetRoot: "$resource"
          targetAttribute: "criticality"
          operator: "one of"
          criteria: "low"
        fhir:
          - path: "$fhirRoot"
            value: "low"
        openehrCondition:
          targetRoot: "$archetype/data[at0001]/items[at0101]"
          targetAttribute: "defining_code/code_string"
          operator: "one of"
          criteria: "at0102"

      - name: "high"
        openehr:
          - path: "defining_code/terminology_id/value"
            value: "local"
          - path: "defining_code/code_string"
            value: "at0103"
          - path: "value"
            value: "High"
        fhirCondition:
          targetRoot: "$resource"
          targetAttribute: "criticality"
          operator: "one of"
          criteria: "high"
        fhir:
          - path: "$fhirRoot"
            value: "high"
        openehrCondition:
          targetRoot: "$archetype/data[at0001]/items[at0101]"
          targetAttribute: "defining_code/code_string"
          operator: "one of"
          criteria: "at0103"

      - name: "indeterminate"
        openehr:
          - path: "defining_code/terminology_id/value"
            value: "local"
          - path: "defining_code/code_string"
            value: "at0124"
          - path: "value"
            value: "indeterminate"
        fhirCondition:
          targetRoot: "$resource"
          targetAttribute: "criticality"
          operator: "one of"
          criteria: "unable-to-assess"
        fhir:
          - path: "$fhirRoot"
            value: "unable-to-assess"
        openehrCondition:
          targetRoot: "$archetype/data[at0001]/items[at0101]"
          targetAttribute: "defining_code/code_string"
          operator: "one of"
          criteria: "at0124"

  - name: "category"
    with:
      fhir: "$resource.category"
      openehr: "$archetype/data[at0001]/items[at0120]"
      type: "NONE"
    manual:
      - name: "food"
        openehr:
          - path: "defining_code/terminology_id/value"
            value: "local"
          - path: "defining_code/code_string"
            value: "at0121"
          - path: "value"
            value: "Food"
        fhirCondition:
          targetRoot: "$resource"
          targetAttribute: "category"
          operator: "one of"
          criteria: "food"
        fhir:
          - path: "$fhirRoot"
            value: "food"
        openehrCondition:
          targetRoot: "$archetype/data[at0001]/items[at0120]"
          targetAttribute: "defining_code/code_string"
          operator: "one of"
          criteria: "at0121"

      - name: "medication"
        openehr:
          - path: "defining_code/terminology_id/value"
            value: "local"
          - path: "defining_code/code_string"
            value: "at0122"
          - path: "value"
            value: "Medication"
        fhirCondition:
          targetRoot: "$resource"
          targetAttribute: "category"
          operator: "one of"
          criteria: "medication"
        fhir:
          - path: "$fhirRoot"
            value: "medication"
        openehrCondition:
          targetRoot: "$archetype/data[at0001]/items[at0120]"
          targetAttribute: "defining_code/code_string"
          operator: "one of"
          criteria: "at0122"

  - name: "lastOccurrence"
    with:
      fhir: "$resource.lastOccurrence"
      openehr: "$archetype/data[at0001]/items[at0117]"

  - name: "onsetDateTime"
    with:
      fhir: "$resource.onset.ofType(dateTime)"
      openehr: "$archetype/data[at0001]/items[at0133]"
    openehrCondition:
      targetRoot: "$archetype"
      targetAttribute: "data[at0001]/items[at0133]"
      operator: "type"
      criteria: "DV_DATE_TIME"

  - name: "onsetDuration"
    with:
      fhir: "$resource.onset.ofType(Age)"
      openehr: "$archetype/data[at0001]/items[at0133]"
    openehrCondition:
      targetRoot: "$archetype"
      targetAttribute: "data[at0001]/items[at0133]"
      operator: "type"
      criteria: "DV_DURATION"

  - name: "onsetIntervalPeriod"
    with:
      fhir: "$resource.onset.ofType(Period)"
      openehr: "$archetype/data[at0001]/items[at0133]"
    openehrCondition:
      targetRoot: "$archetype"
      targetAttribute: "data[at0001]/items[at0133]"
      operator: "type"
      criteria: "DV_INTERVAL<DV_DATE_TIME>"

  - name: "onsetIntervalRange"
    with:
      fhir: "$resource.onset.ofType(Range)"
      openehr: "$archetype/data[at0001]/items[at0133]"
    openehrCondition:
      targetRoot: "$archetype"
      targetAttribute: "data[at0001]/items[at0133]"
      operator: "type"
      criteria: "DV_INTERVAL<DV_DURATION>"

  - name: "onsetString"
    with:
      fhir: "$resource.onset.ofType(string)"
      openehr: "$archetype/data[at0001]/items[at0133]"
    openehrCondition:
      targetRoot: "$archetype"
      targetAttribute: "data[at0001]/items[at0133]"
      operator: "type"
      criteria: "DV_TEXT"

  - name: "comment"
    with:
      fhir: "$resource.note.text"
      openehr: "$archetype/data[at0001]/items[at0006]"
