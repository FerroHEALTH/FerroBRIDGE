# The search of the EHDSCondition resources: the patient, as IHE QEDm 3.0.0
# PCC-44 2:3.44.4.1.2.1.3 asks of the Conditions option, and the onset as
# the R4 `onset-date`.
context: ferrobridge_ehds_condition.context
patient:
  parameters: [patient]
parameters:
  onset-date:
    type: date
    node: { class: EVALUATION, archetype: openEHR-EHR-EVALUATION.problem_diagnosis.v1 }
    path: data[at0001]/items[at0077]/value/value
