# FerroBRIDGE's model mapping of the CKM CLUSTER.dosage.v2 (revision 2.0.3)
# to the dosage of a FHIR R4 MedicationAdministration, the draft EEHRxF
# Annex X data group EHDSAdministeredDosage: the dose description as the
# text and the dose as the quantity given.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: CLUSTER.dosage.v2.AdministeredDosage
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-CLUSTER.dosage.v2
    revision: 2.0.3
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/MedicationAdministration

mappings:
  - name: "text"
    with:
      fhir: "$fhirRoot.text"
      openehr: "$archetype/items[at0178]"

  - name: "dose"
    with:
      fhir: "$fhirRoot.dose"
      openehr: "$archetype/items[at0144]"
