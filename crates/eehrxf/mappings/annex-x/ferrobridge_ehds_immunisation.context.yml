# FerroBRIDGE's context for the draft EEHRxF Annex X data group
# EHDSImmunisation (Table 18), served by the facade as an individual resource
# (draft act Art 7(2), #2087): each ACTION.medication.v1.Immunization entry of
# the template becomes one Immunization with the
# http://hl7.eu/fhir/base/StructureDefinition/immunization-eu-core profile.
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrobridge_ehds_immunisation.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: "http://hl7.eu/fhir/base/StructureDefinition/immunization-eu-core"
    version: "2.0.1"
  template:
    id: "openEHR-EHR-COMPOSITION.ferrobridge_ehds_record.v1.0.0"
  archetypes:
    - "ACTION.medication.v1.Immunization"
  start: "ACTION.medication.v1.Immunization"
