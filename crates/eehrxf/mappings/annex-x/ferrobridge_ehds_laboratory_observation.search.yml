# The search of the EHDSLaboratoryObservation resources: the patient with the
# category, the code and the date, as IHE QEDm 3.0.0 PCC-44
# 2:3.44.4.1.2.1.1 asks of the Simple Observations option. The mapping
# writes the category as a constant; the code is the analyte's name and the
# date the origin of the history of the result that holds it.
context: ferrobridge_ehds_laboratory_observation.context
patient:
  parameters: [patient]
parameters:
  category:
    type: token
    fixed:
      system: "http://terminology.hl7.org/CodeSystem/observation-category"
      code: laboratory
  code:
    type: token
    node: { class: CLUSTER, archetype: openEHR-EHR-CLUSTER.laboratory_test_analyte.v1 }
    path: items[at0024]/value
    systems:
      "http://loinc.org": LOINC
  date:
    type: date
    node: { class: OBSERVATION, archetype: openEHR-EHR-OBSERVATION.laboratory_test_result.v1 }
    path: data[at0001]/origin/value
