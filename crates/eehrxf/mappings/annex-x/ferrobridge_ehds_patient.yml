# SPDX-License-Identifier: BUSL-1.1
# The model mapping of EHDSPatient over the reference CDR's patient PERSON
# definition: the identifiers with their type, the name with its parts, the
# date of birth, the administrative gender from the recorded sex, each
# postal address and each electronic address, its type the coded name of
# the ADDRESS (value set ac4) as the ContactPoint system R4 cpt-2 requires
# beside a value, a mobile number read as a phone of the use mobile.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_ehds_patient
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-DEMOGRAPHIC-PERSON.patient.v1
    revision: 1.0.0
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Patient

mappings:
  - name: "identifier"
    with:
      fhir: "$resource.identifier"
      openehr: "$archetype/details[id2]/items[id3]"
  - name: "birthDate"
    with:
      fhir: "$resource.birthDate"
      openehr: "$archetype/details[id2]/items[id4]"
  - name: "gender"
    with:
      fhir: "$resource"
      openehr: "$archetype/details[id2]/items[id5]/value"
    manual:
      - name: "male"
        fhir:
          - path: "gender"
            value: "male"
        openehrCondition:
          targetRoot: "$openehrRoot"
          targetAttribute: "defining_code/code_string"
          operator: "one of"
          criteria: "at10"
        openehr:
          - path: "defining_code/terminology_id/value"
            value: "local"
          - path: "defining_code/code_string"
            value: "at10"
        fhirCondition:
          targetRoot: "$fhirRoot"
          targetAttribute: "gender"
          operator: "one of"
          criteria: "male"
      - name: "female"
        fhir:
          - path: "gender"
            value: "female"
        openehrCondition:
          targetRoot: "$openehrRoot"
          targetAttribute: "defining_code/code_string"
          operator: "one of"
          criteria: "at11"
        openehr:
          - path: "defining_code/terminology_id/value"
            value: "local"
          - path: "defining_code/code_string"
            value: "at11"
        fhirCondition:
          targetRoot: "$fhirRoot"
          targetAttribute: "gender"
          operator: "one of"
          criteria: "female"
      - name: "other"
        fhir:
          - path: "gender"
            value: "other"
        openehrCondition:
          targetRoot: "$openehrRoot"
          targetAttribute: "defining_code/code_string"
          operator: "one of"
          criteria: "at12"
        openehr:
          - path: "defining_code/terminology_id/value"
            value: "local"
          - path: "defining_code/code_string"
            value: "at12"
        fhirCondition:
          targetRoot: "$fhirRoot"
          targetAttribute: "gender"
          operator: "one of"
          criteria: "other"
      - name: "unknown"
        fhir:
          - path: "gender"
            value: "unknown"
        openehrCondition:
          targetRoot: "$openehrRoot"
          targetAttribute: "defining_code/code_string"
          operator: "one of"
          criteria: "at13"
        openehr:
          - path: "defining_code/terminology_id/value"
            value: "local"
          - path: "defining_code/code_string"
            value: "at13"
        fhirCondition:
          targetRoot: "$fhirRoot"
          targetAttribute: "gender"
          operator: "one of"
          criteria: "unknown"
  - name: "name"
    with:
      fhir: "$resource.name"
      openehr: "$archetype/identities[id6]/details[id7]"
      type: "NONE"
    followedBy:
      mappings:
        - name: "fullName"
          with:
            fhir: "text"
            openehr: "items[id8]"
        - name: "givenName"
          with:
            fhir: "given"
            openehr: "items[id9]"
        - name: "familyName"
          with:
            fhir: "family"
            openehr: "items[id10]"
  - name: "address"
    with:
      fhir: "$resource.address"
      openehr: "$archetype/contacts[id11]/addresses[id12]/details[id13]"
      type: "NONE"
    followedBy:
      mappings:
        - name: "line"
          with:
            fhir: "line"
            openehr: "items[id14]"
        - name: "postalCode"
          with:
            fhir: "postalCode"
            openehr: "items[id15]"
        - name: "city"
          with:
            fhir: "city"
            openehr: "items[id16]"
        - name: "state"
          with:
            fhir: "state"
            openehr: "items[id17]"
        - name: "country"
          with:
            fhir: "country"
            openehr: "items[id18]"
  - name: "telecom"
    with:
      fhir: "$resource.telecom"
      openehr: "$archetype/contacts[id11]/addresses[id19]"
      type: "NONE"
    followedBy:
      mappings:
        - name: "value"
          with:
            fhir: "value"
            openehr: "details[id20]/items[id22]"
        - name: "system"
          with:
            fhir: "$fhirRoot"
            openehr: "name"
          manual:
            - name: "phone"
              fhir:
                - path: "system"
                  value: "phone"
              fhirCondition:
                targetRoot: "$fhirRoot"
                targetAttribute: "system"
                operator: "one of"
                criteria: "phone"
              openehr:
                - path: "defining_code/terminology_id/value"
                  value: "local"
                - path: "defining_code/code_string"
                  value: "at40"
                - path: "value"
                  value: "Telephone"
              openehrCondition:
                targetRoot: "$openehrRoot"
                targetAttribute: "defining_code/code_string"
                operator: "one of"
                criteria: "at40"
            - name: "fax"
              fhir:
                - path: "system"
                  value: "fax"
              fhirCondition:
                targetRoot: "$fhirRoot"
                targetAttribute: "system"
                operator: "one of"
                criteria: "fax"
              openehr:
                - path: "defining_code/terminology_id/value"
                  value: "local"
                - path: "defining_code/code_string"
                  value: "at41"
                - path: "value"
                  value: "Fax"
              openehrCondition:
                targetRoot: "$openehrRoot"
                targetAttribute: "defining_code/code_string"
                operator: "one of"
                criteria: "at41"
            - name: "pager"
              fhir:
                - path: "system"
                  value: "pager"
              fhirCondition:
                targetRoot: "$fhirRoot"
                targetAttribute: "system"
                operator: "one of"
                criteria: "pager"
              openehr:
                - path: "defining_code/terminology_id/value"
                  value: "local"
                - path: "defining_code/code_string"
                  value: "at43"
                - path: "value"
                  value: "Pager"
              openehrCondition:
                targetRoot: "$openehrRoot"
                targetAttribute: "defining_code/code_string"
                operator: "one of"
                criteria: "at43"
            - name: "email"
              fhir:
                - path: "system"
                  value: "email"
              fhirCondition:
                targetRoot: "$fhirRoot"
                targetAttribute: "system"
                operator: "one of"
                criteria: "email"
              openehr:
                - path: "defining_code/terminology_id/value"
                  value: "local"
                - path: "defining_code/code_string"
                  value: "at44"
                - path: "value"
                  value: "E-mail"
              openehrCondition:
                targetRoot: "$openehrRoot"
                targetAttribute: "defining_code/code_string"
                operator: "one of"
                criteria: "at44"
            - name: "url"
              fhir:
                - path: "system"
                  value: "url"
              fhirCondition:
                targetRoot: "$fhirRoot"
                targetAttribute: "system"
                operator: "one of"
                criteria: "url"
              openehr:
                - path: "defining_code/terminology_id/value"
                  value: "local"
                - path: "defining_code/code_string"
                  value: "at45"
                - path: "value"
                  value: "URL"
              openehrCondition:
                targetRoot: "$openehrRoot"
                targetAttribute: "defining_code/code_string"
                operator: "one of"
                criteria: "at45"
        - name: "mobile"
          unidirectional: "openehr->fhir"
          with:
            fhir: "$fhirRoot"
            openehr: "name"
          manual:
            - name: "mobile"
              fhir:
                - path: "system"
                  value: "phone"
                - path: "use"
                  value: "mobile"
              openehrCondition:
                targetRoot: "$openehrRoot"
                targetAttribute: "defining_code/code_string"
                operator: "one of"
                criteria: "at42"
