# FerroBRIDGE's model mapping of the CKM CLUSTER.anatomical_location.v1
# (revision 1.5.1) to a FHIR R4 BodyStructure, the draft EEHRxF Annex X data
# group EHDSBodyStructure. bodyStructure-eu-core 2.0.1 forbids `location` and
# carries the site in the R5 includedStructure extension, so the body site
# name is its `structure` and the description the resource's.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: CLUSTER.anatomical_location.v1.BodyStructure
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-CLUSTER.anatomical_location.v1
    revision: 1.5.1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/BodyStructure

mappings:
  - name: "includedStructure"
    with:
      fhir: "$resource.extension"
      openehr: "$archetype/items[at0001]"
      type: "NONE"
    fhirCondition:
      targetRoot: "$resource.extension"
      targetAttribute: "url"
      operator: "one of"
      criteria: "http://hl7.org/fhir/5.0/StructureDefinition/extension-BodyStructure.includedStructure"
    followedBy:
      mappings:
        - name: "includedStructureUrl"
          with:
            fhir: "$fhirRoot"
          manual:
            - name: "url"
              fhir:
                - path: "url"
                  value: "http://hl7.org/fhir/5.0/StructureDefinition/extension-BodyStructure.includedStructure"
        - name: "structure"
          with:
            fhir: "extension"
            openehr: "$archetype/items[at0001]"
            type: "NONE"
          fhirCondition:
            targetRoot: "$fhirRoot.extension"
            targetAttribute: "url"
            operator: "one of"
            criteria: "structure"
          followedBy:
            mappings:
              - name: "structureValue"
                with:
                  fhir: "value.as(CodeableConcept)"
                  openehr: "$archetype/items[at0001]"
              - name: "structureUrl"
                with:
                  fhir: "$fhirRoot"
                manual:
                  - name: "url"
                    fhir:
                      - path: "url"
                        value: "structure"

  - name: "description"
    with:
      fhir: "$resource.description"
      openehr: "$archetype/items[at0023]"
