# The search of the EHDSMedicationUse resources: the patient, with the
# EHDSMedication each statement references through `_include`, as IHE QEDm
# 3.0.0 PCC-44 2:3.44.4.1.2.1.5 asks of the Medications option.
context: ferrobridge_ehds_medication_use.context
patient:
  parameters: [patient]
include:
  - medication
