# FerroBRIDGE's context for the draft EEHRxF Annex X data group EHDSLocation
# (Table 20), served by the facade as an individual Location (draft act
# Art 7(2), #2087) with the HL7 Europe Base and Core 2.0.1 location-eu-core
# profile. openEHR has no party class for a place, so each EHDS record
# COMPOSITION's EVENT_CONTEXT gives one Location, read-only: its location
# and the health care facility that manages it (RM EVENT_CONTEXT). No
# specification governs the derivation: our own design.
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrobridge_ehds_location.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: "http://hl7.eu/fhir/base/StructureDefinition/location-eu-core"
    version: "2.0.1"
  template:
    id: "openEHR-EHR-COMPOSITION.ferrobridge_ehds_record.v1.0.0"
  archetypes:
    - "COMPOSITION.encounter.v1.Location"
  start: "COMPOSITION.encounter.v1.Location"
