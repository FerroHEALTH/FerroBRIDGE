# The search of the EHDSObservation resources: the patient with the
# category, the code and the date, as IHE QEDm 3.0.0 PCC-44
# 2:3.44.4.1.2.1.1 asks of the Simple Observations option. The mapping
# writes the category and the code as constants, so both are fixed; the
# date is the origin of the observation's history.
context: ferrobridge_ehds_observation.context
patient:
  parameters: [patient]
parameters:
  category:
    type: token
    fixed:
      system: "http://terminology.hl7.org/CodeSystem/observation-category"
      code: vital-signs
  code:
    type: token
    fixed:
      system: "http://loinc.org"
      code: "29463-7"
  date:
    type: date
    node: { class: OBSERVATION, archetype: openEHR-EHR-OBSERVATION.body_weight.v2 }
    path: data[at0002]/origin/value
