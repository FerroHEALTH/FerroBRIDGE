          - path: "value"
            value: "Amended"
        openehrCondition:
          targetRoot: "$openehrRoot"
          targetAttribute: "defining_code/code_string"
          operator: "one of"
          criteria: "amended"
      - name: "corrected"
        fhir:
          - path: "status"
            value: "corrected"
        fhirCondition:
          targetRoot: "$fhirRoot"
          targetAttribute: "status"
          operator: "one of"
          criteria: "corrected"
        openehr:
          - path: "defining_code/terminology_id/value"
            value: "http://hl7.org/fhir/diagnostic-report-status"
          - path: "defining_code/code_string"
            value: "corrected"
          - path: "value"
            value: "Corrected"
        openehrCondition:
          targetRoot: "$openehrRoot"
          targetAttribute: "defining_code/code_string"
          operator: "one of"
          criteria: "corrected"
      - name: "appended"
        fhir:
          - path: "status"
            value: "appended"
        fhirCondition:
