          targetAttribute: "defining_code/code_string"
          operator: "one of"
          criteria: "appended"
      - name: "cancelled"
        fhir:
          - path: "status"
            value: "cancelled"
        fhirCondition:
          targetRoot: "$fhirRoot"
          targetAttribute: "status"
          operator: "one of"
          criteria: "cancelled"
        openehr:
          - path: "defining_code/terminology_id/value"
            value: "http://hl7.org/fhir/diagnostic-report-status"
          - path: "defining_code/code_string"
            value: "cancelled"
          - path: "value"
            value: "Cancelled"
        openehrCondition:
          targetRoot: "$openehrRoot"
          targetAttribute: "defining_code/code_string"
          operator: "one of"
          criteria: "cancelled"
      - name: "entered-in-error"
        fhir:
          - path: "status"
            value: "entered-in-error"
        fhirCondition:
          targetRoot: "$fhirRoot"
          targetAttribute: "status"
          operator: "one of"
          criteria: "entered-in-error"
        openehr:
          - path: "defining_code/terminology_id/value"
            value: "http://hl7.org/fhir/diagnostic-report-status"
          - path: "defining_code/code_string"
            value: "entered-in-error"
          - path: "value"
