      - name: "unknown"
        fhir:
          - path: "status"
            value: "unknown"
        fhirCondition:
          targetRoot: "$fhirRoot"
          targetAttribute: "status"
          operator: "one of"
          criteria: "unknown"
        openehr:
          - path: "defining_code/terminology_id/value"
            value: "http://hl7.org/fhir/diagnostic-report-status"
