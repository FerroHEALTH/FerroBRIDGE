# FerroBRIDGE's context for the HL7 Europe Laboratory Report 2.0.0
# Composition-eu-lab profile over the published KDS_Laborbericht template:
# the report composition becomes the document's Composition, whose one
# section references the DiagnosticReport-eu-lab, which references its
# Observation-resultslab-eu-lab results and Specimen-eu-lab specimens.
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrobridge_eu_lab_composition.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: "http://hl7.eu/fhir/laboratory/StructureDefinition/Composition-eu-lab"
    version: "2.0.0"
  template:
    id: "KDS_Laborbericht"
  archetypes:
    - "COMPOSITION.report_result.v1.Composition"
    - "OBSERVATION.laboratory_test_result.v1"
    - "CLUSTER.laboratory_test_analyte.v1"
    - "CLUSTER.specimen.v1"
  extensions:
    - "ferrobridge_eu_lab_composition"
    - "ferrobridge_eu_lab_composition_report"
    - "ferrobridge_eu_laboratory_analyte"
    - "ferrobridge_eu_laboratory_specimen"
  start: "COMPOSITION.report_result.v1.Composition"
