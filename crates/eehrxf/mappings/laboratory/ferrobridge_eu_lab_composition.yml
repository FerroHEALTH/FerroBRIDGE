# FerroBRIDGE's extension of COMPOSITION.report_result.v1.Composition for
# the HL7 Europe Laboratory Report 2.0.0 Composition-eu-lab profile: its
# canonical.
grammar: FHIRConnect/v1.0.0
type: extension
metadata:
  name: ferrobridge_eu_lab_composition
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  extends: COMPOSITION.report_result.v1.Composition

mappings:
  - name: "metaURL"
    extension: "add"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "$resource.meta"
    manual:
      - name: "profileUrl"
        fhir:
          - path: "profile"
            value: "http://hl7.eu/fhir/laboratory/StructureDefinition/Composition-eu-lab"
