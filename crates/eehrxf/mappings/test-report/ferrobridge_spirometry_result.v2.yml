# FerroBRIDGE's model mapping of the CKM OBSERVATION.spirometry_result.v2
# (revision as vendored in fixtures/ckm/test-report) to an R4
# DiagnosticReport: LOINC 18759-1 as the report's code, the event's time as
# its effective time and the clinical interpretation as its conclusion. The
# archetype records a performed test, so the report is final. No
# specification governs these choices: our own design.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: OBSERVATION.spirometry_result.v2
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-OBSERVATION.spirometry_result.v2
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/DiagnosticReport

mappings:
  - name: "status"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "$resource"
    manual:
      - name: "final"
        fhir:
          - path: "status"
            value: "final"

  - name: "code"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "$resource.code.coding"
    manual:
      - name: "spirometry"
        fhir:
          - path: "system"
            value: "http://loinc.org"
          - path: "code"
            value: "18759-1"
          - path: "display"
            value: "Spirometry study"

  - name: "eventParent"
    with:
      fhir: "$resource"
      openehr: "$archetype/data[at0001]/events[at0002]"
    followedBy:
      mappings:
        - name: "eventTime"
          with:
            fhir: "effective.as(DateTime)"
            openehr: "time"

        - name: "conclusion"
          with:
            fhir: "conclusion"
            openehr: "data[at0003]/items[at0130]"
