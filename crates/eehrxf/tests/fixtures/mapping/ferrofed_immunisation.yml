# A synthetic model mapping for the medication controls of the patient
# summary: a synthetic medication use whose coded kind is "vaccine" (at0006)
# becomes an Immunization, its code the vaccineCode, by the explicit
# criterion of the preprocessor. Every value is synthetic; no clinical
# content.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrofed_immunisation
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-EVALUATION.ferrofed_medication.v1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Immunization

preprocessor:
  openehrCondition:
    targetRoot: $archetype
    targetAttribute: data[at0001]/items[at0004]/value/defining_code/code_string
    operator: one of
    criteria: at0006

mappings:
  - name: "vaccine"
    with:
      fhir: "$resource.vaccineCode"
      openehr: "$archetype/data[at0001]/items[at0002]"
      type: "CODEABLECONCEPT"

  - name: "status"
    unidirectional: "openehr->fhir"
    with:
      fhir: "$resource"
    manual:
      - name: "statusCompleted"
        fhir:
          - path: "status"
            value: "completed"

  - name: "occurrence"
    unidirectional: "openehr->fhir"
    with:
      fhir: "$resource"
    manual:
      - name: "occurrenceUnknown"
        fhir:
          - path: "occurrenceString"
            value: "Synthetic date unknown"

  - name: "patient"
    unidirectional: "openehr->fhir"
    with:
      fhir: "$resource.patient"
    manual:
      - name: "patientReference"
        fhir:
          - path: "reference"
            value: "Patient/synthetic-subject-1343"
