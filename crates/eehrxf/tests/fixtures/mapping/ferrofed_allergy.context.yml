# The context that compiles the synthetic allergy model mapping beside this
# file against the synthetic ferrofed.eehrxf.allergy.v1 template. The profile
# URL is example.org, which RFC 6761 section 6.5 reserves for examples.
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrofed_allergy.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: "http://example.org/fhir/StructureDefinition/ferrofed-allergy"
  template:
    id: "ferrofed.eehrxf.allergy.v1"
  archetypes:
    - "ferrofed_allergy"
  start: "ferrofed_allergy"
