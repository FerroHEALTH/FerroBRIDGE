# The context that compiles the synthetic allergy model mapping of the eehrxf
# fixtures against the synthetic ferrofed.eehrxf.allergy.v1 template, to the
# HL7 Europe allergyIntolerance-eu-core profile the patient summary crosswalk
# admits for the allergies section. Every value is synthetic.
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrofed_eu_allergy.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: "http://hl7.eu/fhir/base/StructureDefinition/allergyIntolerance-eu-core"
  template:
    id: "ferrofed.eehrxf.allergy.v1"
  archetypes:
    - "ferrofed_allergy"
  start: "ferrofed_allergy"
