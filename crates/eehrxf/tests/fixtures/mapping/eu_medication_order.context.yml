# The context that compiles the synthetic medication order model mapping against the
# synthetic ferrofed.eehrxf.medication.v1 template, to the profile the
# patient summary crosswalk admits for its section. Every value is synthetic.
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrofed_eu_medication_order.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: "http://hl7.eu/fhir/eps/StructureDefinition/MedicationStatement-eu-eps"
  template:
    id: "ferrofed.eehrxf.medication.v1"
  archetypes:
    - "ferrofed_medication_order"
  start: "ferrofed_medication_order"
