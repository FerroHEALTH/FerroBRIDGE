[package]
name = "eehrxf"
description = "The European interoperability software component of an EHR system under Regulation (EU) 2025/327: the format-neutral dataset model of the priority categories read from the Xt-EHR EHDS logical models, and the European electronic health record exchange format in FHIR R4, mapped from openEHR by FHIRconnect"
# On the crate line, the fhir-types line, since it moved here from FerroFED at
# 0.0.40 (docs/VERSIONS.md).
version = "0.1.130"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/eehrxf"
readme = "README.md"
keywords = ["ehds", "eehrxf", "fhir", "openehr", "health"]
categories = ["science"]
# The crate line is published on crates.io; include is the packaged content.
publish = true
include = ["src/**", "README.md", "LICENSE"]

# One crate for the interoperability component the Regulation defines, with one
# feature per priority category and one per serialisation (no specification
# governs this: our own design). The crate depends on no gateway and on no
# logging component, so the two harmonised components stay independent of
# each other.
[features]
# Article 14(1)(a), patient summaries.
patient-summary = []
# Article 14(1)(b), electronic prescriptions.
prescription = []
# Article 14(1)(c), electronic dispensations.
dispensation = []
# Article 14(1)(d), medical imaging studies and related imaging reports.
imaging = []
# Article 14(1)(e), medical test results, including laboratory results.
laboratory = []
# Article 14(1)(f), discharge reports.
discharge = []
# The exchange format in FHIR R4: the R4 resources the serialisation writes,
# with no openEHR crate, so the dataset and serialisation layers stay
# openEHR-free.
fhir-r4 = [
  "dep:async-trait",
  "dep:ferrobridge-term",
  "dep:ferrobridge-validator",
  "dep:fhir-types",
  "dep:http",
  "fhir-types/r4",
  "fhir-types/resources",
]
# The mapping between openEHR compositions and the FHIR R4 exchange format, run
# in process by the FHIRconnect 1.0.0 engine, which reads and writes R4 alone,
# with the RM model a received document is kept in.
openehr = [
  "fhir-r4",
  "dep:fhirconnect",
  "dep:openehr-base",
  "dep:openehr-its",
  "dep:openehr-mapping-core",
  "dep:openehr-rm",
  "dep:url",
]

[dependencies]
# The terminology server seam, an object-safe async trait the system that
# reaches the server implements.
async-trait = { workspace = true, optional = true }
fhir-types = { workspace = true, optional = true }
# The question a pending binding check of the validator asks, answered
# through the terminology seam.
ferrobridge-term = { workspace = true, optional = true }
# The FHIR R4 profile validator of this workspace, which holds a received
# document to every constraint of its profiles and of the profiles its
# entries claim.
ferrobridge-validator = { workspace = true, optional = true }
# The status a terminology server answered with, carried by every refusal.
http = { workspace = true, optional = true }
fhirconnect = { workspace = true, optional = true }
flate2.workspace = true
# The `local` terminology id, and the archetype id a local code is read in.
openehr-base = { workspace = true, optional = true }
# The OPT 1.4 model whose term definitions render an archetype-local code.
openehr-its = { workspace = true, optional = true, features = ["opt14"] }
openehr-mapping-core = { workspace = true, optional = true }
openehr-rm = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tar.workspace = true
thiserror.workspace = true
# Whether an openEHR terminology id is itself an absolute URI, and so its own
# FHIR system.
url = { workspace = true, optional = true }

[dev-dependencies]
# The property that a package read twice gives the same model, over shuffled
# archive orders.
proptest.workspace = true
# The runtime the terminology rules are awaited on in the tests.
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
