[package]
name = "fhir-search"
description = "The FHIR R4 search value grammar: the escaped value list, tokens, string matching and dates with their prefixes and ranges"
# The crate line is the fhir-types line (docs/VERSIONS.md).
version = "0.1.131"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/fhir-search"
readme = "README.md"
keywords = ["fhir", "hl7", "healthcare", "search"]
categories = ["parser-implementations", "science"]
# The crate line is published on crates.io; include is the packaged content.
publish = true
include = ["src/**", "README.md", "LICENSE"]

# scripts/checks/public-surface.sh: a line move of one takes the next minor.
[package.metadata.ferrohealth]
public-dependencies = ["jiff"]

[features]
# The instants a date's range holds and the calendar day it starts on, as jiff
# types. A consumer that reads tokens and escapes alone turns it off and
# compiles no time library; the grammar, the calendar check and the range
# need none (no specification governs this: our own design).
default = ["jiff"]
jiff = ["dep:jiff"]

[dependencies]
jiff = { workspace = true, optional = true }
thiserror.workspace = true
# The combining characters the default string match ignores.
unicode-normalization.workspace = true

[dev-dependencies]
jiff.workspace = true
proptest.workspace = true

[lints]
workspace = true
