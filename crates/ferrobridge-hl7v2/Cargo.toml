[package]
name = "ferrobridge-hl7v2"
description = "The FerroBRIDGE HL7 v2 face: MLLP framing, MSH-18 decoding, positional parsing over the generated v2 tables, the acknowledgment, and the v2-to-FHIR ConceptMap interpreter"
# The crate line is the fhir-types line (docs/VERSIONS.md).
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/ferrobridge-hl7v2"
readme = "README.md"
keywords = ["hl7", "hl7v2", "mllp", "fhir", "healthcare"]
categories = ["parser-implementations", "network-programming", "science"]
# The crate line is published on crates.io; include is the packaged content.
# The v2-to-FHIR corpus is read from a directory at run time and never packaged;
# the crate's own supplements under supplements/ are compiled in and packaged.
# The patterns are anchored at the root, so the LICENSE and README.md files of
# the HL7 v2 message sets under vendor/ stay out of the package too.
publish = true
include = [
    "/src/**",
    "/supplements/**",
    "/vendor/hl7.fhir.uv.v2mappings/PROVENANCE.md",
    "/vendor/hl7.fhir.uv.v2mappings/repository/LICENSE",
    "/vendor/hl7.fhir.uv.v2mappings/package/ConceptMap-*.json",
    "/README.md",
    "/LICENSE",
]

[features]
# The v2-to-FHIR mapping (`map`), on by default with the terminology server
# translator. `map` alone translates offline from the corpus, over fhir-types,
# fhirconnect's FHIR path model and ferrobridge-term's request and outcome
# types, with no openEHR crate and no HTTP client. A consumer that takes only
# the listener, the decoder, the parser and the acknowledgment turns every
# feature off.
default = ["map", "terminology-server"]
map = [
    "dep:chumsky",
    "dep:fhirconnect",
    "dep:fhir-types",
    "dep:ferrobridge-term",
    "dep:logos",
    "dep:serde_json",
    "dep:sha2",
    "dep:uuid",
]
# The v2-to-FHIR guide's ConceptMaps compiled in (`Corpus::shipped`), about
# 3.9 MB of JSON, so a consumer maps with no package on disk.
shipped-maps = ["map"]
# `Translator::Server`: table values translated by `ConceptMap/$translate` on
# a terminology server, through ferrobridge-term's HTTP client.
terminology-server = ["map", "ferrobridge-term/client"]

[dependencies]
bytes.workspace = true
# The parser of the condition and target grammars, over the logos tokens.
chumsky = { workspace = true, optional = true }
encoding_rs.workspace = true
logos = { workspace = true, optional = true }
# The FHIR writer: the path model over the fhir-types element table.
fhirconnect = { workspace = true, optional = true }
# The R4 model the ConceptMaps decode into and the output is checked against.
fhir-types = { workspace = true, features = ["r4-resources"], optional = true }
# R4, the release the guide's ConceptMaps are written in; the binary that
# configures the client adds any other release it speaks.
ferrobridge-term = { workspace = true, optional = true, features = ["r4"] }
hl7v2-types.workspace = true
# MLLP over TLS with client certificates (`mllp::tls`).
rustls.workspace = true
rustls-webpki.workspace = true
serde_json = { workspace = true, optional = true }
# The digest a created resource's urn:uuid is derived from.
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt", "sync", "macros", "time"] }
tokio-util.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
uuid = { workspace = true, optional = true }

[dev-dependencies]
# The suites also drive an STU3 terminology server.
ferrobridge-term = { workspace = true, features = ["client", "stu3", "r4"] }
ferrobridge-testkit.workspace = true
# The R4 core definitions a mapped resource is validated against.
ferrobridge-validator.workspace = true
insta.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util", "test-util"] }
url.workspace = true
wiremock.workspace = true

# The integration tests run the map against a stub terminology server.
[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["terminology-server"]

[lints]
workspace = true
