[package]
name = "ferrobridge-term"
description = "The FerroBRIDGE FHIR terminology client for $lookup, $translate and $validate-code"
# The crate line is the fhir-types line (docs/VERSIONS.md).
version = "0.1.129"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/ferrobridge-term"
readme = "README.md"
keywords = ["fhir", "terminology", "client", "healthcare"]
categories = ["web-programming::http-client", "science"]
# The crate line is published on crates.io; include is the packaged content.
publish = true
include = ["src/**", "README.md", "LICENSE"]

[dependencies]
async-trait.workspace = true
backon.workspace = true
# The three wire versions the client speaks, with the terminology root set that
# carries Parameters, OperationOutcome, Bundle and the operation contracts.
fhir-types = { workspace = true, features = ["stu3", "r4", "r4b", "terminology"] }
http.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
ferrobridge-testkit.workspace = true
http.workspace = true
secrecy.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
wiremock.workspace = true

[lints]
workspace = true
