[package]
name = "ferrobridge-term"
description = "The FerroBRIDGE FHIR terminology client for $lookup, $translate, $validate-code, $expand and $subsumes"
# The crate line is the fhir-types line (docs/VERSIONS.md).
version = "0.1.137"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/ferrobridge-term"
readme = "README.md"
keywords = ["fhir", "terminology", "client", "healthcare"]
categories = ["web-programming::http-client", "science"]
# The crate line is published on crates.io; include is the packaged content.
publish = true
include = ["src/**", "README.md", "LICENSE"]

[features]
# The client credentials token of ferrohealth-smart as the client's
# TokenProvider (`smart`), so a product writes no adapter of its own.
smart = ["dep:ferrohealth-smart"]

[dependencies]
async-trait.workspace = true
ferrohealth-smart = { workspace = true, optional = true }
backon.workspace = true
# The three wire versions the client speaks, with the terminology root set that
# carries Parameters, OperationOutcome, Bundle and the operation contracts.
fhir-types = { workspace = true, features = ["stu3", "r4", "r4b", "terminology"] }
http.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
ferrobridge-testkit.workspace = true
ferrohealth-smart.workspace = true
http.workspace = true
secrecy.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util"] }
wiremock.workspace = true
# The mutual-TLS stub a caller-built client is tested against (#1180).
rcgen.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true

[lints]
workspace = true
