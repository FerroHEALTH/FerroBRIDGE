[package]
name = "ferrobridge-operator-api"
description = "The documents of the FerroBRIDGE health and operator surfaces, as serde types the bridge and its console share"
# 0.0.0 reserves the name on crates.io; the crate line is the fhir-types line (docs/VERSIONS.md).
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/ferrobridge-operator-api"
readme = "README.md"
keywords = ["openehr", "fhir", "omop", "operator", "api"]
categories = ["web-programming", "data-structures"]
# The crate line is published on crates.io; include is the packaged content.
publish = true
include = ["src/**", "README.md", "LICENSE"]

[dependencies]
# The diagnostic every document carries, in its own serde form.
openehr-mapping-core.workspace = true
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
