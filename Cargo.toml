[workspace]
resolver = "3"
members = ["crates/*", "app/*", "tools/*"]
# The fuzz crate needs a nightly toolchain for cargo-fuzz and stays outside the
# workspace; .github/workflows/fuzz.yml builds it on its own (#155).
exclude = ["fuzz"]

[workspace.package]
version = "0.0.22"
edition = "2024"
rust-version = "1.98"
license = "BUSL-1.1"
repository = "https://github.com/FerroHEALTH/FerroBRIDGE"
homepage = "https://ferrobridge.eu"
authors = ["Ruben Talstra"]
# The server and the tools are never published; the crates/* members set
# publish = true and carry the crate line (docs/architecture.md section 7).
publish = false

# The authoritative third-party set. A crate takes a dependency with
# dep.workspace = true, and every version is checked against crates.io on the
# day it is added (.claude/rules/reliability.md).
[workspace.dependencies]
# Serialization and the wire formats the FHIR codegen reads and writes.
quick-xml = "0.42.0"
# The OMOP CDM definitions are two CSV files with quoted, multi-line fields.
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
# The maintained serde YAML: anchors, aliases, merge keys and source spans.
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
# draft-07 JSON Schema validation for the FHIRconnect mapping schemas. Both
# schemas are self-contained, so no remote or file reference resolver is built.
jsonschema = { version = "0.60.0", default-features = false }
thiserror = "2.0.21"
# The exact decimal the OMOCL `multiplication` product and every DV_QUANTITY
# magnitude are carried in, so no factor passes through a float.
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }
# The lexical form of each FHIR primitive: the generated codec compiles the
# `regex` extension of the primitive's value element and checks a decoded value
# against it, and the generator compiles every form it writes.
regex = "1.13.1"
# The openEHR RM model and the BASE path parser: the code conforms to RM
# Release 1.1.0 and compiles against the `v1_2` generation (docs/VERSIONS.md).
openehr-rm = "0.0.135"
# The BASE identification types the RM leaves to it: TERMINOLOGY_ID is a
# CODE_PHRASE field, so a lens that builds one names this crate.
openehr-base = "0.0.135"
# anyhow is a binary-only error type (.claude/rules/rust-style.md).
anyhow = "1.0.104"
# The forwarder ratchet parses the hand-written Rust (tools/forwarders).
syn = { version = "3.0.6", default-features = false, features = ["full", "parsing", "printing"] }
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
quote = { version = "1.0.47", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
tempfile = "3.27.0"
# Test-only.
insta = { version = "1.48.0", features = ["json"] }
proptest = "1.11.0"
# The digest behind the derived FHIR resource id (docs/architecture.md
# section 9) and the testkit's own checksums.
sha2 = "0.11.0"
# The testkit's closed port: a socket bound without a listen, which std cannot
# make (already in the lock through tokio).
socket2 = "0.6.5"
# Published from this workspace, so the requirement carries both a path and a
# version: cargo resolves the path locally and the version on crates.io.
fhir-types = { path = "crates/fhir-types", version = "=0.1.128", default-features = false }
hl7v2-types = { path = "crates/hl7v2-types", version = "=0.1.127" }
openehr-mapping-core = { path = "crates/openehr-mapping-core", version = "=0.1.149" }
# The health and operator documents the server writes and the console reads.
ferrobridge-operator-api = { path = "crates/ferrobridge-operator-api", version = "=0.0.0" }
# The OMOP CDM layer, taken metadata-only by default: a consumer that writes
# to a CDM database turns on its `database` feature.
omop-cdm = { path = "crates/omop-cdm", version = "=0.0.0", default-features = false }
# Path-only, with no version: cargo strips the dev-dependency from a packaged
# crates/* manifest instead of looking it up on crates.io.
ferrobridge-testkit = { path = "tools/ferrobridge-testkit" }
# The generated-tree writer and drift check both generators share (#1417).
generated-tree = { path = "tools/generated-tree" }
# Published from this workspace and consumed by the published
# ferrobridge-hl7v2, so the requirement carries both a path and a version.
# Each member names the FHIR releases it compiles the client for (#1737).
ferrobridge-term = { path = "crates/ferrobridge-term", version = "=0.1.151", default-features = false }
# Published from this workspace and consumed by the published
# ferrobridge-validator, so the requirement carries both a path and a version.
ferrobridge-fhirpath = { path = "crates/ferrobridge-fhirpath", version = "=0.1.133" }
# Published from this workspace and consumed by the published eehrxf, so the
# requirement carries both a path and a version.
ferrobridge-validator = { path = "crates/ferrobridge-validator", version = "=0.1.157" }
# The FHIR R4 search value grammar, published from this workspace for the
# facade and the family's FHIR servers, so the requirement carries both a path
# and a version.
fhir-search = { path = "crates/fhir-search", version = "=0.1.129" }
# The HL7 v2 face's crate (MLLP, MSH-18 decoding, parsing, the ACK and the
# v2-to-FHIR ConceptMap interpreter): published from this workspace, so the
# requirement carries both a path and a version.
ferrobridge-hl7v2 = { path = "crates/ferrobridge-hl7v2", version = "=0.1.211" }
# The FHIRconnect language crate: the facade, the operations surface and the
# published ferrobridge-hl7v2 consume it, so the requirement carries both a
# path and a version. Its `mapping` feature is off here: each consumer of the
# language names it, and ferrobridge-hl7v2 takes the FHIR path model alone.
fhirconnect = { path = "crates/fhirconnect", version = "=0.1.245", default-features = false }
# The OMOCL language crate: the ETL runner is its one in-process consumer, so
# the requirement is path-only too.
omocl = { path = "crates/omocl" }
# The openEHR model, from the published crates (docs/architecture.md section 3).
# openehr-its is the ITS wire layer: the OPT 1.4 reader (`opt14`) and canonical
# JSON (`json`) for every member, so the mapping core and the operator contract
# above it take no transport (#1257). The server adds the generated ITS-REST 1.1.0 transport DTOs
# (`rest`) and the generated client over its runtime (`rest-client`) in its own
# manifest; the alternative is a hand-written copy of a generated model, which
# .claude/rules/codegen.md forbids. From 0.0.69 the Simplified Data Template
# engines (FLAT, STRUCTURED, Web Template, TDD, RM-instance validation) live in
# openehr-sdt, taken without its `cache` feature (`moka`).
openehr-its = { version = "0.0.135", default-features = false, features = ["opt14", "json"] }
openehr-sdt = { version = "0.0.135", default-features = false, features = ["flat"] }
openehr-am = "0.0.135"
# The AQL 1.1.0 parser: the ETL checks its configured queries at load
# (docs/architecture.md section 5.4).
openehr-query = "0.0.135"
# The ADL 2 parser: openehr-mapping-core compiles its ADL 2 test fixtures from
# their .adls sources with it, and the server reads the archetype HRID an adl2
# template ETag carries with its `hrid::parse_hrid`.
openehr-adl = "0.0.135"
# The openEHR terminology: the `audit_change_type` and
# `version_lifecycle_state` concepts a commit codes (`codes`).
openehr-term = "0.0.135"
# The HTTP client for the CDR wire. reqwest 0.13 spells the rustls selection
# "rustls"; it carries its own platform verifier and aws-lc-rs provider.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2"] }
backon = "1.6.0"
# The FerroHEALTH family's SMART App Launch and OAuth 2.0 resource-server
# crate: the token check of the facade and the operator API, the scopes, the
# audit line, and the client credentials token of the CDR and terminology
# lanes, and the RFC 7662 introspection check of an `[[auth.issuer]]` with `mode =
# "introspection"`. A caret requirement, as a shared crate takes another (owner
# decision, 2026-10-26), with 0.13.0 as the floor: it classifies every caller by
# its issuer's `kind`, holds a Basic credential to a person, carries the
# onward grants (RFC 8693, RFC 7523) the facade reaches the CDR under its
# caller with, and reads a Keycloak 26.8 impersonation as issued. `fetch`
# reads each issuer's metadata and key set and runs the client credentials
# token client, the onward client and the introspector.
# The server adds `axum` for its guard;
# ferrobridge-term's `smart` feature takes the token client alone.
ferrohealth-smart = { version = "0.13.0", default-features = false, features = ["fetch"] }
# The family's one secret mask (FerroSYS): `Secret`, `SecretUrl` and the
# `<key>_file` reader, so a secret renders as `***` and a URL's userinfo and
# query masked. Pinned exactly, as a product pins every shared crate.
ferrohealth-secret = "=0.2.0"
# The family's configuration loader (FerroSYS): the file, the `FERROBRIDGE__`
# environment and its aliases, `--set`, strict with the closest known key, the
# provenance of every key and the `config check` rendering.
ferrohealth-config = "=0.2.10"
# The family's health document, indicator registry and process lifecycle
# (FerroSYS). The default build is the document alone, which the operator
# console reads; the server takes `registry`.
ferrohealth-health = { version = "=0.1.1", default-features = false }
# The family's server plumbing (FerroSYS): the `[server]` section, the stack
# around the routes (request id, panic catch, timeout, body limit, overload
# bound, compression, the health routes), the listener, the bounded drain, the
# healthcheck, the `serve`, `config check` and `healthcheck` subcommands, and
# the RFC 9457 problem details of every non-FHIR error body.
ferrohealth-server = { version = "=0.5.1", default-features = false }
# The family's telemetry (FerroSYS): the `[telemetry]` section, the console,
# the request log and the panic line.
ferrohealth-telemetry = { version = "=0.2.5", default-features = false }
# The family's installation report to FerroPULSE (FerroSYS): envelope v2, the
# latency window the request log fills and the start and daily reporter.
ferrohealth-usage-report = { version = "=0.2.1", default-features = false }
# The family's audit crates (FerroAUDIT): `ehds-logging` builds the EHDS access
# record of Regulation (EU) 2025/327 Annex II 3.2 and its BALP `AuditEvent`
# (`balp`), and `ihe-atna` spools it and sends it over the ITI-20 ATX: FHIR
# Feed (`balp`) with a client credentials bearer (`smart`, on the 0.13 line of
# ferrohealth-smart). Pinned exactly, as a product pins every shared crate;
# only the server links them.
ehds-logging = { version = "=0.8.0", default-features = false }
ihe-atna = { version = "=0.8.0", default-features = false }
# The test-time signing of the inbound token cases (RFC 7515, RFC 7519) over
# the aws-lc-rs provider reqwest and rustls already carry; the RustCrypto
# backend stays off.
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
# The test-time key pairs the inbound token tests sign with, in the lock
# already through rustls; 1.18.1 is the version the lock carries.
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["aws-lc-sys"] }
# The test-time Argon2id hash of the synthetic password an inbound Basic case
# authenticates with, in the lock already through ferrohealth-smart; 0.6.0 is
# the version the lock carries.
argon2 = { version = "0.6.0", default-features = false, features = ["password-hash", "alloc"] }
# The openehr-its client runtime's Transport is an async-trait trait, so the
# server's per-call engine implements it through the same macro, as does the
# token provider of ferrobridge-term's OAuth credentials.
async-trait = "0.1.92"
# The embedded identity store of the FHIR facade (docs/architecture.md
# section 9).
redb = "4.3.0"
# The bridge's own timestamps: the one instant an ingest defaults every
# composition field from (docs/architecture.md section 7). UTC only, so the
# platform time-zone database features stay off.
jiff = { version = "0.2.37", default-features = false, features = ["std"] }
# The canonical decomposition fhir-search folds a string value with before the
# default and the :contains match compare it.
unicode-normalization = "0.1.26"
url = "2.5.8"
http = "1.5.0"
# The `serde` feature reads a configured secret straight into a `SecretString`.
secrecy = { version = "0.10.3", features = ["serde"] }
tracing = "0.1.44"
# The server's console: the env filter, the JSON line format and the pretty one.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "env-filter", "json", "ansi"] }
# The server's HTTP stack and the middleware the binary shape needs.
axum = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.7.1", default-features = false, features = ["trace", "catch-panic", "request-id", "timeout", "limit"] }
# The configuration file format, parsed into the server's Config tree.
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "display", "serde"] }
# The minted request id when a client sends none or sends an illegal one.
uuid = { version = "1.26.1", default-features = false, features = ["v4", "std"] }
futures-core = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
tokio = { version = "1.53.1", default-features = false }
# The MLLP frame codec of the HL7 v2 face, over the tokio-util and bytes the
# lock already carries through axum and reqwest.
tokio-util = { version = "0.7.19", default-features = false, features = ["codec"] }
bytes = "1.12.1"
# The MSH-18 character sets of the HL7 v2 face, in the lock already through
# serde-saphyr.
encoding_rs = "0.8.42"
# The lexer and parser of the v2-to-FHIR condition and target grammars, the
# pair openehr-query builds its AQL parser on and the lock already carries.
logos = "0.16.1"
chumsky = "0.13.0"
# The `.tgz` form of a FHIR package the profile validator reads offline
# (https://hl7.org/fhir/packages.html): flate2 on its pure-Rust backend and tar
# without its extended-attribute feature, which reads nothing a package
# carries. FerroFED reads its packages with the same pair.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4.46", default-features = false }
# The line diff of a mapping-set revision against the running one, as the
# operator API answers it (#609). Apache-2.0.
similar = { version = "3.2.1", default-features = false, features = ["std", "text"] }
# The mapping-set archive the operator API exports and imports (#610): a ZIP
# written with fixed timestamps in sorted order, read with a ceiling. MIT.
zip = { version = "=9.1.3", default-features = false, features = ["deflate-flate2"] }
# The FerroHEALTH components the operator console (app/ferrobridge-console,
# #599) draws with: the server-rendered views, the shell, the table model, the
# highlighter, the Lucide icons, the stylesheet, the role tokens and the script
# modules with the router that serves them, shared by every FerroHEALTH
# console. Pinned exactly, so the console moves to a new version deliberately.
ferrohealth-ui = "=0.6.8"
# The console's string catalogs (#956): Project Fluent messages embedded at
# build time from app/ferrobridge-console/locales/, the crate and version
# ferrohealth-ui catalogs its own words with, so one locale drives both.
fluent-templates = { version = "0.15.1", default-features = false, features = ["macros", "walkdir"] }
# The base64 encoding the workspace crates and the testkit read and write.
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
# The operator console's OpenID Connect sign-in and its session (#1434), the
# family's one crate for both (FerroAUTH): the authorization code flow with
# PKCE over ferrohealth-smart, the `[oidc]` and `[session]` sections, the store
# with its idle and absolute lifetimes, the refresh, and the four routes with
# the session watch FerroUI's pages ask. Pinned exactly, as a product pins
# every shared crate; the console adds `axum`.
ferrohealth-session = { version = "=0.7.0", default-features = false }
# Test-only.
wiremock = "0.6.5"
# The operator console's browser journeys (#602): a WebDriver client in Rust
# over chromedriver, with the Chrome DevTools Protocol for the screenshots'
# window size and colour scheme, and the process-group kill that stops a
# journey's chromedriver with every Chrome it started. FerroFED drives its
# console with the same pair. thirtyfour carries the RUSTSEC-2026-0381 fix
# from 0.38.1 on.
thirtyfour = { version = "0.38.1", default-features = false, features = ["reqwest", "cdp"] }
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }
# The screenshot capture's pixel comparison, which keeps an image on disk when
# a new capture differs from it only by the antialiasing of a form control.
# MIT OR Apache-2.0.
png = "0.18.1"
# The AMQP 0.9.1 client of the events lane (#1367): publisher confirms over
# tokio, TLS through rustls with the aws-lc-rs provider and the webpki roots
# the CDM writer already carries. The version the reference CDR pinned before
# it handed broker delivery to the bridge. MIT.
lapin = { version = "4.12.3", default-features = false, features = ["tokio", "rustls--aws_lc_rs", "rustls-webpki-roots-certs"] }
# The end-to-end lane's container harness and the PostgreSQL client the CDM
# catalogue is read with (docs/VERSIONS.md).
testcontainers = "0.28.0"
tokio-postgres = "0.7.18"
# The CDM writer's TLS: the tokio-postgres connector over rustls with the
# aws-lc-rs provider reqwest and sqlx already carry, and the webpki root set
# sqlx trusts when no CA file is configured.
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["aws-lc-rs"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
webpki-roots = "1.0.9"
# Test-only for ferrobridge-term (#1180): a mutual-TLS terminology stub, its
# synthetic CA, server and client certificates generated at run time and never
# committed, served over tokio-rustls at the version the lock already carries.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio-rustls = { version = "0.26.5", default-features = false }
# The X.509 subject check of the MLLP face's client certificates, the
# rustls-webpki rustls itself verifies the path with.
rustls-webpki = { version = "0.103.16", default-features = false, features = ["std", "aws-lc-rs"] }
# The concept resolver's SQL over the loaded OHDSI vocabulary, checked at
# compile time against the vendored DDL through the committed `.sqlx/` query
# metadata (docs/architecture.md section 5.3). The rustls provider is
# aws-lc-rs, the one reqwest carries.
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "macros"] }

# The reliability bar (.claude/rules/reliability.md). Groups sit at priority -1
# so every named lint below overrides its group.
[workspace.lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
dead_code = "deny"
let_underscore_drop = "deny"
non_local_definitions = "deny"
unexpected_cfgs = "deny"
unsafe_op_in_unsafe_fn = "deny"
ffi_unwind_calls = "deny"
deprecated_safe_2024 = "deny"
ambiguous_negative_literals = "deny"
unused_must_use = "deny"
macro_use_extern_crate = "warn"
absolute_paths_not_starting_with_crate = "warn"
unit_bindings = "warn"
meta_variable_misuse = "warn"
explicit_outlives_requirements = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "warn"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
invalid_html_tags = "deny"
bare_urls = "deny"
redundant_explicit_links = "deny"
unescaped_backticks = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Panics are for states that cannot happen; everything else is a Result.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
panic_in_result_fn = "deny"
missing_assert_message = "deny"
indexing_slicing = "deny"
string_slice = "deny"
# Numeric honesty: no silent narrowing, wrapping, or lossy literals.
as_conversions = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
as_underscore = "deny"
fn_to_numeric_cast_any = "deny"
precedence_bits = "deny"
suspicious_xor_used_as_pow = "deny"
integer_division = "warn"
unchecked_time_subtraction = "deny"
# Guards, results, and causes are never dropped on the floor.
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
unused_result_ok = "deny"
map_err_ignore = "warn"
# Determinism: hash iteration order feeds nothing that must be stable.
iter_over_hash_type = "deny"
# Libraries speak tracing; only binaries write to stdio, and nothing exits.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
# Suppressions are scoped, justified, and self-reporting.
allow_attributes_without_reason = "deny"
allow_attributes = "warn"
# Documentation and comment shape (RFC 505 and RFC 1574).
too_long_first_doc_paragraph = "warn"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# The RFC 3107 shape: derive Default when the default is a variant.
derivable_impls = "deny"
# API hygiene: no re-exports, no pointer leakage, the right std call.
pub_use = "deny"
incompatible_msrv = "deny"
verbose_file_reads = "deny"
filetype_is_file = "deny"
create_dir = "deny"
large_include_file = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
mem_forget = "deny"
pointer_format = "deny"
empty_drop = "warn"
deref_by_slicing = "warn"

# A clean 500 relies on catch_unwind, which only catches unwinding panics, and
# tests ignore the panic setting, so abort would be untestable
# (https://doc.rust-lang.org/cargo/reference/profiles.html#panic).
# `ihe-atna` writes its BALP `AuditEvent` through the published `fhir-types`,
# which this workspace builds from source: one model, so the spool's record
# check and the facade's resources are one crate.
[patch.crates-io]
fhir-types = { path = "crates/fhir-types" }

[profile.release]
panic = "unwind"
overflow-checks = true
debug = "line-tables-only"

# The full-emit tests of fhir-codegen (`cargo nextest run --cargo-profile emit
# -p fhir-codegen`): the emitter runs optimised, while the two generated crates
# its tests link stay unoptimised, as in a test build, because optimising them
# took 35 of the 47 minutes of that CI job and no full-emit test runs their
# code. No specification governs this: our own design.
[profile.emit]
inherits = "release"
debug = false

[profile.emit.package.fhir-types]
opt-level = 0

[profile.emit.package.hl7v2-types]
opt-level = 0

