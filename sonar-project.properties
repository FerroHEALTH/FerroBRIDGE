# SonarQube Cloud project configuration.
#
# Advisory analysis only: it never outranks the specifications, the project
# rules, or the local gates, and it gates no merge
# (.claude/rules/ai-code-review.md). The quality gate is the built-in
# "Sonar way" default.
#
# The analyzer reads the hand-written Rust and the multi-language sweep over
# shell, YAML, JSON, and markdown-adjacent config.

sonar.projectKey=FerroHEALTH_FerroBRIDGE
sonar.organization=ferrohealth
sonar.projectName=FerroBRIDGE
sonar.sourceEncoding=UTF-8

# Scope: analyze the tree, minus build output, any vendored input, and the
# generated trees (the FHIR model, the HL7 v2 tables, the OMOP CDM row types
# and the sqlx metadata). A vendored tree is bytes a publisher owns and a
# fetch script reproduces (.claude/rules/vendored-inputs.md), so a finding on
# one is noise nobody may act on in place. A generated tree is the emitter's
# output, so its correctness belongs to the generator rather than to hand
# review (.claude/rules/codegen.md); the paths are the ones .gitattributes marks
# linguist-generated. Left in, the two large ones cost the copy-paste detector
# ten minutes a scan for findings nobody may act on in place (#703).
sonar.sources=.
#
# SQL is excluded as a language. Every .sql file here is PostgreSQL (the
# OMOP CDM DDL the generator emits under crates/omop-cdm/ddl and the era
# scripts adapted from OHDSI under crates/omop-cdm/sql), and the analyzer
# reads .sql as Oracle PL/SQL, so its findings describe a dialect this tree
# does not use. PostgreSQL itself and the omop-cdm database tests own their
# correctness.
sonar.exclusions=**/target/**,**/vendor/**,docs/specs/**,**/node_modules/**,crates/fhir-types/src/**,crates/hl7v2-types/src/**,crates/omop-cdm/src/generated/**,crates/omop-cdm/.sqlx/**,**/*.sql,**/*.png,**/*.ico,**/*.jpg,**/*.jpeg,**/*.gif,**/*.webp,**/*.woff,**/*.woff2,**/*.tgz,**/*.gz,**/*.zip

# Rust coverage, imported from the instrumented nextest run that
# .github/workflows/sonar.yml writes over the packages a change reaches. A pull
# request that reaches none writes no file, which the scanner reports as a
# warning.
sonar.rust.lcov.reportPaths=lcov.info

# Coverage scope: the test code itself and the trees no instrumented test
# run executes stay out of the coverage denominator, and stay analyzed for
# findings and duplication. Test files are what produces the coverage;
# cargo-llvm-cov leaves tests/, benches/ and examples/ out of its report.
# fuzz/ is a separate workspace run by cargo-fuzz, never by the nextest run.
# scripts/, .claude/ and website/ hold shell, CSS and JavaScript, for which
# the workflow imports no coverage report.
sonar.coverage.exclusions=**/tests/**,**/benches/**,**/examples/**,fuzz/**,scripts/**,.claude/**,website/**

# sonar.projectVersion is appended by the workflow at scan time from the
# workspace version, never kept as a second hand-maintained copy here.
