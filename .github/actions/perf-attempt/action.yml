name: One attempt of the performance gate
description: >-
  Downloads the arms the perf workflow's build job packed (both release
  binaries, the base's commit and ferrohealth-perf), runs
  scripts/perf/gate.sh once over them and uploads its reports. The step
  never fails on the gate's verdict: it reports the exit code, the runner's
  CPU model and whether a retry on a fresh runner may help, and the perf
  workflow's verdict job decides. A retry may help when the gate ended with
  exit 2, a run that could not be judged, on any CPU model, or with exit 1,
  a breach, on a CPU model the workflow lists as stall-prone; the workflow
  also retries an attempt whose job ended cancelled because its runner shut
  down. Before the last attempt, a runner of a stall-prone model measures
  nothing and ends with exit 2 at once (#1778). The calling job checks out
  the repository with its whole history first. No specification governs
  this: our own design.
inputs:
  attempt:
    description: The attempt, 1 for the first run and 2 and 3 for the retries.
    required: true
  stall-prone:
    description: The CPU models whose runners stall the gate, one per line.
    required: true
outputs:
  code:
    description: The gate's exit code.
    value: ${{ steps.gate.outputs.code }}
  model:
    description: The runner's CPU model.
    value: ${{ steps.gate.outputs.model }}
  retryable:
    description: '"true" when a retry on a fresh runner may help.'
    value: ${{ steps.gate.outputs.retryable }}
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: perf-arms
        path: target
    - name: Unpack the arms
      shell: bash
      run: bash scripts/perf/gate.sh unpack target/perf-arms.tar
    - name: Gate the performance
      id: gate
      shell: bash
      env:
        ATTEMPT: ${{ inputs.attempt }}
        STALL_PRONE: ${{ inputs.stall-prone }}
      # The model is read as ferrohealth-perf reads it: the first `model name`
      # of /proc/cpuinfo, trimmed. On a stall-prone model 24 of 29 attempts
      # could not be judged (#1778), so only the last attempt measures there.
      run: |
        set -uo pipefail
        free -m | awk 'NR == 2 { printf "perf-gate: memory used %s of %s MB before measuring\n", $3, $2 }'
        model="$(awk '{ key = $0; sub(/[[:space:]]*:.*/, "", key) }
          key == "model name" { sub(/^[^:]*:[[:space:]]*/, ""); sub(/[[:space:]]+$/, ""); print; exit }' /proc/cpuinfo)"
        prone=false
        while IFS= read -r listed; do
          if [ -n "$listed" ] && [ "$listed" = "$model" ]; then prone=true; fi
        done <<< "$STALL_PRONE"
        code=0
        skipped=false
        if [ "$prone" = true ] && [ "$ATTEMPT" -lt 3 ]; then
          skipped=true
          code=2
        else
          PATH="$PWD/target/perf-tools:$PATH" bash scripts/perf/gate.sh run || code=$?
        fi
        retryable=false
        if [ "$code" = 2 ]; then
          retryable=true
        elif [ "$code" = 1 ] && [ "$prone" = true ]; then
          retryable=true
        fi
        case "$code" in
          0) verdict="passed" ;;
          1) verdict="failed (exit 1, a breach)" ;;
          2) verdict="could not be judged (exit 2)" ;;
          *) verdict="ended with exit $code" ;;
        esac
        if [ "$skipped" = true ]; then
          verdict="measured nothing (exit 2)"
          why="a retry runs on a fresh runner, since ${model} is listed as stall-prone and only the last attempt measures on it"
        elif [ "$retryable" = true ] && [ "$ATTEMPT" -ge 3 ]; then
          why="no attempt is left to retry it"
        elif [ "$retryable" = true ] && [ "$code" = 2 ]; then
          why="a retry runs on a fresh runner, since a run that could not be judged says nothing about the code"
        elif [ "$retryable" = true ]; then
          why="a retry runs on a fresh runner, since ${model} is listed as stall-prone"
        elif [ "$code" = 0 ]; then
          why="no retry is needed"
        elif [ "$code" = 1 ]; then
          why="no retry runs, since ${model:-an unnamed CPU} is not listed as stall-prone"
        else
          why="no retry runs after exit ${code}"
        fi
        {
          echo "## Performance gate, attempt ${ATTEMPT}"
          echo
          echo "On \`${model:-an unnamed CPU}\` the gate ${verdict}; ${why}."
          echo
        } >> "$GITHUB_STEP_SUMMARY"
        {
          echo "code=$code"
          echo "model=$model"
          echo "retryable=$retryable"
        } >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: perf-report-attempt-${{ inputs.attempt }}
        path: |
          target/perf/
          target/perf-run/*/server.log
        if-no-files-found: ignore
        retention-days: 30
