name: One attempt of the performance gate
description: >-
  Installs ferrohealth-perf, builds the release binary of the commit and of
  its base, runs scripts/perf/gate.sh once and uploads its reports. The step never fails on the gate's
  verdict: it reports the exit code, the runner's CPU model and whether a
  retry on a fresh runner may help, and the perf workflow's verdict job
  decides. A retry may help when the gate ended with exit 2, a run that
  could not be judged, on any CPU model, or with exit 1, a breach, on a CPU
  model the workflow lists as stall-prone; the workflow also retries an
  attempt whose job ended cancelled because its runner shut down. The calling job checks out
  the repository and installs the Rust toolchain first. No specification
  governs this: our own design.
inputs:
  attempt:
    description: The attempt, 1 for the first run and 2 and 3 for the retries.
    required: true
  base:
    description: The commit or ref the base is the merge base with; empty takes the previous release.
    required: false
    default: ""
  version:
    description: The ferrohealth-perf version to install, exactly.
    required: true
  stall-prone:
    description: The CPU models whose runners stall the gate, one per line.
    required: true
outputs:
  code:
    description: The gate's exit code.
    value: ${{ steps.gate.outputs.code }}
  model:
    description: The runner's CPU model.
    value: ${{ steps.gate.outputs.model }}
  retryable:
    description: '"true" when a retry on a fresh runner may help.'
    value: ${{ steps.gate.outputs.retryable }}
runs:
  using: composite
  steps:
    - name: Install ferrohealth-perf
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: cargo install ferrohealth-perf --version "=${VERSION}" --locked
    - name: Build the base and the head
      shell: bash
      env:
        BASE: ${{ inputs.base }}
      # A release build of fhir-types with every resource of all five FHIR
      # releases, which main compiled from #1717 until #1737, peaks above the
      # runner's 16 GB on its own (#1737), so a swap file backs the build and
      # is turned off again before anything is measured; the binaries are the
      # same. The memory, swap and disk are logged each minute, so a runner
      # that shuts down mid-build leaves the last reading in its log.
      run: |
        set -euo pipefail
        swap=/perf-build.swap
        sudo fallocate -l 20G "$swap"
        sudo chmod 600 "$swap"
        sudo mkswap "$swap" > /dev/null
        sudo swapon "$swap"
        sample() {
          while true; do
            free -m | awk 'NR == 2 { printf "perf-gate: memory used %s of %s MB, ", $3, $2 }
              NR == 3 { printf "swap used %s of %s MB, ", $3, $2 }'
            df -m . | awk 'NR == 2 { printf "disk free %s MB\n", $4 }'
            sleep 60
          done
        }
        sample &
        sampler=$!
        trap 'kill "$sampler" 2> /dev/null || true; sudo swapoff "$swap" || true; sudo rm -f "$swap"' EXIT
        bash scripts/perf/gate.sh build "$BASE"
    - name: Gate the performance
      id: gate
      shell: bash
      env:
        ATTEMPT: ${{ inputs.attempt }}
        STALL_PRONE: ${{ inputs.stall-prone }}
      run: |
        set -uo pipefail
        code=0
        bash scripts/perf/gate.sh run || code=$?
        latest="$(find target/perf -name latest.json -not -path '*busy-loop*' -print -quit 2>/dev/null || true)"
        model=""
        if [ -n "$latest" ]; then
          model="$(jq -r '.host.cpu_model // ""' "$latest")"
        fi
        prone=false
        while IFS= read -r listed; do
          if [ -n "$listed" ] && [ "$listed" = "$model" ]; then prone=true; fi
        done <<< "$STALL_PRONE"
        retryable=false
        if [ "$code" = 2 ]; then
          retryable=true
        elif [ "$code" = 1 ] && [ "$prone" = true ]; then
          retryable=true
        fi
        case "$code" in
          0) verdict="passed" ;;
          1) verdict="failed (exit 1, a breach)" ;;
          2) verdict="could not be judged (exit 2)" ;;
          *) verdict="ended with exit $code" ;;
        esac
        if [ "$retryable" = true ] && [ "$ATTEMPT" -ge 3 ]; then
          why="no attempt is left to retry it"
        elif [ "$retryable" = true ] && [ "$code" = 2 ]; then
          why="a retry runs on a fresh runner, since a run that could not be judged says nothing about the code"
        elif [ "$retryable" = true ]; then
          why="a retry runs on a fresh runner, since ${model} is listed as stall-prone"
        elif [ "$code" = 0 ]; then
          why="no retry is needed"
        elif [ "$code" = 1 ]; then
          why="no retry runs, since ${model:-an unnamed CPU} is not listed as stall-prone"
        else
          why="no retry runs after exit ${code}"
        fi
        {
          echo "## Performance gate, attempt ${ATTEMPT}"
          echo
          echo "On \`${model:-an unnamed CPU}\` the gate ${verdict}; ${why}."
          echo
        } >> "$GITHUB_STEP_SUMMARY"
        {
          echo "code=$code"
          echo "model=$model"
          echo "retryable=$retryable"
        } >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: perf-report-attempt-${{ inputs.attempt }}
        path: |
          target/perf/
          target/perf-run/*/server.log
        if-no-files-found: ignore
        retention-days: 30
