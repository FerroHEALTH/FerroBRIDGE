# The freshness half of the pin discipline (#35).
#
# scripts/checks/versions.sh catches drift between two files we control, and
# Dependabot bumps what its ecosystems read, which is `uses:` references and
# the manifests. Between the two sits a set of pins nothing watches: the
# actionlint and hadolint container images named inside a `run:` block, the
# analyzer versions handed to taiki-e/install-action as an input, the
# documentation toolchain the mermaid assets are vendored from, every corpus a
# vendor script fetches by commit, and every FHIR package pinned by version.
# This workflow reads the newest upstream release, branch head or registry
# `latest` of each and opens ONE issue when a pin is behind. Its `family` job
# reads every image another FerroHEALTH product publishes, pinned in
# docs/VERSIONS.md, against that product's latest release and image index
# digest, and opens one issue per image that fell behind.
#
# It opens an issue rather than failing on a stale pin: a weekly red job trains
# a maintainer to ignore red jobs (#41), and a newer lint release is not a
# broken build. A pin it could not read is named in the issue and fails the
# run after the issue is written, so it never hides a stale pin (#2007).
name: Pin freshness

on:
  schedule:
    # Monday morning, after the weekly Dependabot run, so both arrive together.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  freshness:
    name: pin freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare every unwatched pin with its newest upstream release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          status=0
          bash scripts/checks/pin-freshness.sh > freshness.txt || status=$?
          cat freshness.txt
          # 0 every pin current, 1 at least one behind, 2 a release could not
          # be read. The script reads every pin either way, so the STALE rows
          # decide the issue and the status only whether the job ends red.
          echo "stale=$(grep -q '^STALE' freshness.txt && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Open or update the issue when a pin is behind
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: A pinned CI tool is behind its newest upstream release
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "\`scripts/checks/pin-freshness.sh\` found a pin behind its newest upstream release."
            echo
            echo "Bump the pin in \`docs/VERSIONS.md\` and in the file that repeats it, keep the local"
            echo "install on the same number, and re-run the gates. The digest beside an image tag"
            echo "moves with the tag, so read the new digest from the registry rather than guessing it."
            echo "An UNREADABLE row is a pin whose newest release could not be read, so it is not known"
            echo "to be current."
            echo
            echo '```text'
            cat freshness.txt
            echo '```'
            echo
            echo "Reported by [this run]($RUN_URL)."
          } > body.md
          # --limit well past the open count: the default page is 30 issues,
          # and a report that scrolled off it would be opened a second time.
          number="$(gh issue list --state open --limit 500 --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
            echo "updated #$number"
          else
            # fields.sh files the issue as a Task at Low priority and Low
            # effort; this job's default token may not read the organisation's
            # issue types, and then the issue lands with its label alone and
            # whoever picks it up sets the three (.claude/rules/issue-workflow.md).
            bash scripts/gh/fields.sh new task low low \
              --title "$TITLE" --body-file body.md --label ci
          fi

      - name: Fail when the comparison is incomplete
        if: steps.check.outputs.status != '0' && steps.check.outputs.status != '1'
        env:
          STATUS: ${{ steps.check.outputs.status }}
        run: |
          # 2 means a release could not be read, and anything else a broken
          # script: the UNREADABLE rows above are not known to be current.
          echo "pin-freshness.sh exited $STATUS; the comparison is incomplete" >&2
          exit 1

  # The product images of the family, each against the latest release of the
  # product that publishes it. Its own job, so a tool pin that could not be
  # read never hides a product pin that fell behind. One issue per image, kept
  # open and rewritten while the pin stays behind, so each product release
  # reaches the tracker under its own title.
  family:
    name: product image pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare every product image pin with the product's latest release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          status=0
          bash scripts/checks/pin-freshness.sh --family > family.txt || status=$?
          cat family.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Open or update one issue per image behind its latest release
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.check.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          awk '$1 == "STALE" { image = $2; sub(/:$/, "", image); print image }' family.txt | sort -u > behind.txt
          while read -r image; do
            if ! [[ "$image" =~ ^ghcr\.io/ferrohealth/[a-z0-9-]+$ ]]; then
              echo "not a product image: $image" >&2
              exit 1
            fi
            title="Pin behind the product's latest release: $image"
            {
              echo "\`scripts/checks/pin-freshness.sh --family\` found \`$image\` pinned behind the latest release of the product that publishes it."
              echo
              echo '```text'
              grep -F "STALE      $image: " family.txt
              echo '```'
              echo
              echo "Read the configuration changes the line names, move the pin in \`docs/VERSIONS.md\` and in every file"
              echo "that repeats it to the release's tag and index digest, with the configuration that release reads,"
              echo "and re-run the gates."
              echo
              echo "Reported by [this run]($RUN_URL)."
            } > body.md
            number="$(gh issue list --state open --limit 500 --json number,title \
              --jq "[.[] | select(.title == \"$title\")][0].number // empty")"
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file body.md
              echo "updated #$number for $image"
            else
              # fields.sh files the issue as a Task at Medium priority and Low
              # effort; this job's default token may not read the
              # organisation's issue types, and then the issue lands with its
              # label alone (.claude/rules/issue-workflow.md).
              bash scripts/gh/fields.sh new task medium low \
                --title "$title" --body-file body.md --label chore
            fi
          done < behind.txt
          # 2 means an image or a release could not be read: the comparison is
          # incomplete, so the job fails after filing what it could compare.
          if [ "$STATUS" -eq 2 ]; then
            echo "an image or a release could not be read; the comparison is incomplete" >&2
            exit 1
          fi
