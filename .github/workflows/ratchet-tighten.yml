# Ratchet tighten (#1363). No specification governs this: our own design,
# the rule FerroEHR adopted for its ratchet guards (FerroHEALTH/FerroEHR#4554).
#
# The ratchet guards (scripts/checks/stray-literals.sh, duplication.sh and
# file-length.sh, #1359) fail a rise and pass a fall with a note, so a pull
# request that moves strings to the catalogs, removes duplication or splits a
# file touches none of the shared ratchet files and conflicts with no other
# open pull request. This lane does the tightening instead: once a day it
# runs each guard's --update on main and pushes one branch,
# chore/ratchet-tighten, that holds only the ratchet files, or moves an open
# pull request on it to the new counts. When nothing fell it does nothing.
#
# It never pushes to main. The commit is made through the Git Data REST API,
# so GitHub signs it and it shows Verified
# (docs.github.com/en/rest/git/commits, "Signature verification").
#
# THE HAND-OFF. GitHub Actions may not create pull requests in this
# repository, and the owner keeps it that way with no separate token
# (2026-11-02), so the lane ends with a notice once the branch is pushed and a
# maintainer opens the pull request from it (#1396).
name: Ratchet tighten

on:
  schedule:
    # Daily 04:53 UTC, off the hour and in a slot of its own; read the
    # slots with `grep -rE '^ +- cron:' .github/workflows/`.
    - cron: "53 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ratchet-tighten
  cancel-in-progress: false

jobs:
  tighten:
    name: tighten
    # The counts are main's; a dispatch from another branch would lower them
    # to that branch's tree.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the blob, tree, commit and branch ref
      pull-requests: read # find an open pull request on the lane's branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A rise on main is a failure for a person to look at, never a count
      # this lane writes down.
      - name: No ratchet has risen on main
        run: |
          set -euo pipefail
          bash scripts/checks/stray-literals.sh app/ferrobridge-console/src
          bash scripts/checks/duplication.sh
          bash scripts/checks/file-length.sh

      - name: Lower the counts
        id: update
        run: |
          set -euo pipefail
          count_before=$(git show HEAD:scripts/checks/duplication.count | awk '/^[[:space:]]*(#|$)/ { next } { print; exit }')
          bash scripts/checks/duplication.sh --update
          count_after=$(awk '/^[[:space:]]*(#|$)/ { next } { print; exit }' scripts/checks/duplication.count)
          # A block that moved and kept the count changes only its key, which
          # the check already tolerates; that alone is no reason for a PR.
          if [ "$count_before" = "$count_after" ]; then
            git checkout -- scripts/checks/duplication.count scripts/checks/duplication-baseline.txt
          fi
          bash scripts/checks/file-length.sh --update
          bash scripts/checks/stray-literals.sh --update app/ferrobridge-console/src

          git diff --name-only -- \
            scripts/checks/duplication.count scripts/checks/duplication-baseline.txt \
            scripts/checks/file-length-allow.txt scripts/checks/stray-literals.baseline >changed-files.txt
          other=$(git status --porcelain --untracked-files=no | awk '{ print $2 }' | grep -vxF -f changed-files.txt || true)
          if [ -n "$other" ]; then
            echo "$other"
            echo "::error::--update changed a file outside the ratchet files."
            exit 1
          fi
          if [ ! -s changed-files.txt ]; then
            echo "::notice::No ratchet fell. Nothing to do."
            echo "changed=0" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=1" >>"$GITHUB_OUTPUT"
          {
            echo "duplication_before=$count_before"
            echo "duplication_after=$count_after"
          } >>"$GITHUB_OUTPUT"
          {
            echo '### Ratchet files lowered'
            echo
            echo '```diff'
            git diff --stat
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Push or move the tightening branch
        if: steps.update.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.sha }}
          DUP_BEFORE: ${{ steps.update.outputs.duplication_before }}
          DUP_AFTER: ${{ steps.update.outputs.duplication_after }}
        run: |
          set -euo pipefail
          branch="chore/ratchet-tighten"

          # The parent is the commit the counts were measured on, so the
          # lowered counts hold for it; CI on the pull request measures them
          # again against main as it is at merge time.
          base_tree=$(gh api "repos/${REPO}/git/commits/${BASE_SHA}" --jq .tree.sha)
          tree_args=()
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            # The body goes through a file: a ratchet file's base64 content
            # passed as one argument can exceed the kernel's limit (#1396).
            base64 -w0 "$f" | jq -Rs '{encoding: "base64", content: .}' >blob.json
            blob=$(gh api "repos/${REPO}/git/blobs" --input blob.json --jq .sha)
            tree_args+=( -f "tree[][path]=$f" -f "tree[][mode]=100644" \
                         -f "tree[][type]=blob" -f "tree[][sha]=$blob" )
            echo "staged $f ($blob)"
          done <changed-files.txt
          tree=$(gh api "repos/${REPO}/git/trees" \
                   -f "base_tree=${base_tree}" "${tree_args[@]}" --jq .sha)
          commit=$(gh api "repos/${REPO}/git/commits" \
                     -f "message=chore(checks): lower the ratchet counts" \
                     -f "tree=${tree}" -f "parents[]=${BASE_SHA}" --jq .sha)

          # One pull request at a time: an open one moves to the new commit,
          # which is this lane's own branch and never main.
          open=$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh api -X PATCH "repos/${REPO}/git/refs/heads/${branch}" \
              -f "sha=${commit}" -F force=true --jq .ref
            echo "::notice::Moved #${open} to ${commit}."
            exit 0
          fi
          if gh api "repos/${REPO}/git/ref/heads/${branch}" --silent 2>/dev/null; then
            gh api -X DELETE "repos/${REPO}/git/refs/heads/${branch}"
          fi
          gh api "repos/${REPO}/git/refs" \
            -f "ref=refs/heads/${branch}" -f "sha=${commit}" --jq .ref

          {
            echo "The ratchet guards pass a fall and fail only a rise, so pull requests leave the ratchet files alone (#1363). This pull request records what fell on \`main\`, and carries only the ratchet files:"
            echo
            while IFS= read -r f; do echo "* \`$f\`"; done <changed-files.txt
            if [ -n "$DUP_BEFORE" ] && [ "$DUP_BEFORE" != "$DUP_AFTER" ]; then
              echo
              echo "Duplicated lines: ${DUP_BEFORE} to ${DUP_AFTER}."
            fi
            echo
            echo "Made by \`.github/workflows/ratchet-tighten.yml\` from each guard's \`--update\`. No user-visible change, so no changelog fragment."
          } >pr-body.md

          # GitHub Actions may not open a pull request in this repository, so
          # the pushed branch is the hand-off and a maintainer opens it (#1396).
          echo "::notice::Pushed ${branch}; open its pull request by hand with the body below."
          cat pr-body.md >>"$GITHUB_STEP_SUMMARY"
