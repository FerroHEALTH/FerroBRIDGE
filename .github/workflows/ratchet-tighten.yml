# Ratchet tighten (#1363). No specification governs this: our own design,
# the rule FerroEHR adopted for its ratchet guards (FerroHEALTH/FerroEHR#4554).
#
# The ratchet guards (scripts/checks/stray-literals.sh, duplication.sh and
# file-length.sh, #1359, and forwarders.sh, #1414) fail a rise and pass a
# fall with a note, so a pull request that moves strings to the catalogs,
# removes duplication or a forwarder, or splits a file touches none of the
# shared ratchet files and conflicts with no other open pull request. This
# lane does the tightening instead: once a day it
# runs each guard's --update on main and pushes one branch,
# chore/ratchet-tighten, that holds only the ratchet files, or moves an open
# pull request on it to the new counts. When nothing fell it does nothing.
#
# MAIN MOVES (#1590). The counts hold only for the commit they were measured
# on: a merge after the measurement that grows a count within main's recorded
# one leaves the open pull request unable to pass the merge queue. So every
# push to main moves an open tightening pull request to the counts measured
# at the pushed commit, and closes it when nothing falls there any more or a
# guard fails there. A push never opens a pull request or pushes a new
# branch; only the schedule and a dispatch do.
#
# It never pushes to main. The commit is made through the Git Data REST API,
# so GitHub signs it and it shows Verified
# (docs.github.com/en/rest/git/commits, "Signature verification").
#
# THE HAND-OFF. GitHub Actions may not create pull requests in this
# repository, and the owner keeps it that way with no separate token
# (2026-11-02), so the lane ends with a notice once the branch is pushed and a
# maintainer opens the pull request from it (#1396). A move made with the
# workflow token starts no pull_request run (docs.github.com/en/actions,
# "Triggering a workflow from a workflow"), so the lane dispatches CI on the
# moved branch, whose `conclusion` check then answers for the new head.
name: Ratchet tighten

on:
  schedule:
    # Daily 04:53 UTC, off the hour and in a slot of its own; read the
    # slots with `grep -rE '^ +- cron:' .github/workflows/`.
    - cron: "53 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  # A push with no open tightening pull request ends here, before the
  # concurrency group, so it can never displace a pending scheduled run.
  find:
    name: find the open tightening pull request
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # list the open pull request of the lane's branch
    outputs:
      open: ${{ steps.find.outputs.open }}
    steps:
      - name: List it
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          open=$(gh pr list --repo "$REPO" --head chore/ratchet-tighten --state open --json number --jq '.[0].number // empty')
          echo "open=${open}" >>"$GITHUB_OUTPUT"

  tighten:
    name: tighten
    needs: find
    # The counts are main's; a dispatch from another branch would lower them
    # to that branch's tree. A push only moves an open pull request.
    if: github.ref == 'refs/heads/main' && (github.event_name != 'push' || needs.find.outputs.open != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One run touches the branch at a time; a newer pending push run replaces
    # an older one, which measures an older commit.
    concurrency:
      group: ratchet-tighten
      cancel-in-progress: false
    permissions:
      actions: write # dispatch CI on the moved branch
      contents: write # create the blob, tree, commit and branch ref
      pull-requests: write # close, edit and arm auto-merge on the open pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # forwarders.sh builds tools/forwarders with the pinned toolchain.
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"

      # A rise on main is a failure for a person to look at, never a count
      # this lane writes down.
      - name: No ratchet has risen on main
        id: guards
        run: |
          set -euo pipefail
          bash scripts/checks/stray-literals.sh app/ferrobridge-console/src
          bash scripts/checks/duplication.sh
          bash scripts/checks/file-length.sh
          bash scripts/checks/forwarders.sh

      # The open pull request lowers counts below what main measures now, so it
      # can no longer pass; close it so it cannot be merged by hand.
      - name: Close the tightening pull request a rise invalidated
        if: failure() && steps.guards.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          open=$(gh pr list --repo "$REPO" --head chore/ratchet-tighten --state open --json number --jq '.[0].number // empty')
          if [ -z "$open" ]; then
            exit 0
          fi
          gh pr close "$open" --repo "$REPO" --delete-branch \
            --comment "A ratchet guard fails on \`main\` at ${HEAD_SHA}, so these counts no longer hold. Closed by \`.github/workflows/ratchet-tighten.yml\`; the next scheduled run pushes a new branch once \`main\` passes."
          echo "::warning::Closed #${open}: a ratchet guard fails on main."

      - name: Lower the counts
        id: update
        run: |
          set -euo pipefail
          count_before=$(git show HEAD:scripts/checks/duplication.count | awk '/^[[:space:]]*(#|$)/ { next } { print; exit }')
          bash scripts/checks/duplication.sh --update
          count_after=$(awk '/^[[:space:]]*(#|$)/ { next } { print; exit }' scripts/checks/duplication.count)
          # A block that moved and kept the count changes only its key, which
          # the check already tolerates; that alone is no reason for a PR.
          if [ "$count_before" = "$count_after" ]; then
            git checkout -- scripts/checks/duplication.count scripts/checks/duplication-baseline.txt
          fi
          bash scripts/checks/file-length.sh --update
          bash scripts/checks/stray-literals.sh --update app/ferrobridge-console/src
          forwarders_before=$(git show HEAD:scripts/checks/forwarders.count | awk '/^[[:space:]]*(#|$)/ { next } { print; exit }')
          bash scripts/checks/forwarders.sh --update
          forwarders_after=$(awk '/^[[:space:]]*(#|$)/ { next } { print; exit }' scripts/checks/forwarders.count)
          # As for duplication: a key that moved with the count unchanged is no reason for a PR.
          if [ "$forwarders_before" = "$forwarders_after" ]; then
            git checkout -- scripts/checks/forwarders.count scripts/checks/forwarders-baseline.txt
          fi

          git diff --name-only -- \
            scripts/checks/duplication.count scripts/checks/duplication-baseline.txt \
            scripts/checks/file-length-allow.txt scripts/checks/stray-literals.baseline \
            scripts/checks/forwarders.count scripts/checks/forwarders-baseline.txt >changed-files.txt
          other=$(git status --porcelain --untracked-files=no | awk '{ print $2 }' | grep -vxF -f changed-files.txt || true)
          if [ -n "$other" ]; then
            echo "$other"
            echo "::error::--update changed a file outside the ratchet files."
            exit 1
          fi
          if [ ! -s changed-files.txt ]; then
            echo "::notice::No ratchet fell. Nothing to do."
            echo "changed=0" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=1" >>"$GITHUB_OUTPUT"
          {
            echo "duplication_before=$count_before"
            echo "duplication_after=$count_after"
            echo "forwarders_before=$forwarders_before"
            echo "forwarders_after=$forwarders_after"
          } >>"$GITHUB_OUTPUT"
          {
            echo '### Ratchet files lowered'
            echo
            echo '```diff'
            git diff --stat
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Push, move or close the tightening branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.sha }}
          CHANGED: ${{ steps.update.outputs.changed }}
          DUP_BEFORE: ${{ steps.update.outputs.duplication_before }}
          DUP_AFTER: ${{ steps.update.outputs.duplication_after }}
          FWD_BEFORE: ${{ steps.update.outputs.forwarders_before }}
          FWD_AFTER: ${{ steps.update.outputs.forwarders_after }}
        run: |
          set -euo pipefail
          branch="chore/ratchet-tighten"
          ratchet_files=(
            scripts/checks/duplication.count scripts/checks/duplication-baseline.txt
            scripts/checks/file-length-allow.txt scripts/checks/stray-literals.baseline
            scripts/checks/forwarders.count scripts/checks/forwarders-baseline.txt
          )
          open=$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[0].number // empty')

          # Nothing falls at this commit, so an open pull request lowers a
          # count below what main measures and can no longer pass.
          if [ "$CHANGED" != "1" ]; then
            if [ -n "$open" ]; then
              gh pr close "$open" --repo "$REPO" --delete-branch \
                --comment "Nothing falls on \`main\` at ${BASE_SHA} any more, so these counts no longer hold. Closed by \`.github/workflows/ratchet-tighten.yml\`."
              echo "::notice::Closed #${open}: nothing falls on main at ${BASE_SHA}."
            fi
            exit 0
          fi
          if [ "$EVENT" = "push" ] && [ -z "$open" ]; then
            echo "::notice::No open tightening pull request to move; a push opens none."
            exit 0
          fi

          # An open pull request that already carries these counts holds for
          # this commit too; moving it would only restart its checks.
          if [ -n "$open" ]; then
            same=1
            for f in "${ratchet_files[@]}"; do
              theirs=$(gh api "repos/${REPO}/contents/${f}?ref=${branch}" --jq .sha)
              ours=$(git hash-object "$f")
              if [ "$theirs" != "$ours" ]; then
                same=0
                break
              fi
            done
            if [ "$same" = "1" ]; then
              echo "::notice::#${open} already carries the counts measured at ${BASE_SHA}."
              exit 0
            fi
          fi

          # The parent is the commit the counts were measured on, so the
          # lowered counts hold for it; CI on the pull request measures them
          # again against main as it is at merge time.
          base_tree=$(gh api "repos/${REPO}/git/commits/${BASE_SHA}" --jq .tree.sha)
          tree_args=()
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            # The body goes through a file: a ratchet file's base64 content
            # passed as one argument can exceed the kernel's limit (#1396).
            base64 -w0 "$f" | jq -Rs '{encoding: "base64", content: .}' >blob.json
            blob=$(gh api "repos/${REPO}/git/blobs" --input blob.json --jq .sha)
            tree_args+=( -f "tree[][path]=$f" -f "tree[][mode]=100644" \
                         -f "tree[][type]=blob" -f "tree[][sha]=$blob" )
            echo "staged $f ($blob)"
          done <changed-files.txt
          tree=$(gh api "repos/${REPO}/git/trees" \
                   -f "base_tree=${base_tree}" "${tree_args[@]}" --jq .sha)
          commit=$(gh api "repos/${REPO}/git/commits" \
                     -f "message=chore(checks): lower the ratchet counts" \
                     -f "tree=${tree}" -f "parents[]=${BASE_SHA}" --jq .sha)

          {
            echo "The ratchet guards pass a fall and fail only a rise, so pull requests leave the ratchet files alone (#1363). This pull request records what fell on \`main\` at ${BASE_SHA}, and carries only the ratchet files:"
            echo
            while IFS= read -r f; do echo "* \`$f\`"; done <changed-files.txt
            if [ -n "$DUP_BEFORE" ] && [ "$DUP_BEFORE" != "$DUP_AFTER" ]; then
              echo
              echo "Duplicated lines: ${DUP_BEFORE} to ${DUP_AFTER}."
            fi
            if [ -n "$FWD_BEFORE" ] && [ "$FWD_BEFORE" != "$FWD_AFTER" ]; then
              echo
              echo "Forwarders: ${FWD_BEFORE} to ${FWD_AFTER}."
            fi
            echo
            echo "Merge it only through the merge queue, never by hand: the counts hold for the commit they were measured on, and the queue measures them again on the head they land on. Each push to \`main\` moves this pull request to the counts measured there, or closes it when they no longer hold (#1590)."
            echo
            echo "Made by \`.github/workflows/ratchet-tighten.yml\` from each guard's \`--update\`. No user-visible change, so no changelog fragment."
          } >pr-body.md

          # One pull request at a time: an open one moves to the new commit,
          # which is this lane's own branch and never main.
          if [ -n "$open" ]; then
            gh api -X PATCH "repos/${REPO}/git/refs/heads/${branch}" \
              -f "sha=${commit}" -F force=true --jq .ref
            gh pr edit "$open" --repo "$REPO" --body-file pr-body.md
            # The token's push starts no pull_request run, so CI runs by dispatch.
            gh workflow run ci.yml --repo "$REPO" --ref "$branch"
            # A push to the head takes the pull request out of the queue; arm it again.
            if ! gh pr merge "$open" --repo "$REPO" --auto --squash; then
              echo "::warning::Could not arm auto-merge on #${open} again; arm it by hand."
            fi
            echo "::notice::Moved #${open} to ${commit}."
            exit 0
          fi
          if gh api "repos/${REPO}/git/ref/heads/${branch}" --silent 2>/dev/null; then
            gh api -X DELETE "repos/${REPO}/git/refs/heads/${branch}"
          fi
          gh api "repos/${REPO}/git/refs" \
            -f "ref=refs/heads/${branch}" -f "sha=${commit}" --jq .ref

          # GitHub Actions may not open a pull request in this repository, so
          # the pushed branch is the hand-off and a maintainer opens it (#1396).
          echo "::notice::Pushed ${branch}; open its pull request by hand with the body below."
          cat pr-body.md >>"$GITHUB_STEP_SUMMARY"
