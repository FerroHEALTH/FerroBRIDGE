# CodeQL code scanning (security analysis).
#
# Two languages, each in its own job:
#
#   * actions: runs NOW, on every change. The workflows in this directory are
#     code holding tokens that can publish releases, so they get the same
#     scrutiny as source. Build-mode "none".
#   * rust: GUARDED behind a detection job that checks for a root Cargo.toml,
#     the same primitive ci.yml uses, and on a pull request runs only when the
#     change reaches Rust, over the hand-written tree. A push to main and the
#     weekly schedule analyze the whole tree. `rust` is a generally-available
#     CodeQL language (GA 2025-10-14), build-mode "none", so it never contends
#     for cargo's build tree.
#
# Code scanning must be the ADVANCED setup for this workflow to run: GitHub
# rejects an advanced-config analysis while the CodeQL default setup is enabled
# for the repository. Keep the default setup OFF in Settings → Code security.
#
# Docs: https://docs.github.com/en/code-security/code-scanning
name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC (off-the-hour to dodge load spikes)

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# No permissions by default: each job grants its own.
permissions: {}

jobs:
  # The actions analysis always runs: the workflows are live code from day one.
  analyze-actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write # upload the SARIF results / alerts
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:actions"

  # Decides whether the Rust analysis runs at all. It checks out and looks for
  # a root Cargo.toml: hashFiles() cannot gate at `if:` time on a pre-code
  # tree, so a real detection job is the correct primitive (the ci.yml
  # pattern). On a pull request it also asks whether the change reaches Rust:
  # the workflow's paths filter lets a workflow-only change in for the actions
  # analysis, and the Rust analysis has nothing new to read in one.
  detect:
    name: detect workspace
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      cargo: ${{ steps.check.outputs.cargo }}
      rust: ${{ steps.check.outputs.rust }}
    steps:
      # Two commits: a pull request runs on GitHub's merge commit, whose first
      # parent is the base it merges into, so HEAD^1..HEAD is the change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ ! -f Cargo.toml ]; then
            echo "cargo=false" >> "$GITHUB_OUTPUT"
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "No Cargo.toml: the Rust analysis is skipped (repository in discovery)."
            exit 0
          fi
          echo "cargo=true" >> "$GITHUB_OUTPUT"
          parents="$(git rev-list --parents -n 1 HEAD | wc -w)"
          if [ "$EVENT" != pull_request ] || [ "$parents" -ne 3 ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request: the Rust analysis runs in full."
            exit 0
          fi
          # The Rust sources and manifests the extractor reads, the toolchain
          # pin it builds them with, and this workflow.
          if git diff --name-only HEAD^1 HEAD -- \
            '*.rs' '*Cargo.toml' Cargo.lock rust-toolchain.toml .github/workflows/codeql.yml |
            grep -q .; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "The change reaches Rust: the Rust analysis will run."
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "The change reaches no Rust: the Rust analysis is skipped."
          fi

  # The Rust analysis. A push to main and the weekly schedule extract the
  # whole tree. A pull request leaves out the generated trees (the FHIR model,
  # the HL7 v2 tables and the OMOP CDM row types, 4711 files): extracting and
  # querying them held a pull-request run at 24 to 32 minutes (#703), their
  # correctness belongs to the generator, which is analyzed, and main still
  # analyzes them after the merge. paths-ignore applies to Rust without a
  # build ("Customizing your advanced setup for code scanning", GitHub Docs).
  analyze-rust:
    name: Analyze (rust)
    needs: detect
    if: needs.detect.outputs.cargo == 'true' && needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write # upload the SARIF results / alerts
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL over the whole tree
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: rust
          build-mode: none

      - name: Initialize CodeQL over the hand-written tree
        if: github.event_name == 'pull_request'
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: rust
          build-mode: none
          config: |
            paths-ignore:
              - crates/fhir-types/src
              - crates/hl7v2-types/src
              - crates/omop-cdm/src/generated

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:rust"
