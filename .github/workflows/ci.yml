# CI in two tiers.
#
#   1. The workflow, shell, container and guard tier runs on every change and
#      needs no Rust: the workflow and shell linters and the committed guards,
#      each a job below; docs/ci-cd.md (The two tiers) is the list. These
#      keep this very file honest, so none of them may depend on Rust existing.
#   2. The Rust tier is gated behind a detection job that looks for a root
#      Cargo.toml. Every cargo lane is skipped cleanly until the workspace
#      lands and then activates by itself, with no workflow edit. hashFiles()
#      cannot gate a job at `if:` time, because the workspace is empty before
#      checkout, so a real detection job is the correct primitive. The same
#      job reads which packages a pull request reaches
#      (scripts/checks/affected.sh): a lane whose inputs the change does not
#      reach is skipped, the test, clippy and msrv lanes run the reached
#      packages in shards, and a push to main, a merge group and a dispatch
#      run everything.
#
# The `conclusion` job is the single required status check on main; it is what
# makes a mostly-skipped pipeline enforceable (docs/ci-cd.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Only the activity types that change the code under test, so a commit
    # gets one run: `edited` started a second run on the same commit, the
    # concurrency group cancelled the first, and its `conclusion` reported a
    # failure on the head commit (#1160). The guards read their labels and the
    # description from the API when they run, and pr-guards.yml re-runs the
    # one a change affects once this run completes.
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on a pull request only. A push to main and a
  # merge-group run each verify a distinct commit that must keep its own
  # result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No permissions by default: each job grants its own.
# The hosted runner has four cores and seven gigabytes. Every cargo invocation
# builds two crates at a time, so a large generated crate never compiles beside
# three others; the all-features union of fhir-types is kept out of CI
# altogether (see the clippy jobs), because that one crate compile alone
# exceeded the memory and the runner killed the job (exit 143, no diagnostic).
env:
  CARGO_BUILD_JOBS: "2"

permissions: {}

jobs:
  # ---- Tier 1: the checks that run on a repository with no code -------------
  # zizmor (https://docs.zizmor.sh/) is the static security analysis for GitHub
  # Actions, the machine check behind three properties this repository treats
  # as hard rules: every `uses:` pinned to a commit SHA (unpinned-uses), no
  # checkout persisting credentials (artipacked), and no context value spliced
  # into a shell (template-injection).
  #
  # The audit path is the whole of .github, not just the workflows: zizmor also
  # reads dependabot.yml (dependabot-cooldown) and composite actions under
  # .github/actions, which run with the calling workflow's permissions and are
  # the same class of live, token-holding code (#34).
  workflow-audit:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: zizmor@1.31.1
      - name: Audit .github
        # GH_TOKEN enables the online audits. impostor-commit verifies that a
        # pinned commit really belongs to the repository named in front of it,
        # which it cannot do offline. --min-severity=low gates every actionable
        # tier and leaves the informational tier advisory.
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity=low .github/

  # actionlint is the correctness half of the pair: `${{ }}` expressions that
  # cannot evaluate, `needs:` naming a job that does not exist, unknown runner
  # labels, and shellcheck over every embedded `run:` block.
  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint .github/workflows
        # The official image, digest-pinned. actionlint is a Go binary rather
        # than a crate, and its README's alternative is `curl | bash` off main,
        # the unpinned fetch the pinning rule forbids. The image also bundles
        # shellcheck, which half of actionlint's value depends on.
        #
        # SC2016 ("expressions don't expand in single quotes") is excluded, and
        # only it: every occurrence here is a printf format or a jq filter,
        # where single quotes are the correct idiom.
        run: |
          docker run --rm \
            -v "$PWD:/repo" --workdir /repo \
            -e SHELLCHECK_OPTS='-e SC2016' \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  # shellcheck over the tracked shell programs: the CI guards, the tracker
  # helpers, and the hooks. `--severity=style` is the lowest floor, so every
  # finding gates. A finding is fixed, or it carries a per-line
  # `# shellcheck disable=SCnnnn` directive with its reason. There is no
  # .shellcheckrc, deliberately: nothing may turn a code off tree-wide
  # (.claude/rules/ci-cd.md).
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The upstream release binary, pinned by version, rather than the
      # runner's distro package, which moves at every runner-image refresh.
      # Fetched by the same SHA-pinned installer, which verifies the checksum.
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: shellcheck@0.11.0
      - name: Every tracked shell program is clean at severity=style
        run: |
          set -euo pipefail
          # Every tracked *.sh, plus every tracked extensionless file whose
          # first line is a shell shebang, which covers the git hooks. A
          # NUL-delimited pipe, so a path with a space survives.
          {
            git ls-files -z '*.sh'
            git ls-files -z | while IFS= read -r -d '' f; do
              case "$f" in
                *.*) ;;
                *) head -c2 "$f" 2>/dev/null | grep -q '#!' \
                     && head -n1 "$f" | grep -qE 'sh$' && printf '%s\0' "$f" ;;
              esac
            done
          } | { grep -zc . >/dev/null && xargs -0 -r shellcheck --severity=style; } \
            || echo "no shell files to check"

  # hadolint over every tracked Dockerfile, under the committed .hadolint.yaml
  # (failure-threshold: warning). No Dockerfile exists yet, so the step reports
  # that and passes; it gains teeth the moment a container recipe lands.
  dockerfile-lint:
    name: hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every tracked Dockerfile passes hadolint
        # The official image, digest-pinned, for the same reason as actionlint:
        # hadolint is a Haskell binary with no checksum-verified installer in
        # the pinned tool set.
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' f; do files+=("$f"); done \
            < <(git ls-files -z 'Dockerfile' '*/Dockerfile' '*.Dockerfile' 'Dockerfile.*')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no Dockerfile to check"
            exit 0
          fi
          printf 'checking: %s\n' "${files[@]}"
          docker run --rm \
            -v "$PWD:/repo" --workdir /repo \
            hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            hadolint --config .hadolint.yaml "${files[@]}"

  # The quickstart and the console image, checked without publishing anything.
  # `docker compose config` resolves compose.yaml under every profile, so a
  # broken service, secret or interpolation fails here rather than at an
  # operator's first `up`. The dry-run build stages placeholder files at the
  # paths the release lane stages (release-console.yml) and builds
  # docker/console/Dockerfile for one platform with no output, so a COPY path or
  # a .dockerignore rule that misses the staged tree fails here too.
  container-config:
    name: compose config and console image dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: compose.yaml resolves under every profile
        run: |
          set -euo pipefail
          mkdir -p secrets
          : > secrets/cdm_url
          : > secrets/cdm_password
          : > secrets/cdr_password
          : > secrets/terminology_password
          : > secrets/console_oidc_client_secret
          docker compose --profile console config
          docker compose --profile cdm --profile vocab --profile console config --quiet
      # Every upstream credential variable set in the shell reaches the bridge,
      # and its password is mounted as a secret.
      - name: compose.yaml passes the upstream credentials through
        run: |
          set -euo pipefail
          names=()
          for lane in CDR TERMINOLOGY; do
            for key in USER PASSWORD_FILE OAUTH__ISSUER OAUTH__TOKEN_ENDPOINT \
              OAUTH__CLIENT_ID OAUTH__CLIENT_SECRET_FILE OAUTH__AUDIENCE; do
              names+=("FERROBRIDGE__${lane}__CREDENTIALS__${key}")
            done
          done
          for name in "${names[@]}"; do export "${name}=set-${name}"; done
          rendered="$(docker compose config --format json)"
          for name in "${names[@]}"; do
            jq -e --arg n "$name" '.services.ferrobridge.environment[$n] == "set-" + $n' <<<"$rendered" > /dev/null ||
              { echo "compose.yaml does not pass ${name} through to the bridge" >&2; exit 1; }
          done
          for secret in cdr_password terminology_password; do
            jq -e --arg s "$secret" 'any(.services.ferrobridge.secrets[]; .source == $s)' <<<"$rendered" > /dev/null ||
              { echo "compose.yaml does not mount the ${secret} secret on the bridge" >&2; exit 1; }
          done
      - name: docker/console/Dockerfile builds from a staged tree
        run: |
          set -euo pipefail
          mkdir -p dist/console/linux_amd64 dist/console/site/pkg
          : > dist/console/linux_amd64/ferrobridge-console
          for file in ferrobridge-console.wasm ferrobridge-console.js; do
            : > "dist/console/site/pkg/${file}"
          done
          docker buildx build --check -f docker/console/Dockerfile .
          docker buildx build --platform linux/amd64 -f docker/console/Dockerfile .

  # The comment-style guard (.claude/rules/comments.md, RFC 505 and RFC 1574)
  # over the whole tree. It reads .rs files only, so it reports "no files to
  # check" today and gates from the first hand-written source file.
  comment-style:
    name: comment-style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/comment-style.sh --all

  # The file-length guard: a hand-written Rust file stays under 1000 lines and
  # a listed breach may not grow (`.claude/rules/rust-style.md` §File and
  # module size, #351).
  file-length:
    name: file-length
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/file-length.sh

  # The stray-literal guard: a string the operator console draws belongs in
  # its catalog under app/ferrobridge-console/locales/, and a file may hold no
  # more stray literals than its baseline while the strings move (#956).
  stray-literals:
    name: stray-literals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/stray-literals.sh app/ferrobridge-console/src

  # The version-drift guard. It compares every present config file against
  # docs/VERSIONS.md and skips loudly for the files that have not landed yet,
  # so it is useful now and grows teeth as files appear.
  versions:
    name: versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/versions.sh
      # Every released changelog section against its text at its tag, which
      # it fetches from origin when the shallow checkout lacks it.
      - run: bash scripts/checks/changelog-released.sh
      # The changelog's Keep a Changelog structure, every fragment under
      # changelog.d/ well formed, and the structure and Security rules over
      # [Unreleased] with every fragment folded in, as the next cut writes it:
      # a Security section beside other changes gives its reason, and every
      # entry names a GHSA id or a security/vex/ path (CRA Annex I Part II(2),
      # (4) and (8)). The release plan job runs both over the section being
      # cut, through scripts/release/plan.sh.
      - run: bash scripts/checks/changelog-structure.sh
      - run: bash scripts/checks/changelog-security.sh --self-test
      - run: bash scripts/release/changelog.sh --self-test
      - run: bash scripts/release/changelog.sh --check
      - run: bash scripts/release/changelog.sh --check-preview
      - run: bash scripts/release/plan.sh --self-test
      # The weekly freshness read's own reader of the Chrome for Testing
      # feed, over fixtures and with no network.
      - run: bash scripts/checks/pin-freshness.sh --self-test
      # The crate bump guard over synthetic histories, on every run, because
      # its own job runs on pull requests only and skips under its label.
      - run: bash scripts/checks/crate-version-guard.sh --self-test

  # The profile validator's package set (#435), fetched at build time and
  # never committed (docs/specs/fhir-packages/hl7.fhir.eu.eps#1.0.0-ballot/
  # PROVENANCE.md). The cache is keyed on the pins, and the script verifies
  # the count and digest of a restored tree as it does of a download. The
  # closure check first proves on synthetic sets that it refuses a gap, then
  # runs over every fetched package.json.
  profile-packages:
    name: profile-packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned profile packages
        id: profile-packages
        run: echo "key=$(bash scripts/vendor/profile-packages.sh --cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore the profile packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/specs/fhir-packages/*/package
          key: profile-packages-${{ steps.profile-packages.outputs.key }}
      - name: Fetch and verify the profile packages
        run: bash scripts/vendor/profile-packages.sh
      - run: |
          set -euo pipefail
          bash scripts/vendor/profile-packages.sh --self-test
          bash scripts/vendor/profile-packages.sh --check

  # The book theme favicons are copies of the brand mark, so the mark exists
  # twice and only this guard keeps the two byte-identical (#52).
  favicon-sync:
    name: favicon-sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/favicon-sync.sh

  # Every launcher of the server in a test lane switches the usage report
  # off, so a throwaway runner never counts as an installation (#581). The
  # self-test first proves the guard catches an unswitched launcher.
  usage-report-off:
    name: usage-report-off
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          bash scripts/checks/usage-report-off.sh --self-test
          bash scripts/checks/usage-report-off.sh

  # Every TODO(#N) and every issue a pending subcommand names must still be
  # open on the tracker (#614). The job token reads the issues and nothing
  # else.
  todo-issues:
    name: todo-issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every pending-work pointer names an open issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/checks/todo-issues.sh

  # The tracker helpers, the release milestone script, the deployment probe and
  # the destructive-command hook, each with a self-test. The probe self-test drives a stub curl. The helpers' real branches run only
  # against the live tracker: the fallback of fields.sh needs a token that
  # cannot read the organisation's issue types, and the migration and the
  # label run write to every issue. Each drives itself against a stub gh on
  # PATH instead (.claude/rules/issue-workflow.md).
  tracker-helpers:
    name: tracker-helpers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          bash scripts/gh/fields.sh --self-test
          bash scripts/gh/labels.sh --self-test
          bash scripts/gh/migrate-fields.sh --self-test
          bash scripts/gh/watch-prs.sh --self-test
          bash scripts/deploy-probe.sh --self-test
          bash scripts/release/milestone.sh --self-test
          bash .claude/hooks/block_dangerous.sh --self-test
          bash .claude/hooks/lib/target_test.sh

  # ---- Tier 2: the Rust lanes, gated on the workspace existing --------------
  # The one job that decides whether the cargo tier runs at all, and which of
  # its lanes a change needs: it checks out, looks for a root Cargo.toml, and
  # reads the packages the change reaches (docs/ci-cd.md, "Lanes that run only
  # when their inputs change"). Every Rust job below `needs` it.
  detect:
    name: detect workspace and changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      cargo: ${{ steps.check.outputs.cargo }}
      all: ${{ steps.affected.outputs.all }}
      packages: ${{ steps.affected.outputs.packages }}
      rust: ${{ steps.affected.outputs.rust }}
      fhir-types: ${{ steps.affected.outputs.fhir_types }}
      codegen: ${{ steps.affected.outputs.codegen }}
      omop-codegen: ${{ steps.affected.outputs.omop_codegen }}
      sqlx: ${{ steps.affected.outputs.sqlx }}
      conformance: ${{ steps.affected.outputs.conformance }}
      e2e: ${{ steps.affected.outputs.e2e }}
      e2e-packages: ${{ steps.affected.outputs.e2e_packages }}
      test-matrix: ${{ steps.affected.outputs.test_matrix }}
      lint-matrix: ${{ steps.affected.outputs.lint_matrix }}
      console: ${{ steps.affected.outputs.console }}
      journeys: ${{ steps.affected.outputs.journeys }}
    steps:
      # Two commits: a pull request runs on GitHub's merge commit, whose first
      # parent is the base it merges into, so HEAD^1..HEAD is the change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: check
        run: |
          set -euo pipefail
          if [ -f Cargo.toml ]; then
            echo "cargo=true" >> "$GITHUB_OUTPUT"
            echo "Cargo.toml present: the Rust lanes will run."
          else
            echo "cargo=false" >> "$GITHUB_OUTPUT"
            echo "No Cargo.toml: the Rust lanes are skipped (repository in its design phase)."
          fi
      # The runner's own stable cargo reads the manifests, so a job that
      # compiles nothing installs no toolchain for `cargo metadata --no-deps`.
      - name: The classification still answers as designed
        if: steps.check.outputs.cargo == 'true'
        env:
          RUSTUP_TOOLCHAIN: stable
        run: bash scripts/checks/affected.sh --self-test
      - name: The packages this change reaches
        id: affected
        if: steps.check.outputs.cargo == 'true'
        env:
          EVENT: ${{ github.event_name }}
          RUSTUP_TOOLCHAIN: stable
        run: |
          set -euo pipefail
          parents="$(git rev-list --parents -n 1 HEAD | wc -w)"
          if [ "$EVENT" = pull_request ] && [ "$parents" -eq 3 ]; then
            bash scripts/checks/affected.sh --base HEAD^1 --head HEAD | tee -a "$GITHUB_OUTPUT"
          else
            bash scripts/checks/affected.sh --all | tee -a "$GITHUB_OUTPUT"
          fi

  fmt:
    name: rustfmt
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustfmt compiles nothing, so this lane keeps no build cache.
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          cache: "false"
      - run: cargo fmt --all --check

  # The reached packages in the shards detect packs by measured cost, each
  # shard with a cache of its own; a push to main lints every package. The
  # build caches of every lane are saved from main only, so a pull request
  # restores main's and never evicts it.
  clippy:
    name: clippy (${{ matrix.packages }})
    needs: detect
    if: needs.detect.outputs.cargo == 'true' && needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.lint-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          cache-shared-key: clippy-${{ matrix.shard }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-hack
      # One package at a time, the way the msrv job compiles and passes: a
      # workspace-wide check schedules the two generated giants (fhir-types with
      # its five versions, openehr-am behind the client) side by side and the
      # runner's seven gigabytes run out; per package they never meet. Default
      # features here; the per-version `resources` surface of fhir-types is
      # linted by clippy-fhir-types below, and the all-features union (five
      # versions, every resource, one crate) is no consumer's surface.
      - env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          set -euo pipefail
          read -ra packages <<<"$PACKAGES"
          args=()
          for package in "${packages[@]}"; do args+=(-p "$package"); done
          cargo hack clippy "${args[@]}" --all-targets --locked -- -D warnings
      # ferrobridge-hl7v2 without its default `map` feature, the surface of a
      # consumer that takes only the listener, the parser and the ack (#1221).
      - if: contains(matrix.packages, 'ferrobridge-hl7v2')
        run: cargo clippy -p ferrobridge-hl7v2 --lib --no-default-features --locked -- -D warnings
      # eehrxf has no default feature: one feature per Art 14(1) category and
      # one per serialisation, each linted on its own as well as together.
      - if: contains(matrix.packages, 'eehrxf')
        run: cargo hack clippy -p eehrxf --each-feature --all-targets --locked -- -D warnings

  clippy-fhir-types:
    name: clippy-fhir-types (${{ matrix.version }}, resources)
    needs: detect
    if: needs.detect.outputs.cargo == 'true' && needs.detect.outputs.fhir-types == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: [stu3, r4, r4b, r5, r6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      # One version with every resource is what a consumer builds; each is one
      # crate compile and fits the runner.
      - env:
          VERSION: ${{ matrix.version }}
        run: cargo clippy --locked -p fhir-types --all-targets --no-default-features --features "$VERSION,resources" -- -D warnings

  # The reached packages in shards, as the clippy lane runs them.
  test:
    name: test (${{ matrix.packages }})
    needs: detect
    if: needs.detect.outputs.cargo == 'true' && needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.test-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-shared-key: test-${{ matrix.shard }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest,cargo-hack
      # The fhir-codegen tests read the HL7 v2 definitions, which are fetched
      # at build time and never committed; the same cache and check as
      # codegen-drift.
      - name: Read the pinned HL7 v2 definitions commit
        id: v2ig
        run: echo "commit=$(bash scripts/vendor/v2ig.sh --commit)" >> "$GITHUB_OUTPUT"
      - name: Restore the HL7 v2 definitions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/fhir-codegen/vendor/hl7-v2ig/input
          key: hl7-v2ig-${{ steps.v2ig.outputs.commit }}
      - name: Fetch and verify the HL7 v2 definitions
        run: bash scripts/vendor/v2ig.sh
      - name: Read the pinned HL7 v2 legacy tables commit
        id: v2-legacy
        run: echo "commit=$(bash scripts/vendor/v2-legacy.sh --commit)" >> "$GITHUB_OUTPUT"
      - name: Restore the HL7 v2 legacy tables
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/fhir-codegen/vendor/hl7-v2-legacy/src
          key: hl7-v2-legacy-${{ steps.v2-legacy.outputs.commit }}
      - name: Fetch and verify the HL7 v2 legacy tables
        run: bash scripts/vendor/v2-legacy.sh
      # The hl7v2-smoke corpus test reads the NIST and AIRA message sets,
      # fetched at build time and never committed
      # (crates/ferrobridge-hl7v2/vendor/nist/PROVENANCE.md). The cache is
      # keyed on their pins, and the script verifies the count and digest of a
      # restored tree as it does of a download.
      - name: Read the pinned HL7 v2 sample sets
        id: hl7v2-samples
        run: echo "key=$(bash scripts/vendor/hl7v2-samples.sh --cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore the HL7 v2 sample sets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            crates/ferrobridge-hl7v2/vendor/nist/lri-r2
            crates/ferrobridge-hl7v2/vendor/nist/loi-r1
            crates/ferrobridge-hl7v2/vendor/nist/ss-r2
            crates/ferrobridge-hl7v2/vendor/aira-mqe/examples
          key: hl7v2-samples-${{ steps.hl7v2-samples.outputs.key }}
      - name: Fetch and verify the HL7 v2 sample sets
        run: bash scripts/vendor/hl7v2-samples.sh --build-time
      # The FHIR model corpora and the R4 facade corpus read the HL7 examples
      # packages, fetched at build time and never committed
      # (tools/ferrobridge-testkit/vendor/hl7.fhir.r4.examples/PROVENANCE.md).
      # The cache is keyed on their pins, and the script verifies the count
      # and digest of a restored tree as it does of a download.
      - name: Read the pinned FHIR examples packages
        id: fhir-examples
        run: echo "key=$(bash scripts/vendor/fhir-packages.sh --cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore the FHIR examples packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tools/ferrobridge-testkit/vendor/hl7.fhir.r3.examples/package
            tools/ferrobridge-testkit/vendor/hl7.fhir.r4.examples/package
            tools/ferrobridge-testkit/vendor/hl7.fhir.r4b.examples/package
            tools/ferrobridge-testkit/vendor/hl7.fhir.r5.examples/package
            tools/ferrobridge-testkit/vendor/hl7.fhir.r6.examples/package
          key: fhir-examples-${{ steps.fhir-examples.outputs.key }}
      - name: Fetch and verify the FHIR examples packages
        run: bash scripts/vendor/fhir-packages.sh --build-time
      # The profile validator's package-gated tests read the profile packages,
      # restored from the cache key of the profile-packages lane, and fail
      # under CI when they are absent.
      - name: Read the pinned profile packages
        id: profile-packages
        run: echo "key=$(bash scripts/vendor/profile-packages.sh --cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore the profile packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/specs/fhir-packages/*/package
          key: profile-packages-${{ steps.profile-packages.outputs.key }}
      - name: Fetch and verify the profile packages
        run: bash scripts/vendor/profile-packages.sh
      # One package at a time, as the clippy and msrv lanes do: a workspace-wide
      # test build schedules the generated giants side by side and the runner
      # kills it with exit 143 (docs/ci-cd.md). nextest does not run doctests,
      # so they get their own compile.
      - env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          set -euo pipefail
          read -ra packages <<<"$PACKAGES"
          args=()
          for package in "${packages[@]}"; do args+=(-p "$package"); done
          cargo hack nextest run "${args[@]}" --locked --no-tests=pass
          cargo hack test --doc "${args[@]}" --locked
      # eehrxf has no default feature, so its suites run with every feature on.
      - if: contains(matrix.packages, 'eehrxf')
        run: |
          set -euo pipefail
          cargo nextest run -p eehrxf --all-features --locked --no-tests=pass
          cargo test --doc -p eehrxf --all-features --locked

  # The conformance gate (#24): the corpus tests measure the vendored
  # FHIRconnect and OMOCL libraries, the round-trip chains, the REST
  # API's operation definitions, the HL7 v2 message sets and the FHIR examples
  # packages (per version, and R4 through the facade) against the committed
  # pass lists under conformance/. A case a list records that no
  # longer passes fails the job, and so does an unrecorded new pass or a badge
  # that disagrees with its list. The script runs one package per nextest
  # invocation, as the test lane does through cargo hack, so the generated
  # giants never compile side by side, and fetches the build-time HL7 v2 sets,
  # FHIR examples packages and profile packages this job restores from the
  # cache keys of the test and profile-packages lanes.
  conformance:
    name: conformance
    needs: detect
    if: needs.detect.outputs.cargo == 'true' && needs.detect.outputs.conformance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest
      - name: Read the pinned HL7 v2 sample sets
        id: hl7v2-samples
        run: echo "key=$(bash scripts/vendor/hl7v2-samples.sh --cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore the HL7 v2 sample sets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            crates/ferrobridge-hl7v2/vendor/nist/lri-r2
            crates/ferrobridge-hl7v2/vendor/nist/loi-r1
            crates/ferrobridge-hl7v2/vendor/nist/ss-r2
            crates/ferrobridge-hl7v2/vendor/aira-mqe/examples
          key: hl7v2-samples-${{ steps.hl7v2-samples.outputs.key }}
      - name: Read the pinned FHIR examples packages
        id: fhir-examples
        run: echo "key=$(bash scripts/vendor/fhir-packages.sh --cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore the FHIR examples packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tools/ferrobridge-testkit/vendor/hl7.fhir.r3.examples/package
            tools/ferrobridge-testkit/vendor/hl7.fhir.r4.examples/package
            tools/ferrobridge-testkit/vendor/hl7.fhir.r4b.examples/package
            tools/ferrobridge-testkit/vendor/hl7.fhir.r5.examples/package
            tools/ferrobridge-testkit/vendor/hl7.fhir.r6.examples/package
          key: fhir-examples-${{ steps.fhir-examples.outputs.key }}
      - name: Read the pinned profile packages
        id: profile-packages
        run: echo "key=$(bash scripts/vendor/profile-packages.sh --cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore the profile packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/specs/fhir-packages/*/package
          key: profile-packages-${{ steps.profile-packages.outputs.key }}
      - run: scripts/checks/conformance.sh --check

  # The container-backed lane. Every test behind the harness returns early
  # unless FERROBRIDGE_E2E is 1, so this job is the only run where the
  # PostgreSQL and the reference CDR actually start. testcontainers talks to
  # the runner's own Docker daemon, so `services:` is not used: the harness
  # creates the network and both containers itself and tears them down on drop.
  # The images are public, so no registry credential is needed. Named
  # packages, never --workspace: a workspace-wide compile schedules the
  # generated giants side by side and the runner runs out of memory. The
  # packages are the ones of omop-cdm, ferrobridge-server, ferrobridge-term
  # and ferrobridge-testkit that the change reaches (affected.sh names them).
  e2e:
    name: e2e (containers)
    needs: detect
    if: needs.detect.outputs.cargo == 'true' && needs.detect.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      FERROBRIDGE_E2E: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest
      - env:
          PACKAGES: ${{ needs.detect.outputs.e2e-packages }}
        run: |
          set -euo pipefail
          read -ra packages <<<"$PACKAGES"
          args=()
          for package in "${packages[@]}"; do args+=(-p "$package"); done
          cargo nextest run --locked "${args[@]}" --no-tests=pass

  # The sqlx query metadata of omop-cdm (#89). The crate's queries compile
  # offline from crates/omop-cdm/.sqlx/; this job builds the CDM schema from
  # the vendored DDL in a service container and fails when that metadata no
  # longer describes the queries. The image is the docs/VERSIONS.md PostgreSQL
  # row, which scripts/checks/versions.sh compares with this file. The service
  # trusts local connections, so no credential is written here. sqlx-cli is
  # not in taiki-e/install-action's own tool list, so the action installs it
  # through its cargo-binstall fallback.
  sqlx-offline:
    name: sqlx-offline
    needs: detect
    if: needs.detect.outputs.cargo == 'true' && needs.detect.outputs.sqlx == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: ferrobridge
          POSTGRES_DB: ferrobridge
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=ferrobridge --dbname=ferrobridge"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: sqlx-cli@0.9.0
      - run: scripts/checks/sqlx-offline.sh --check
        env:
          DATABASE_URL: postgres://ferrobridge@127.0.0.1:5432/ferrobridge

  # The operator console, app/ferrobridge-console (#599; no specification
  # governs it: our own design). The workspace lanes build, lint and test its
  # server half on the host; this job lints its browser half on the target it
  # ships to, so a dependency that cannot compile for wasm32 fails here, and
  # builds the release site bundle with the tools docs/VERSIONS.md pins. The
  # console has no Cargo feature, so the cargo-hack feature runs add nothing
  # for it.
  console:
    name: console (wasm32 and site bundle)
    needs: detect
    if: needs.detect.outputs.cargo == 'true' && needs.detect.outputs.console == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          target: wasm32-unknown-unknown
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked -p ferrobridge-console --lib --target wasm32-unknown-unknown -- -D warnings
      # The bridge's operator documents and the mapping core under them compile
      # for the browser, so the console's browser half can draw them (#1256).
      - name: The operator contract compiles for wasm32
        run: cargo check --locked -p ferrobridge-operator-api --target wasm32-unknown-unknown
      - name: Install cargo-leptos
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-leptos@0.3.11
      - name: Install the wasm-bindgen CLI
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: wasm-bindgen@0.2.129
      # Pinned and checked against their SHA-256 before use, so cargo-leptos
      # finds both on PATH and downloads neither itself.
      - name: Install wasm-opt
        run: |
          bash scripts/release/console-tools.sh "$RUNNER_TEMP/console-tools"
          echo "$RUNNER_TEMP/console-tools/bin" >> "$GITHUB_PATH"
      - run: bash scripts/release/console-site.sh --release
      # The bundle's raw and compressed sizes go to the job summary, and the
      # step fails above the budget of .claude/rules/leptos-ui.md §12.
      - name: Measure the bundle against its budget
        run: bash scripts/checks/console-bundle.sh
      # The bundle names no home, runner, registry or toolchain directory of
      # the build host.
      - name: Check the bundle names no build-host path
        run: bash scripts/checks/console-paths.sh

  # The operator console's browser journeys (#602; no specification governs
  # them: our own design). Every journey checks FERROBRIDGE_JOURNEYS first
  # and returns early without it, so the test job needs no browser; this job
  # sets the gate, builds the release site bundle the console serves, and
  # drives headless Chrome through chromedriver, both at the Chrome for
  # Testing release docs/VERSIONS.md pins, against a running bridge and
  # console. A journey fails on any error the browser logs.
  journeys:
    name: journeys (browser)
    needs: detect
    if: needs.detect.outputs.cargo == 'true' && needs.detect.outputs.journeys == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      FERROBRIDGE_JOURNEYS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          target: wasm32-unknown-unknown
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-leptos
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-leptos@0.3.11
      - name: Install the wasm-bindgen CLI
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: wasm-bindgen@0.2.129
      # Pinned and checked against their SHA-256 before use, so cargo-leptos
      # finds both on PATH and downloads neither itself.
      - name: Install wasm-opt
        run: |
          bash scripts/release/console-tools.sh "$RUNNER_TEMP/console-tools"
          echo "$RUNNER_TEMP/console-tools/bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest
      - name: Install Chrome and chromedriver
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 155.0.8059.79
          install-chromedriver: true
      - run: bash scripts/release/console-site.sh --release
      # Each journey starts the pinned chromedriver on a port of its own and
      # stops it with its session, so the journeys run in parallel with no
      # driver shared between them.
      - name: Run the journeys
        env:
          FERROBRIDGE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          FERROBRIDGE_CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: >-
          cargo nextest run --locked -p ferrobridge-testkit
          -E 'test(/^journeys::/)'

  doc:
    name: rustdoc
    needs: detect
    if: needs.detect.outputs.cargo == 'true' && needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The [workspace.lints.rustdoc] levels apply to every `cargo doc`; -D
      # turns a broken intra-doc link into a failed build.
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --locked --workspace --no-deps --all-features --document-private-items

  # Runs on every change: the advisory database moves without one.
  cargo-deny:
    name: cargo-deny
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-deny reads the lockfile and the registry index and compiles
      # nothing, so this lane keeps no build cache.
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny
      # Reads the same RustSec advisory database as cargo-audit and adds
      # yanked, licences, bans and sources, so there is no separate audit job.
      - run: cargo deny check
      # The fuzz crate keeps a lock of its own outside the workspace; its
      # advisories are held to the same floor.
      - run: cargo deny --manifest-path fuzz/Cargo.toml --config deny.toml --locked check advisories
      # The OpenVEX side of the same exceptions (security/vex/README.md): the
      # generated document is exactly what deny.toml and the prose produce, no
      # exception outlives its finding, and every statement's dependency path
      # is the one cargo resolves. yq and jq come with the hosted runner.
      - run: bash scripts/checks/vex-advisories.sh
      - run: bash scripts/checks/advisory-exceptions.sh
      - run: bash scripts/checks/vex-reachability.sh
      # The release record's join of Trivy findings and VEX statements, over
      # synthetic input.
      - run: bash scripts/checks/vex-coverage.sh --self-test

  # The reached packages in the clippy lane's shards.
  msrv:
    name: msrv (${{ matrix.packages }})
    needs: detect
    if: needs.detect.outputs.cargo == 'true' && needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.lint-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-shared-key: msrv-${{ matrix.shard }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-hack
      # The Cargo book's named tool for verifying the declared rust-version,
      # which it reads from the workspace `rust-version`.
      - env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          set -euo pipefail
          read -ra packages <<<"$PACKAGES"
          args=()
          for package in "${packages[@]}"; do args+=(-p "$package"); done
          cargo hack check --rust-version "${args[@]}" --locked --all-targets

  # The feature matrix of the generated crate (#120): one tree holds the union
  # of the declared root sets, so every feature combination the emitter
  # distinguishes has to compile on its own.
  fhir-types-features:
    name: fhir-types-features (cargo-hack)
    needs: detect
    if: needs.detect.outputs.cargo == 'true' && needs.detect.outputs.fhir-types == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-hack
      # `--no-dev-deps` rewrites the workspace manifests, which `--locked`
      # then refuses; the crate has no dev-dependencies, so the flag would
      # change nothing here.
      - run: cargo hack check -p fhir-types --each-feature --locked
      # The widest selection one version carries, which no single-feature run
      # reaches.
      - run: cargo check -p fhir-types --no-default-features --features r4,resources --locked

  # The codegen drift gate (.claude/rules/codegen.md): regenerate
  # crates/fhir-types from the vendored HL7 packages and fail on any
  # difference. The emitter shells out to rustfmt, so the toolchain needs that
  # component.
  codegen-drift:
    name: codegen-drift
    needs: detect
    if: needs.detect.outputs.cargo == 'true' && needs.detect.outputs.codegen == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      # The HL7 v2 definitions are fetched at build time and never committed
      # (tools/fhir-codegen/vendor/hl7-v2ig/PROVENANCE.md). The cache is keyed
      # on the pinned commit, and the script verifies the file count and tree
      # digest of a restored tree as it does of a download.
      - name: Read the pinned HL7 v2 definitions commit
        id: v2ig
        run: echo "commit=$(bash scripts/vendor/v2ig.sh --commit)" >> "$GITHUB_OUTPUT"
      - name: Restore the HL7 v2 definitions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/fhir-codegen/vendor/hl7-v2ig/input
          key: hl7-v2ig-${{ steps.v2ig.outputs.commit }}
      - name: Fetch and verify the HL7 v2 definitions
        run: bash scripts/vendor/v2ig.sh
      # The HL7 v2 legacy tables are fetched and cached the same way
      # (tools/fhir-codegen/vendor/hl7-v2-legacy/PROVENANCE.md).
      - name: Read the pinned HL7 v2 legacy tables commit
        id: v2-legacy
        run: echo "commit=$(bash scripts/vendor/v2-legacy.sh --commit)" >> "$GITHUB_OUTPUT"
      - name: Restore the HL7 v2 legacy tables
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/fhir-codegen/vendor/hl7-v2-legacy/src
          key: hl7-v2-legacy-${{ steps.v2-legacy.outputs.commit }}
      - name: Fetch and verify the HL7 v2 legacy tables
        run: bash scripts/vendor/v2-legacy.sh
      # A release build: a full emit of the two generated crates takes minutes
      # in a debug build, and this job is the one place it runs.
      - run: cargo run --locked --release -p fhir-codegen -- emit --check

  # The tests that emit a whole crate run only here, behind the gate the test
  # binary reads (tools/fhir-codegen/tests/it/main.rs); the `test` and coverage
  # jobs skip them. They run beside codegen-drift because the two halves in
  # one job outgrew its 30-minute timeout (#388).
  #
  # The `emit` profile (root Cargo.toml) optimises the emitter and leaves the
  # two generated crates the test binary links unoptimised: optimising them
  # was 35 of this lane's 47 minutes, and at opt-level 0 they fit the runner
  # two crates at a time, as in the test lane. The two longest tests (four
  # and three full emits of hl7v2-types) each take a shard of their own, and
  # the third shard runs every other test: its filter is the complement of
  # the first two, so a test belongs to exactly one shard, and a renamed one
  # falls into the third while its old shard fails on `--no-tests=fail`.
  codegen-emit-tests:
    name: codegen-emit-tests (${{ matrix.shard }})
    needs: detect
    if: needs.detect.outputs.cargo == 'true' && needs.detect.outputs.codegen == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: v2-check
            filter: test(=v2::emit::check_reports_edited_missing_and_stale_files)
          - shard: v2-twice
            filter: test(=v2::emit::emitting_twice_is_byte_identical_and_check_passes)
          - shard: rest
            filter: not (test(=v2::emit::check_reports_edited_missing_and_stale_files) | test(=v2::emit::emitting_twice_is_byte_identical_and_check_passes))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One build serves every shard, so the shards share one cache.
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          cache-shared-key: codegen-emit-tests
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      # The HL7 v2 definitions are fetched at build time and never committed
      # (tools/fhir-codegen/vendor/hl7-v2ig/PROVENANCE.md). The cache is keyed
      # on the pinned commit, and the script verifies the file count and tree
      # digest of a restored tree as it does of a download.
      - name: Read the pinned HL7 v2 definitions commit
        id: v2ig
        run: echo "commit=$(bash scripts/vendor/v2ig.sh --commit)" >> "$GITHUB_OUTPUT"
      - name: Restore the HL7 v2 definitions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/fhir-codegen/vendor/hl7-v2ig/input
          key: hl7-v2ig-${{ steps.v2ig.outputs.commit }}
      - name: Fetch and verify the HL7 v2 definitions
        run: bash scripts/vendor/v2ig.sh
      # The HL7 v2 legacy tables are fetched and cached the same way
      # (tools/fhir-codegen/vendor/hl7-v2-legacy/PROVENANCE.md).
      - name: Read the pinned HL7 v2 legacy tables commit
        id: v2-legacy
        run: echo "commit=$(bash scripts/vendor/v2-legacy.sh --commit)" >> "$GITHUB_OUTPUT"
      - name: Restore the HL7 v2 legacy tables
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/fhir-codegen/vendor/hl7-v2-legacy/src
          key: hl7-v2-legacy-${{ steps.v2-legacy.outputs.commit }}
      - name: Fetch and verify the HL7 v2 legacy tables
        run: bash scripts/vendor/v2-legacy.sh
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest
      - run: cargo nextest run --locked --cargo-profile emit -p fhir-codegen --no-tests=fail -E "$FILTER"
        env:
          FERROBRIDGE_CODEGEN_EMIT: "1"
          FILTER: ${{ matrix.filter }}

  # The same gate for the OMOP side: regenerate crates/omop-cdm from the
  # vendored OHDSI CommonDataModel definitions and fail on any difference.
  omop-cdm-codegen-drift:
    name: omop-cdm-codegen-drift
    needs: detect
    if: needs.detect.outputs.cargo == 'true' && needs.detect.outputs.omop-codegen == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo run --locked -p omop-cdm-codegen -- emit --check

  # The changelog guard (Keep a Changelog 1.1.0; the fragments are our own
  # design, no specification governs them): a pull request that changes a
  # user-visible surface adds a fragment under changelog.d/
  # (changelog.d/README.md), and no pull request writes under CHANGELOG.md's
  # [Unreleased], the lines every open pull request used to conflict on. The
  # `no-changelog` label waives the entry, never the [Unreleased] refusal. The
  # fragments' form and the preview's structure and Security rules run in the
  # `versions` job on every event. Pull requests only: the entry is a
  # base..head diff plus a label, which a merge group does not carry.
  changelog-guard:
    name: changelog-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the labels when the step runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: bash scripts/checks/changelog-guard.sh --self-test
      - name: Require a changelog fragment for user-visible changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Read when the step runs: a re-run replays the event payload (#1160).
          if [ "$(gh api "repos/${GH_REPO}/pulls/${PR}" --jq 'any(.labels[].name; . == "no-changelog")')" = true ]; then
            echo "no-changelog label set: the entry is waived, an [Unreleased] edit is still refused."
            bash scripts/checks/changelog-guard.sh --waived "$BASE" "$HEAD"
            exit 0
          fi
          bash scripts/checks/changelog-guard.sh "$BASE" "$HEAD"

  # The per-crate bump rule (.claude/rules/crates-publishing.md): a pull
  # request that changes a crate's packaged content moves that crate's version
  # in the same change, because a published version is immutable. The
  # `no-crate-bump` label is the escape for a diff that provably alters no
  # packaged bytes. The merge group runs it again against the queue base, so a
  # change whose version main reached while it waited fails before it merges
  # (#1096).
  crate-version-guard:
    name: crate-version-guard
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The base is the target branch as fetched now, never the event's
      # `base.sha`, and the guard diffs from its merge base with the head, so a
      # crate change main gained after the fork is not counted (#969).
      - name: Packaged crate content moved with its version
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Read when the step runs: a re-run replays the event payload (#1160).
          if [ "$(gh api "repos/${GH_REPO}/pulls/${PR}" --jq 'any(.labels[].name; . == "no-crate-bump")')" = true ]; then
            echo "crate-version-guard: #${PR} carries no-crate-bump."
            exit 0
          fi
          bash scripts/checks/crate-version-guard.sh "origin/$BASE_REF" "$HEAD"
      # The queue builds each entry onto the one ahead of it and names that as
      # the base, so the diff is this entry's change alone. The group ref names
      # the pull request (`gh-readonly-queue/main/pr-<n>-<sha>`), whose label
      # is the same escape; a ref that names none runs the guard.
      - name: The queued change moves each version above the queue base
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GROUP_REF: ${{ github.event.merge_group.head_ref }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          pr="$(sed -nE 's|.*/pr-([0-9]+)-[0-9a-f]+$|\1|p' <<<"$GROUP_REF")"
          if [[ -n "$pr" ]]; then
            labels="$(gh pr view "$pr" --json labels --jq '.labels[].name')"
            if grep -qx 'no-crate-bump' <<<"$labels"; then
              echo "crate-version-guard: #$pr carries no-crate-bump."
              exit 0
            fi
          fi
          bash scripts/checks/crate-version-guard.sh "$BASE_SHA" "$HEAD_SHA"

  # Every publishable crate packages and verifies as crates.io would build it,
  # so a release's crates leg finds no surprise. No cache: the dry run checks
  # the bytes a publish would upload (.claude/rules/ci-cd.md).
  publish-dry-run:
    name: publish-dry-run
    needs: detect
    if: needs.detect.outputs.cargo == 'true' && needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - run: cargo publish --workspace --dry-run --locked

  dependency-review:
    name: dependency-review
    needs: detect
    # Pull requests only: the action compares the base..head dependency graph,
    # which a push has no diff for. Also gated on the workspace, so it stays
    # quiet while the repository has no manifest.
    if: github.event_name == 'pull_request' && needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Block a pull request that introduces a vulnerable or
          # disallowed-licence dependency. The licence policy mirrors
          # deny.toml once that file exists.
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ---- The single required check -------------------------------------------
  # conclusion is the one status check the branch ruleset requires. It `needs`
  # every other job and runs on always(), so it reports even when every gated
  # Rust lane is skipped. It fails when a needed job failed or was cancelled
  # and passes when every result is success or skipped. The results arrive
  # through env:, never spliced into run: (.claude/rules/ci-cd.md).
  # A person's pull request records acceptance of the contribution licensing
  # terms (CONTRIBUTING.md § Licensing of contributions) through the template's
  # checkbox; this gate is what makes the checkbox binding. Bot authors are
  # skipped: a bot cannot accept terms and its bumps carry no expression of its
  # own. The body is read when the step runs, and pr-guards.yml re-runs this
  # job when the description changes, so ticking the box takes effect (#1160).
  contribution-licence:
    name: contribution-licence-guard
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the description when the step runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The pull request body accepts the contribution licensing terms
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          PR_BODY=$(gh api "repos/${GH_REPO}/pulls/${PR}" --jq '.body // ""')
          export PR_BODY
          bash scripts/checks/contribution-licence.sh

  conclusion:
    name: conclusion
    needs:
      - contribution-licence
      - workflow-audit
      - workflow-lint
      - shellcheck
      - dockerfile-lint
      - container-config
      - comment-style
      - file-length
      - stray-literals
      - versions
      - profile-packages
      - favicon-sync
      - usage-report-off
      - todo-issues
      - tracker-helpers
      - detect
      - fmt
      - clippy
      - clippy-fhir-types
      - test
      - conformance
      - e2e
      - sqlx-offline
      - doc
      - cargo-deny
      - msrv
      - fhir-types-features
      - codegen-drift
      - codegen-emit-tests
      - omop-cdm-codegen-drift
      - changelog-guard
      - crate-version-guard
      - publish-dry-run
      - dependency-review
      - console
      - journeys
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every required job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needed job results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "* | *" cancelled "*)
              echo "a required job failed or was cancelled"
              exit 1
              ;;
          esac
          echo "all required jobs passed or were skipped"
