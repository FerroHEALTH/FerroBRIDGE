# The release lane. One workflow owns the `v*` tag, and every ordering in it is
# a `needs` edge:
#
#   plan ── github-release (draft) ─┬─ build-binaries ─┬─ build-image ─┬─ vulnerability-record ─┬─ finalize-release ── crates ── milestone
#                                   └─ build-console ──┴───────────────┘                        └─ scan-and-tag ─────────────────┘
#
# plan refuses a tag whose milestone (titled exactly as the tag) is missing or
# still holds an open item, or whose changelog section breaks the structure or
# Security rules (scripts/release/plan.sh), and milestone closes the milestone
# once every leg succeeded.
#
# The release is created as a DRAFT, the binaries, their SBOMs and their
# Sigstore bundles are attached to it, and only once the expected asset set is
# complete is it PUBLISHED. Publishing last means a half-assembled release is
# never visible, and a published release is immutable, so the draft is the only
# window the uploads have.
#
# build-binaries, build-image and build-console are `uses:` calls AND NOTHING ELSE, which is
# the deliberate shape rather than an accident of tidiness. SLSA v1.2 Build
# Level 3 requires the signing material to be out of reach of the user-defined
# build steps, and every step of one job shares one runner VM; a reusable
# workflow's job cannot carry `steps:` from its caller, which makes the
# regression unrepresentable rather than merely discouraged
# (https://docs.github.com/en/actions/security-for-github-actions/using-artifact-attestations/using-artifact-attestations-and-reusable-workflows-to-achieve-slsa-v1-build-level-3).
#
# The images are pushed by digest with no tag. vulnerability-record scans them
# and the server tarballs with no severity floor and refuses the release while
# a finding lacks an OpenVEX judgement under security/vex/; finalize-release
# and scan-and-tag both wait on it, so a refused release is neither published
# nor tagged. scan-and-tag runs the HIGH/CRITICAL gate on each digest and only
# then applies the tags.
#
# The workflow is dormant until a `v*` tag is pushed. It does not run on a push
# to main, on a pull request, or in a merge group.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to (re)publish. Dispatch this workflow AT that tag."
        required: true
        type: string

# A release must never be cancelled part-way through publishing: a draft with
# some assets attached is worse than a queued second run, so a second tag push
# queues behind the first rather than replacing it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# No permissions by default: each job grants its own, and the two build jobs
# grant theirs to the reusable workflow they call.
permissions: {}

jobs:
  # ---- plan: every release fact, verified before anything is created --------

  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read # the milestone titled as the tag
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      is-prerelease: ${{ steps.tag.outputs.is_prerelease }}
      targets: ${{ steps.workspace.outputs.targets }}
      console-targets: ${{ steps.workspace.outputs.console_targets }}
    steps:
      - id: tag
        name: Resolve and validate the release tag
        # The dispatch input reaches the shell through env, never spliced into
        # the script, and has to match a full semver tag shape before anything
        # downstream uses it.
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            # A dispatch names a tag but runs at whatever ref it was started
            # from, so the two are compared. Without this, a dispatch could
            # publish notes and binaries built from a different commit.
            if [ "${GITHUB_REF}" != "refs/tags/${tag}" ]; then
              echo "::error::dispatched at '${GITHUB_REF}', not at refs/tags/${tag}. Run: gh workflow run Release --ref ${tag} -f tag=${tag}" >&2
              exit 1
            fi
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if ! printf '%s\n' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$tag' is not a vX.Y.Z tag" >&2
            exit 1
          fi
          # A tag carrying a pre-release suffix (v1.2.3-rc.1) publishes as a
          # pre-release; a bare vX.Y.Z is an official release.
          case "$tag" in
            *-*) is_prerelease=true ;;
            *) is_prerelease=false ;;
          esac
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "is_prerelease=$is_prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "releasing ${tag} (pre-release: ${is_prerelease})"

      # github.sha is the commit the event ref points at, and the mismatch
      # refusal above guarantees it is the tag's commit on a dispatch too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # Every release fact, as ONE list: the milestone titled as the tag, the
      # product version in every file that declares it, the changelog's
      # structure and Security rules for this section, the previous release
      # taken by version from `git ls-remote`, and the changelog section as
      # the release notes with the support period and the link to the book's
      # CRA Annex II user information page appended. The list is
      # scripts/release/plan.sh; scripts/release/preflight.sh runs the same
      # list before the tag is pushed, so the two cannot drift. It names every
      # refused check, and writes release-notes.md for github-release. A
      # missing or empty section fails the release rather than falling back to
      # notes generated from the commit range.
      - name: Every release fact holds at the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/release/plan.sh checks "$TAG" --notes release-notes.md

      - id: workspace
        name: Name the binary targets
        # The target set is emitted once, here, and read both by the
        # build-binaries matrix and by the finalize asset check, so the two
        # cannot drift apart. Linux only, because the deliverable is a server,
        # and one native runner per architecture, so there is no
        # cross-compilation and no emulation anywhere in this lane. No
        # specification governs this: our own design.
        run: |
          set -euo pipefail
          targets='{"include":[
            {"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},
            {"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-musl"},
            {"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"},
            {"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl"}
          ]}'
          echo "targets=$(printf '%s' "$targets" | tr -d '\n ')" >> "$GITHUB_OUTPUT"
          # The operator console ships as an image on distroless static, so its
          # binary is built for the two static targets alone, each named by the
          # image platform it fills.
          console_targets='{"include":[
            {"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-musl","arch":"amd64"},
            {"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl","arch":"arm64"}
          ]}'
          echo "console_targets=$(printf '%s' "$console_targets" | tr -d '\n ')" >> "$GITHUB_OUTPUT"

      - name: Upload the release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  # ---- github-release: create the release as a DRAFT ------------------------

  github-release:
    name: github release (draft)
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      # Created as a DRAFT and finalized only after every asset is attached. A
      # draft is mutable, which is the window the binary uploads need, and it
      # is not visible to anyone browsing releases.
      - name: Create the release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          IS_PRERELEASE: ${{ needs.plan.outputs.is-prerelease }}
        run: |
          set -euo pipefail
          # The title is the bare version; the repository already says whose
          # release it is. --verify-tag refuses to invent a tag that is not
          # already on the remote.
          args=(
            --repo "$GITHUB_REPOSITORY"
            --draft
            --verify-tag
            --title "$VERSION"
            --notes-file release-notes.md
          )
          if [ "$IS_PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          state="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)"
          case "$state" in
            missing)
              gh release create "$TAG" "${args[@]}"
              ;;
            true)
              echo "a draft for $TAG already exists: refreshing its notes."
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$VERSION" --notes-file release-notes.md
              ;;
            *)
              # The recovery rule for a bad cut is a new patch version, never a
              # retag, so an already-published release is never reopened here.
              echo "::error::$TAG is already published. A bad cut ships forward as a new patch version; it is never retagged." >&2
              exit 1
              ;;
          esac

      # The quickstart compose file rides along as a release asset: it pulls
      # the image this tag publishes, so a downloader never clones the
      # repository.
      - name: Attach the quickstart compose file
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber compose.yaml

  # ---- build-binaries: the SLSA Build L3 lane, once per target --------------
  # A call and nothing else. See the graph comment at the top of this file:
  # the isolation is what makes the provenance unforgeable, and a job that
  # carries `uses:` cannot also carry `steps:`.
  build-binaries:
    name: binaries (${{ matrix.target }})
    needs: [plan, github-release]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.targets) }}
    # Declared on both sides: a called workflow receives the caller's token
    # permissions, and GitHub's Build L3 guide asks for the same set in both
    # places.
    permissions:
      contents: write # attach the per-target assets to the draft release
      id-token: write # Sigstore, for the provenance and SBOM attestations
      attestations: write # store them against this repository
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}

  # ---- build-image: the container from the attested musl binaries -----------
  # A call and nothing else, for the same Build L3 reason.
  build-image:
    name: image (linux/amd64, linux/arm64)
    needs: [plan, build-binaries]
    permissions:
      contents: read # the attestations API, to verify the inputs
      packages: write # push the image and its attestations to GHCR
      id-token: write # Sigstore, for the provenance and SBOM attestations
      attestations: write # store them against this repository
    uses: ./.github/workflows/release-image.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      version: ${{ needs.plan.outputs.version }}

  # ---- build-console: the operator console's binaries, bundle and image ------
  # A call and nothing else, for the same Build L3 reason. It attaches the
  # console's assets to the draft, so it waits for the draft to exist.
  build-console:
    name: console (binaries, site bundle, image)
    needs: [plan, github-release]
    permissions:
      contents: write # attach the console's assets to the draft release
      packages: write # push the image and its attestations to GHCR
      id-token: write # Sigstore, for the provenance and SBOM attestations
      attestations: write # store them against this repository
    uses: ./.github/workflows/release-console.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      version: ${{ needs.plan.outputs.version }}
      targets: ${{ needs.plan.outputs.console-targets }}

  # ---- vulnerability-record: every finding, judged, or no release -----------
  # CRA Annex I Part I(2)(a) (Regulation (EU) 2024/2847): products are made
  # available without known exploitable vulnerabilities. The scan-and-tag gate
  # blocks HIGH and CRITICAL findings that have a fix; this job scans the same
  # pushed digests and the four server tarballs with NO severity floor and NO
  # `ignore-unfixed`, and scripts/checks/vex-coverage.sh refuses the release
  # while any finding lacks an OpenVEX statement that judges it. It runs before
  # finalize-release and scan-and-tag, so a refused release stays a draft and
  # its images stay untagged.
  vulnerability-record:
    name: vulnerability record
    needs: [plan, github-release, build-binaries, build-image, build-console]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # read the draft's tarballs, attach the record to it
      packages: read # pull the digests the image jobs pushed
    env:
      # The one Trivy version of the release and the weekly scan, pinned in
      # docs/VERSIONS.md and read back by scripts/checks/versions.sh.
      TRIVY_VERSION: "0.73.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: The coverage check refuses what it claims to refuse
        run: bash scripts/checks/vex-coverage.sh --self-test
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v${{ env.TRIVY_VERSION }}
          cache: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Scan every image and tarball, every severity, fixed or not
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          TARGETS: ${{ needs.plan.outputs.targets }}
          BRIDGE_DIGEST: ${{ needs.build-image.outputs.digest }}
          CONSOLE_DIGEST: ${{ needs.build-console.outputs.digest }}
        run: |
          set -euo pipefail
          # An explicit empty config and ignore file: trivy reads ./trivy.yaml
          # and its ignore file by default, which would put the gate's floor
          # and its exceptions back into the record.
          : > "$RUNNER_TEMP/empty.yaml"
          : > "$RUNNER_TEMP/empty.ignore"
          scan=(--config "$RUNNER_TEMP/empty.yaml" --ignorefile "$RUNNER_TEMP/empty.ignore"
            --scanners vuln --severity "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
            --ignore-unfixed=false --format json --quiet)
          mkdir -p reports binaries
          targets=()
          for entry in "ferrobridge|$BRIDGE_DIGEST" "ferrobridge-console|$CONSOLE_DIGEST"; do
            image="${entry%%|*}"
            digest="${entry#*|}"
            case "$digest" in
              sha256:*) ;;
              *) echo "::error::no pushed digest for ${image}" >&2; exit 1 ;;
            esac
            for platform in linux/amd64 linux/arm64; do
              report="reports/${image}-${platform##*/}.json"
              trivy image "${scan[@]}" --platform "$platform" --output "$report" \
                "ghcr.io/ferrohealth/${image}@${digest}"
              targets+=("pkg:oci/${image}=${report}")
            done
          done
          while IFS= read -r target; do
            tarball="ferrobridge-${TAG}-${target}.tar.gz"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$tarball" --dir binaries
            mkdir -p "binaries/${target}"
            tar -C "binaries/${target}" -xzf "binaries/${tarball}"
            report="reports/ferrobridge-${target}.json"
            trivy rootfs "${scan[@]}" --output "$report" "binaries/${target}"
            targets+=("pkg:cargo/ferrobridge-server=${report}")
          done < <(printf '%s' "$TARGETS" | jq -r '.include[].target')
          printf '%s\n' "${targets[@]}" > targets.txt
      - name: Every finding carries an exploitability judgement
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t targets < targets.txt
          bash scripts/checks/vex-coverage.sh \
            --record "ferrobridge-${TAG}-vulnerability-record.json" "${targets[@]}"
          tar -czf "ferrobridge-${TAG}-trivy-reports.tar.gz" reports
      # Kept for a refused run too, so the findings to judge are one download
      # away rather than one re-run away.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vulnerability-record
          path: |
            reports/
            ferrobridge-*-vulnerability-record.json
          if-no-files-found: warn
          retention-days: 30
      - name: Attach the record to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "ferrobridge-${TAG}-vulnerability-record.json" \
            "ferrobridge-${TAG}-trivy-reports.tar.gz"

  # ---- scan-and-tag: the gate that makes the pushed digests referencable ---
  # A call and nothing else. vulnerability-record first: a release it refuses
  # gets no image tags.
  scan-and-tag:
    name: scan + tag
    needs: [build-image, build-console, vulnerability-record]
    permissions:
      contents: read # check out trivy.yaml, verify the attestations
      packages: write # pull the pushed digests, then tag them
    uses: ./.github/workflows/scan-and-tag.yml
    with:
      bridge-digest: ${{ needs.build-image.outputs.digest }}
      bridge-tags: ${{ needs.build-image.outputs.tags }}
      console-digest: ${{ needs.build-console.outputs.digest }}
      console-tags: ${{ needs.build-console.outputs.tags }}

  # ---- finalize-release: verify the asset set, then PUBLISH -----------------

  finalize-release:
    name: github release (publish)
    needs: [plan, github-release, build-binaries, build-image, build-console, vulnerability-record]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # publish the release
    steps:
      - name: The draft carries every asset this version promises
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          TARGETS: ${{ needs.plan.outputs.targets }}
          CONSOLE_TARGETS: ${{ needs.plan.outputs.console-targets }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "attached assets:"
          printf '%s\n' "$assets"
          missing=""
          # Every suffix release-build.yml uploads, per target. `grep -Fxq` is
          # a fixed string matched whole-line, so ".tar.gz" is not satisfied by
          # ".tar.gz.sha256sum".
          while IFS= read -r target; do
            for suffix in \
              ".tar.gz" \
              ".tar.gz.sha256sum" \
              ".tar.gz.sigstore.json" \
              ".tar.gz.sbom.sigstore.json" \
              ".tar.gz.build-sbom.sigstore.json" \
              ".tar.gz.intoto.jsonl" \
              ".cdx.json" \
              ".spdx.json"; do
              printf '%s\n' "$assets" | grep -Fxq "ferrobridge-${TAG}-${target}${suffix}" \
                || missing="$missing ferrobridge-${TAG}-${target}${suffix}"
            done
          done < <(printf '%s' "$TARGETS" | jq -r '.include[].target')
          # Every suffix release-console.yml uploads: per console target, and
          # once for the architecture-independent site bundle.
          while IFS= read -r target; do
            for suffix in \
              ".tar.gz" \
              ".tar.gz.sha256sum" \
              ".tar.gz.sigstore.json" \
              ".tar.gz.sbom.sigstore.json" \
              ".tar.gz.intoto.jsonl" \
              ".spdx.json"; do
              printf '%s\n' "$assets" | grep -Fxq "ferrobridge-console-${TAG}-${target}${suffix}" \
                || missing="$missing ferrobridge-console-${TAG}-${target}${suffix}"
            done
          done < <(printf '%s' "$CONSOLE_TARGETS" | jq -r '.include[].target')
          for suffix in ".tar.gz" ".tar.gz.sha256sum" ".tar.gz.sigstore.json" ".tar.gz.intoto.jsonl"; do
            printf '%s\n' "$assets" | grep -Fxq "ferrobridge-console-${TAG}-site${suffix}" \
              || missing="$missing ferrobridge-console-${TAG}-site${suffix}"
          done
          printf '%s\n' "$assets" | grep -Fxq "compose.yaml" || missing="$missing compose.yaml"
          for record in "ferrobridge-${TAG}-vulnerability-record.json" "ferrobridge-${TAG}-trivy-reports.tar.gz"; do
            printf '%s\n' "$assets" | grep -Fxq "$record" || missing="$missing $record"
          done
          if [ -n "$missing" ]; then
            echo "::error::the draft is missing assets, so it will not be published:$missing" >&2
            exit 1
          fi
          echo "every expected asset is attached."

      # `make_latest` marks this release as the repository's latest, which a
      # pre-release must never be.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          IS_PRERELEASE: ${{ needs.plan.outputs.is-prerelease }}
        run: |
          set -euo pipefail
          if [ "$IS_PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi

  # ---- crates.io: the library crates, after the release is public -----------
  # The crates leg runs once the GitHub release is published, so a failed
  # upload never leaves a release half-cut. Authentication is Trusted
  # Publishing (OIDC), and the `crates-io` environment's required reviewer
  # pauses the leg until the owner approves it. The shared implementation is
  # scripts/release/publish-crates.sh, which publish-crates.yml also calls.
  crates:
    name: crates.io
    needs: [plan, finalize-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: crates-io
    # Shared with publish-crates.yml: two runs uploading the same immutable
    # versions never interleave. Queue, never cancel.
    concurrency:
      group: publish-crates
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC token exchange (rust-lang/crates-io-auth-action)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache in the lane that uploads to crates.io: a published version is
      # immutable, so it is built from this checkout and nothing else.
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - id: auth
        name: Exchange the OIDC identity for a temporary crates.io token
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish the crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: bash scripts/release/publish-crates.sh publish
      # The registry is the ground truth, so the read-back runs even when the
      # upload step went red.
      - name: Verify every crate resolves at its manifest version
        if: always()
        run: bash scripts/release/publish-crates.sh verify

  # ---- milestone: close the release's milestone ------------------------------
  # Runs after every leg, the approval-gated crates leg included. `always()`
  # keeps the job in the graph when a leg fails, so its log names that leg and
  # the milestone stays open; a re-run of the failed jobs closes it. An
  # already-closed milestone counts as done.
  milestone:
    name: close the milestone
    needs: [plan, github-release, build-binaries, build-image, build-console, vulnerability-record, scan-and-tag, finalize-release, crates]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the script
      issues: write # close the milestone
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Close the milestone titled as the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash scripts/release/milestone.sh close "$TAG"
