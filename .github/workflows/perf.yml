# The performance gate (#1656), called by ci.yml on a change that reaches the
# bridge and by release.yml on the release commit. Each attempt job builds
# the release binary of the commit and of its base, installs ferrohealth-perf
# (FerroHEALTH/FerroSYS#249) at its docs/VERSIONS.md pin and runs
# scripts/perf/gate.sh once through .github/actions/perf-attempt: the tool's
# A/B mode, the head's idle phase held to absolute limits with every
# background worker running, then pairs of load phases against the base and
# the head on the same runner, the head judged over the base, and the
# planted poller of the head's CDR database the idle phase must fail. The
# base is the merge base of the commit with the `base` input, or with none
# the previous release.
# An attempt that ends with exit 2 could not be judged and says nothing about
# the code, so it is retried on a fresh runner on any CPU model. Some runners
# stall the gate for a whole job (FerroHEALTH/FerroPIX#511), so an attempt
# that ends with exit 1 on a CPU model STALL_PRONE lists is retried too, and
# so is an attempt job that ends cancelled while the run itself was not
# cancelled (a runner that shut down mid-job ends with no exit code). At most
# two retries run. The verdict job passes the gate when the last attempt that
# ran passed; a breach on any other model fails at once, with no retry, and a
# run cancelled by its concurrency group or by a person retries nothing.
# No specification governs this: our own design.
name: Perf

on:
  workflow_call:
    inputs:
      base:
        description: >-
          The commit or ref the base is the merge base with: the pull
          request's base, the merge group's, or the commit before a push.
          Empty takes the previous release.
        required: false
        default: ""
        type: string
      cache:
        description: Restore and save the Rust build cache; the release lane passes false.
        required: false
        default: true
        type: boolean

permissions: {}

env:
  # A called workflow does not inherit the caller's env, so the cap ci.yml
  # sets is repeated here: the hosted runner has four cores and 16 GB, and a
  # release build never compiles a generated giant beside three other crates.
  CARGO_BUILD_JOBS: "2"
  FERROHEALTH_PERF_VERSION: 0.5.2
  FERROBRIDGE__USAGE_REPORT__ENABLED: "false"
  # The CPU models whose runners stall every route for 100 to 300 ms for a
  # whole job (FerroHEALTH/FerroPIX#511), one per line. A breach is retried
  # only on one of them; an exit 2 is retried on any model.
  STALL_PRONE: |
    AMD EPYC 9V74 80-Core Processor

jobs:
  perf:
    name: perf (attempt 1)
    runs-on: ubuntu-24.04
    # 90 while a base still compiles all five FHIR releases under swap (about
    # 28 minutes) before the head and the measurement; #1743 lowers it again.
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      code: ${{ steps.attempt.outputs.code }}
      retryable: ${{ steps.attempt.outputs.retryable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base is built from history, so every commit is fetched.
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          cache: ${{ inputs.cache && 'true' || 'false' }}
      - id: attempt
        uses: ./.github/actions/perf-attempt
        with:
          attempt: "1"
          base: ${{ inputs.base }}
          version: ${{ env.FERROHEALTH_PERF_VERSION }}
          stall-prone: ${{ env.STALL_PRONE }}

  perf-retry:
    name: perf (attempt 2)
    needs: perf
    # A cancelled attempt lost its runner while the run went on; !cancelled()
    # keeps a run cancelled by its concurrency group or a person from retrying.
    if: ${{ !cancelled() && (needs.perf.outputs.retryable == 'true' || needs.perf.result == 'cancelled') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      code: ${{ steps.attempt.outputs.code }}
      retryable: ${{ steps.attempt.outputs.retryable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base is built from history, so every commit is fetched.
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          cache: ${{ inputs.cache && 'true' || 'false' }}
      - id: attempt
        uses: ./.github/actions/perf-attempt
        with:
          attempt: "2"
          base: ${{ inputs.base }}
          version: ${{ env.FERROHEALTH_PERF_VERSION }}
          stall-prone: ${{ env.STALL_PRONE }}

  perf-retry-2:
    name: perf (attempt 3)
    needs: perf-retry
    # A cancelled attempt lost its runner while the run went on; !cancelled()
    # keeps a run cancelled by its concurrency group or a person from retrying.
    if: ${{ !cancelled() && (needs.perf-retry.outputs.retryable == 'true' || needs.perf-retry.result == 'cancelled') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      code: ${{ steps.attempt.outputs.code }}
      retryable: ${{ steps.attempt.outputs.retryable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base is built from history, so every commit is fetched.
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          cache: ${{ inputs.cache && 'true' || 'false' }}
      - id: attempt
        uses: ./.github/actions/perf-attempt
        with:
          attempt: "3"
          base: ${{ inputs.base }}
          version: ${{ env.FERROHEALTH_PERF_VERSION }}
          stall-prone: ${{ env.STALL_PRONE }}

  # The gate passes when the last attempt that ran passed. An attempt job
  # that failed fails it, and so does a cancelled attempt no later attempt
  # followed (scripts/perf/verdict.sh).
  verdict:
    name: perf verdict
    needs: [perf, perf-retry, perf-retry-2]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Every step runs on a cancelled run too, so the summary still names it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: always()
        with:
          persist-credentials: false
          sparse-checkout: scripts/perf
      # cancelled() is read only in an `if`, so a step records it.
      - name: The run was cancelled
        if: cancelled()
        run: echo "RUN_CANCELLED=true" >> "$GITHUB_ENV"
      - name: The last attempt passed
        if: always()
        env:
          RESULT_1: ${{ needs.perf.result }}
          RESULT_2: ${{ needs.perf-retry.result }}
          RESULT_3: ${{ needs.perf-retry-2.result }}
          CODE_1: ${{ needs.perf.outputs.code }}
          CODE_2: ${{ needs.perf-retry.outputs.code }}
          CODE_3: ${{ needs.perf-retry-2.outputs.code }}
        run: bash scripts/perf/verdict.sh
