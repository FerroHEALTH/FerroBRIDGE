# .github/dependabot.yml: automated dependency updates.
#
# Three ecosystems, all three live. `github-actions` bumps the digest-pinned
# actions the workflows in this directory use, `cargo` the workspace
# dependencies and the fuzz crate's own lock under fuzz/, and `docker` the digest-pinned base image of docker/Dockerfile.
#
# COOLDOWN is the delay between a release being published and this bot
# proposing it, so a compromised or yanked release has a window to be caught
# before it reaches a pull request (the OWASP CI/CD Security Cheat Sheet's
# third-party-code control). Every entry sits at 7 days or more, the floor
# zizmor's `dependabot-cooldown` audit enforces, and the audit runs over this
# file in CI (#34). The cargo entry exempts the FerroHEALTH family's own
# crates, which are first-party code.
#
# SCHEDULE AND GROUPS: every ecosystem runs weekly at one shared time, Monday
# 05:00 Europe/Amsterdam, and one group per ecosystem takes all its version
# updates, so each ecosystem opens at most one pull request a week (owner
# decision of 2026-11-09). The cargo entry keeps the family group beside it.
# Groups apply to version updates only, so a security update still opens its
# own pull request.
#
# SECURITY updates are exempt by design: Dependabot applies no cooldown to
# advisory-driven bumps, so an advisory still arrives immediately. That is what
# makes a cooldown safe rather than a delay on getting fixes.
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - "dependencies"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Amsterdam"
    # `semver-major-days` is not accepted for this ecosystem, so `default-days`
    # covers every bump. A week costs nothing here: the schedule is weekly
    # anyway and a security bump ignores the cooldown.
    cooldown:
      default-days: 7
    groups:
      # ONE weekly PR for every action bump, majors included.
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/fuzz"
    # Dependency bumps default to the changelog-guard escape: triage adds a
    # fragment when a bump is user-visible, which the guard accepts with the
    # label present.
    labels:
      - "dependencies"
      - "no-changelog"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Amsterdam"
    # Longer for a major than for an action: a compromised crate executes in
    # the build and ships in the binary, which is the higher-consequence case.
    cooldown:
      default-days: 7
      semver-major-days: 14
      # Our own crates, published through Trusted Publishing: a cooldown only keeps us behind.
      exclude:
        - "ferrohealth-*"
        - "openehr-*"
        - "ihe-*"
        - "ehds-*"
    open-pull-requests-limit: 10
    groups:
      # The crates of the FerroHEALTH family, which the products pin exactly:
      # ferrohealth-* (FerroSYS, FerroAUTH, FerroUI), openehr-* (FerroEHR's
      # lockstep 0.0.x line, where every bump counts as a major) and ihe-*
      # and ehds-* (FerroAUDIT). ONE PR moves the family together, since a
      # family crate often requires another's new version. It stands first
      # so a family crate never lands in the group below.
      ferrohealth-family:
        patterns: ["ferrohealth-*", "openehr-*", "ihe-*", "ehds-*"]
      # ONE PR for every other bump, majors included; lockstep families
      # (serde, axum and tower) bump together inside it by construction.
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "docker"
    # The two container recipes, docker/Dockerfile (#22) and
    # docker/console/Dockerfile (#603), on one base that
    # scripts/checks/versions.sh holds equal. The image tags in compose.yaml
    # are not this ecosystem's subject: the bridge and console tags are the
    # workspace version, which the release cut moves and versions.sh guards,
    # and the PostgreSQL pin is a docs/VERSIONS.md row shared with the test
    # harness.
    directories:
      - "/docker"
      - "/docker/console"
    # The changelog-guard escape, as for the cargo bumps above.
    labels:
      - "dependencies"
      - "no-changelog"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Amsterdam"
    # The base image is pinned by index digest, so a bump is a change of
    # digest. `semver-major-days` is not accepted for this ecosystem either.
    cooldown:
      default-days: 7
    groups:
      # ONE weekly PR for both recipes, which share one base.
      docker:
        patterns: ["*"]
    commit-message:
      prefix: "build"
