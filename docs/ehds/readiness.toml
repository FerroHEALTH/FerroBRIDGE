#
# The EHDS readiness matrix: per priority category of Regulation (EU)
# 2025/327 Article 14(1), each target profile with the committed template it
# maps from, the context that maps it, and the round-trip test that proves
# the transform. crates/fhirconnect/tests/it/readiness.rs checks every path
# and test named here and renders the matrix into
# website/book/src/evaluate/ehds-readiness.md; a row whose template, context
# or test is gone fails that test rather than being skipped. No
# specification governs this file: our own design.
#
# Paths are relative to the workspace root. A test is `<file>::<function>`.
# `target` is what the matrix shows; `profile` is the canonical the context's
# project directory must name, unless `claimed = false` says the resource is
# produced without claiming it.

[[category]]
article = "14(1)(a)"
name = "Patient summaries"
note = "HL7 Europe Patient Summary 1.0.0-ballot is pinned for the profile validator; no context maps its Composition yet. The Base and Core profiles below are its building blocks."

