# The plan of the performance gate (ferrohealth-perf, FerroHEALTH/FerroSYS
# #249), run by scripts/perf/gate.sh in the A/B mode against the base and the
# head bridge, each under its own tree's perf/ferrobridge.toml and
# perf/arm.env and over its own FerroEHR CDR. The
# gate seeds each arm's CDR through its facade and gives each arm the values
# of the upper-case placeholders between at signs, so the committed plan names
# no id and the read names the Condition each arm's CDR stored. The creates
# write into one subject's EHR and the read and the search read another's,
# whose content never changes, so a read is as fast at the end of the window
# as at its start. The ORU^R01 goes to the HL7 v2 face over MLLP with TLS as
# the PERFLAB sender. No specification governs this: our own design.

[idle]
duration_secs = 60
max_cpu_percent = 2.0
# The events lane reads the CDR's outbox once a second with nothing to
# deliver, about four transactions a second with the CDR's own; the planted
# poller makes thousands.
max_transactions_per_second = 5.0
settle_secs = 11

[load]
rate = 20.0
warmup_secs = 10
duration_secs = 60
# The PERFLAB sender's certificate and key, and the CA of the face's
# certificate, both written by the gate.
client_identity_file = "target/perf-run/tls/perflab.pem"
trust_roots_file = "target/perf-run/tls/ca.pem"

# The CapabilityStatement built from the loaded programs (R4 http.html
# "capabilities").
[[requests]]
group = "metadata"
method = "GET"
path = "/fhir/metadata"
status = 200

# A create mapped through FHIRconnect and committed as one composition
# (R4 http.html "create").
[[requests]]
group = "create"
method = "POST"
path = "/fhir/Condition"
status = 201
body = '''@CREATE_BODY@'''
headers = { content-type = "application/fhir+json" }

# A read of the seeded Condition, its composition mapped back to FHIR
# (R4 http.html "read").
[[requests]]
group = "read"
method = "GET"
path = "/fhir/Condition/@READ_ID@"
status = 200

# A search over the AQL projection the search file declares, held to the
# seeded subject (R4 search.html).
[[requests]]
group = "search"
method = "GET"
path = "/fhir/Condition?@SEARCH@"
status = 200

# A laboratory result written through the HL7 v2 face's Observation context,
# acknowledged AA (HL7 v2.5.1 chapter 2 §2.9.2.2).
[mllp]
tls = true

[[messages]]
group = "oru"
file = "perf/messages/oru-r01.hl7"
