# The bridge the performance gate measures (scripts/perf/gate.sh): every
# lane a deployment runs at once, over the pinned FerroEHR CDR and RabbitMQ
# the gate starts on loopback. The facade serves the request set; the HL7 v2
# listener and the change feed's events lane run beside it, so the idle phase
# measures them with nothing to do. Every path is relative to the checkout,
# and target/perf-run/ is the gate's own work directory. No specification
# governs this: our own design.

[server]
listen = "127.0.0.1:18080"

[cdr]
base_url = "http://127.0.0.1:18090/ferroehr/rest/openehr/v1"

[mappings]
directory = "app/ferrobridge-server/tests/it/repeated"

[operations]
enabled = false

[facade]
enabled = true
base_url = "http://127.0.0.1:18080/fhir"
ehr_policy = "create_on_first_write"
identity_store = "target/perf-run/identity.redb"
composition_language = "en"
composition_territory = "NL"

# The gate runs on a runner no other caller reaches, as the [auth] section
# of the Operate pages allows; the request set then carries no token.
[auth]
enabled = false

[hl7v2]
enabled = true
listen = "127.0.0.1:12575"
concept_maps = "tools/fhir-codegen/vendor/hl7.fhir.uv.v2mappings/package"
senders = [{ namespace_id = "PERFLAB", certificate_subject = "perflab.example.org" }]

[hl7v2.tls]
certificate_file = "target/perf-run/tls/mllp-chain.pem"
key_file = "target/perf-run/tls/mllp-key.pem"
client_ca_file = "target/perf-run/tls/ca.pem"

[change_feed]
enabled = true
source = "ferroehr"
url = "http://127.0.0.1:18090/ferroehr/rest/extensions/v1"
dead_letters = "target/perf-run/dead-letters.redb"

[events]
enabled = true
reader = "ferrobridge-perf-events"
url = "amqp://guest:guest@127.0.0.1:15672/%2f"
exchange = "ferrobridge.perf"

[usage_report]
enabled = false
