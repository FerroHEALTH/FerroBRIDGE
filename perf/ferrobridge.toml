# The bridge the performance gate measures (scripts/perf/gate.sh), as the
# head and as the base: every lane a deployment runs at once, over the pinned
# FerroEHR CDR and RabbitMQ the gate starts on loopback. The facade serves the
# requests and the HL7 v2 face the ORU^R01 of the plan; the change feed's
# events lane runs beside them, so the idle phase measures it with nothing to
# do. Every path is relative to the arm's tree; the gate sets the listeners,
# the CDR, the mapping directory and the work files of each arm through the
# FERROBRIDGE__ variables of perf/arm.env beside this file, which each tree
# carries for its own binary. No specification governs this: our own design.

[server]
listen = "127.0.0.1:18080"

[cdr.endpoint]
url = "http://127.0.0.1:18090/ferroehr/rest/openehr/v1"

[mappings]
directory = "app/ferrobridge-server/tests/it/repeated"

[operations]
enabled = false

[facade]
enabled = true
base_url = "http://127.0.0.1:18080/fhir"
ehr_policy = "create_on_first_write"
identity_store = "target/perf-run/identity.redb"
composition_language = "en"
composition_territory = "NL"

# The gate runs on a runner no other caller reaches, as the [auth] section
# of the Operate pages allows; the request set then carries no token.
[auth]
enabled = false

[hl7v2]
enabled = true
listen = "127.0.0.1:12575"
senders = [{ namespace_id = "PERFLAB", certificate_subject = "perflab.example.org" }]
# The profile of the face's Observation context in
# app/ferrobridge-server/tests/it/hl7v2_fixtures, so an OBX reaches it.
profiles = [{ resource_type = "Observation", profile = "http://example.org/fhir/StructureDefinition/ferrobridge-hl7v2-observation" }]

[hl7v2.tls]
certificate_file = "target/perf-run/tls/mllp-chain.pem"
key_file = "target/perf-run/tls/mllp-key.pem"
client_ca_file = "target/perf-run/tls/ca.pem"

[change_feed]
enabled = true
source = "ferroehr"
url = "http://127.0.0.1:18090/ferroehr/rest/extensions/v1"
dead_letters = "target/perf-run/dead-letters.redb"

[events]
enabled = true
reader = "ferrobridge-perf-events"
url = "amqp://guest:guest@127.0.0.1:15672/%2f"
exchange = "ferrobridge.perf"

[usage_report]
enabled = false
